<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kumsal Spor • Sporcu Performans</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.wrap{max-width:1050px;margin:auto}.brand,.card{background:#101d2d;border:1px solid #294058;border-radius:14px}.brand{padding:14px}.orange{color:#f97316}.sub{color:#9fb0c2;font-size:12px}.card{margin:10px 0;overflow:hidden}.head{padding:11px 13px;background:#17283b;font-weight:900}.body{padding:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#0d1a29;border:1px solid #294058;border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:20px;color:#fde68a}.note{padding:10px;border-left:3px solid #f97316;background:#0b1625;color:#cbd5e1;margin:8px 0}label{display:block;font-size:10px;color:#a9b8c8;font-weight:900;margin-bottom:5px}select{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border-bottom:1px solid #294058;padding:7px;text-align:left}.table th{background:#17283b}.bar{height:12px;background:#26384c;border-radius:8px;overflow:hidden;margin:4px 0}.fill{height:100%;background:#f97316}.good{color:#86efac;font-weight:900}.warn{color:#fbbf24;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.table{font-size:10px}}</style></head><body><div class="wrap"><div class="brand"><b><span class="orange">KUM</span>SAL SPOR • SPORCU PERFORMANS</b><div class="sub">PB + Test + CSS + Enerji Sistemi Kalibrasyonu • V13 çekirdeğine dokunmaz</div></div><div class="card"><div class="head">👤 SPORCU SEÇ</div><div class="body"><label>SPORCU</label><select id="ath"></select><label style="margin-top:8px">HAVUZ</label><select id="course"><option value="25">25 m SCM</option><option value="50">50 m LCM</option></select></div></div><div id="out"></div></div><script>(()=>{const $=x=>document.getElementById(x);function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function tests(){try{return JSON.parse(localStorage.getItem('ybTests13')||'[]')}catch(e){return[]}}function fmt(s){if(!s||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}const F={A1:[1.18,1.28],A2:[1.10,1.18],A3:[1.05,1.11],END2:[.99,1.04],END3:[.94,.99],SPR1:[.88,.95],SPR2:[.82,.90],SPR3:[.72,.84]};function range(base,sys,d){if(!base)return'—';let f=F[sys];return fmt(base*f[0]*d/100)+'–'+fmt(base*f[1]*d/100)}function render(){let name=$('ath').value,c=$('course').value,a=athletes().find(x=>x.name===name);if(!a){$('out').innerHTML='<div class="note">V13 Sporcu ekranından sporcu kaydet.</div>';return}let tt=tests().filter(x=>x.name.toLowerCase()===name.toLowerCase()&&x.course===c&&x.css).sort((x,y)=>x.date.localeCompare(y.date));let testCss=tt.length?tt[tt.length-1].css:null,p=a.pb?.[c]||{},pbCss=p[400]&&p[200]?(p[400]-p[200])/2:null,base=testCss||pbCss;let delta=tt.length>1?tt[tt.length-1].css-tt[0].css:null;let systems=['A1','A2','A3','END2','END3','SPR1','SPR2','SPR3'];let hist=tt.length?`<table class="table"><tr><th>Tarih</th><th>CSS /100</th><th>Değişim</th></tr>${tt.map((x,i)=>{let d=i?x.css-tt[i-1].css:null;return`<tr><td>${x.date}</td><td>${fmt(x.css)}</td><td class="${d<0?'good':d>0?'warn':''}">${d==null?'—':(d>0?'+':'')+d.toFixed(2)+' sn'}</td></tr>`}).join('')}</table>`:'<div class="note">Bu kulvarda henüz doğrulanmış CSS testi yok.</div>';let max=tt.length?Math.max(...tt.map(x=>x.css)):1;let chart=tt.map(x=>`<div style="margin:7px 0"><small>${x.date} • ${fmt(x.css)}</small><div class="bar"><div class="fill" style="width:${Math.max(10,100-(x.css/max*100-80)*3)}%"></div></div></div>`).join('');$('out').innerHTML=`<div class="grid"><div class="kpi"><b>${fmt(pbCss)}</b>PB-CSS /100</div><div class="kpi"><b>${fmt(testCss)}</b>TEST-CSS /100</div><div class="kpi"><b>${delta==null?'—':(delta>0?'+':'')+delta.toFixed(2)+' sn'}</b>İLK→SON</div></div><div class="card"><div class="head">🎯 AKTİF KALİBRASYON</div><div class="body"><div class="note"><b>Aktif referans:</b> ${testCss?'Son doğrulanmış CSS testi':'200/400 PB türevi CSS'} • ${fmt(base)}/100 m. Test CSS varsa önceliklidir; tek kötü testte programı otomatik değiştirme.</div><table class="table"><tr><th>Sistem</th><th>50 m</th><th>100 m</th><th>200 m</th><th>400 m</th></tr>${systems.map(s=>`<tr><td><b>${s}</b></td><td>${range(base,s,50)}</td><td>${range(base,s,100)}</td><td>${range(base,s,200)}</td><td>${range(base,s,400)}</td></tr>`).join('')}</table></div></div><div class="card"><div class="head">📈 CSS GELİŞİMİ</div><div class="body">${hist}${chart}</div></div><div class="card"><div class="head">🧠 KOÇ KARARI</div><div class="body"><div class="note">CSS hızlandıysa (süre düştüyse) önce 1–2 END2 seansında yeni hedefi doğrula. Stabil split + teknik kalite korunuyorsa yeni referansı kullan. CSS yavaşladıysa son 7 günlük yük, uyku/hastalık, RPE ve teknik kaliteyi kontrol et; tek sonuçla hedefleri düşürme.</div></div></div>`}$('ath').innerHTML='<option value="">Sporcu seç</option>'+athletes().map(x=>`<option>${x.name}</option>`).join('');$('ath').onchange=render;$('course').onchange=render;render()})();</script></body></html>
