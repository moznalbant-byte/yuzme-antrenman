<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Kumsal Spor Yüzme Bilim V13</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.wrap{max-width:980px;margin:auto}.brand{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid #294058;border-radius:16px;background:#101d2d}.brand b{font-size:24px}.orange{color:#f97316}.sub{color:#9fb0c2;font-size:12px}.nav,.seg{display:flex;gap:6px;flex-wrap:wrap}.nav{margin:10px 0}.nav button{flex:1}button{border:1px solid #2a4058;background:#14253a;color:#fff;border-radius:10px;padding:10px;font-weight:800}button.on,.save{background:#f97316;border-color:#f97316}.screen{display:none}.screen.on{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.box,.card,.kpi{background:#101d2d;border:1px solid #294058;border-radius:14px}.box{padding:10px}label{display:block;font-size:10px;color:#a9b8c8;font-weight:900;margin-bottom:5px}input,select{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-size:15px;font-weight:800}.status,.phase,.note{padding:11px;border-radius:12px;margin:9px 0}.status{background:#0d2b22;border:1px solid #1e5b49;text-align:center;font-weight:900}.phase{background:#2a1c0b;border:1px solid #75420d;color:#fed7aa}.note{background:#13283c;border:1px solid #31506d;color:#d8e6f3}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.kpi{text-align:center;padding:9px}.kpi b{display:block;font-size:17px}.card{margin:9px 0;overflow:hidden}.head{padding:10px 12px;font-weight:900}.body{padding:12px;line-height:1.5}.warm .head{background:#2563eb}.tech .head{background:#0891b2}.support .head{background:#9333ea}.main .head{background:#dc2626}.race .head{background:#7c3aed}.cool .head{background:#159447}.coach .head{background:#475569}.ath .head{background:#b45309}.meter{float:right;background:#07111f;padding:2px 8px;border-radius:9px;font-size:12px}.row{padding:8px 0;border-bottom:1px solid #26384c}.row:last-child{border:0}.calc{font-weight:900;color:#fde68a}.why{margin-top:9px;padding:9px;border-left:3px solid #f97316;background:#0b1625;color:#cbd5e1;font-size:12px}.good{color:#86efac;font-weight:900}.warn{color:#fbbf24;font-weight:900}.pace{display:grid;grid-template-columns:64px repeat(4,1fr);gap:1px;background:#294058;margin-top:8px}.pace div{background:#101d2d;padding:6px 3px;text-align:center;font-size:10px}.pace .h{font-weight:900;background:#17283b}@media(max-width:560px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr 1fr}.pace{grid-template-columns:54px repeat(4,1fr)}}</style></head><body><div class="wrap"><div class="brand"><div><b><span class="orange">KUM</span>SAL SPOR</b><div class="sub">Yüzme Bilim • Koç Karar Destek Sistemi</div></div><div class="orange"><b>V13</b></div></div><div class="nav"><button class="on" data-page="training">ANTRENMAN</button><button data-page="athlete">👤 SPORCU</button><button data-page="season">SEZON</button><button data-page="academy">🎓 AKADEMİ</button></div><section id="training" class="screen on"><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date" value="2026-09-22"></div><div class="box"><label>SPORCU</label><select id="athSel"></select></div><div class="box"><label>PROFİL</label><div class="seg" id="profile"><button data-v="Sprint">SPRINT</button><button data-v="Orta" class="on">ORTA</button><button data-v="Uzun">UZUN</button></div></div><div class="box"><label>HAVUZ</label><select id="pool"><option value="25">25 m Kısa Kulvar (SCM)</option><option value="50">50 m Uzun Kulvar (LCM)</option></select></div><div class="box"><label>SEANS</label><div class="seg" id="session"><button data-v="AM" class="on">AM</button><button data-v="PM">PM</button><button data-v="Tek">TEK</button></div></div></div><div id="result"></div></section><section id="athlete" class="screen"><div class="card ath"><div class="head">SPORCU PROFİLİ + KULVAR BAZLI PB</div><div class="body"><div class="grid"><div><label>SPORCU ADI</label><input id="aname" placeholder="Ad Soyad"></div><div><label>ANA PROFİL</label><select id="aprofile"><option>Sprint</option><option selected>Orta</option><option>Uzun</option></select></div><div><label>PB KULVARI</label><select id="acourse"><option value="25">25 m SCM</option><option value="50">50 m LCM</option></select></div><div><label>50 SERBEST PB</label><input id="p50" placeholder="28.73"></div><div><label>100 SERBEST PB</label><input id="p100" placeholder="1:02.50"></div><div><label>200 SERBEST PB</label><input id="p200"></div><div><label>400 SERBEST PB</label><input id="p400"></div><div><label>800 SERBEST PB</label><input id="p800"></div><div><label>1500 SERBEST PB</label><input id="p1500"></div></div><button id="saveAth" class="save" style="width:100%;margin-top:10px">SPORCUYU KAYDET / GÜNCELLE</button><div id="athOut"></div></div></div></section><section id="season" class="screen"><div class="card coach"><div class="head">2026–2027 ÇİFT ZİRVELİ SEZON</div><div class="body">Pazartesi OFF<br>Salı AM + PM<br>Çarşamba TEK<br>Perşembe AM + PM<br>Cuma TEK<br>Cumartesi AM + PM<br>Pazar AM + PM<br><b>= 10 su birimi / hafta</b><br><br>Aralık 3. hafta: ANA YARIŞ 1<br>Mayıs 2. hafta: ANA YARIŞ 2</div></div></section><section id="academy" class="screen"><div id="lessons"></div></section></div><script>(()=>{const $=id=>document.getElementById(id),S={profile:'Orta',session:'AM'},DN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];const EDU={A1:['Toparlanma','Düşük yük ve teknik kalite'],A2:['Aerobik koruma','Ekonomik aerobik yüzme'],A3:['Aerobik gelişim','Sürdürülebilir aerobik hacim'],END2:['Eşik','CSS/eşik çevresinde sürdürülebilir yüksek aerobik hız'],END3:['Yüksek aerobik güç','Eşik üstü VO₂ yönelimli kalite'],SPR1:['Laktat toleransı','Yüksek asidozda teknik ve yarış sonu hızını koruma'],SPR2:['Anaerobik güç','Yüksek glikolitik güç ve kaliteli hız'],SPR3:['Saf hız','ATP-PC / nöromüsküler maksimum hız'],RP:['Race Pace','Hedef yarış split ve ritmi']};$('lessons').innerHTML=Object.entries(EDU).map(([k,v])=>`<div class="card coach"><div class="head">${k} — ${v[0]}</div><div class="body">${v[1]}</div></div>`).join('');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.page).classList.add('on');if(b.dataset.page==='athlete')showAth()});['profile','session'].forEach(id=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S[id]=b.dataset.v;render()}));const SCH={Salı:{AM:['A3','Aerobik hacim + ekonomi'],PM:['SPR3','Saf hız + teknik']},Çarşamba:{Tek:['END2','Eşik dayanıklılığı']},Perşembe:{AM:['A3','Aerobik kuvvet / pull'],PM:['RP','Yarış temposu']},Cuma:{Tek:['A2','Aerobik teknik / toparlanabilir kalite']},Cumartesi:{AM:['END3','Yüksek aerobik güç'],PM:['SPR1','Laktat toleransı']},Pazar:{AM:['A3','Uzun aerobik / fartlek'],PM:['SPR2','Anaerobik güç + beceri']}};const LIB={Uzun:{A2:['3 tur',[['1×800 A2 negatif',800],['4×200 pull DPS',800],['4×100 teknik reset',400]]],A3:['3 tur',[['1×1000 fartlek A1/A2/A3',1000],['4×200 pull negatif',800],['4×100 teknik tempo',400]]],END2:['3 tur',[['1×600 END2',600],['4×200 END2',800],['4×100 A2 reset',400]]],END3:['4 tur',[['4×150 END3',600],['1×200 A1 reset',200]]],RP:['3 tur',[['4×200 800/1500 RP',800],['4×50 dönüş+breakout',200]]],SPR1:['3 tur',[['4×100 yarış sonu kalite',400],['1×200 A1',200]]],SPR2:['3 tur',[['6×50 maksimum kalite',300],['1×300 A1',300]]],SPR3:['3 tur',[['8×25 maksimum',200],['1×200 kolay',200]]]},Orta:{A2:['4 tur',[['1×600 A2 değişken',600],['2×100 teknik',200]]],A3:['3 tur',[['1×600 A2/A3',600],['4×100 DPS/build',400],['4×50 pull/swim',200],['1×200 negatif',200]]],END2:['3 tur',[['4×200 END2',800],['4×100 END2',400]]],END3:['3 tur',[['4×200 END3',800],['4×100 A2 reset',400]]],RP:['4 tur',[['2×100 400 RP',200],['4×50 200 RP',200]]],SPR1:['4 tur',[['3×75 güçlü',225],['1×100 A1',100]]],SPR2:['4 tur',[['4×50 maksimum',200],['1×200 A1',200]]],SPR3:['4 tur',[['6×25 maksimum',150],['1×150 kolay',150]]]},Sprint:{A2:['3 tur',[['1×600 A2 pull/swim',600],['2×100 teknik',200]]],A3:['4 tur',[['1×400 A2',400],['4×50 build',200],['4×25 hız dokunuşu',100]]],END2:['3 tur',[['4×100 END2',400],['4×50 build',200],['1×200 A1',200]]],END3:['4 tur',[['4×100 END3',400],['4×50 A1',200]]],RP:['5 tur',[['4×50 100 RP',200],['2×25 çıkış+15m',50]]],SPR1:['4 tur',[['4×50 laktat tolerans',200],['1×200 A1',200]]],SPR2:['3 tur',[['6×50 maksimum',300],['1×300 kolay',300]]],SPR3:['4 tur',[['6×25 maksimum',150],['1×200 kolay',200]]]}};function sec(v){if(!v)return null;v=(''+v).replace(',','.').trim();if(v.includes(':')){const a=v.split(':');return +a[0]*60+ +a[1]}return +v||null}function fmt(s){if(!s||!isFinite(s))return'—';const m=Math.floor(s/60),x=(s-m*60).toFixed(1).padStart(4,'0');return m?m+':'+x:x}function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function currentAth(){return athletes().find(x=>x.name===$('athSel').value)}function css(a,c){const p=a?.pb?.[c];if(!p)return null;if(p[400]&&p[200])return(p[400]-p[200])/2;const d=[1500,800,400,200,100].find(x=>p[x]);return d?p[d]/(d/100)*1.08:null}const FAC={A1:[1.18,1.28],A2:[1.10,1.18],A3:[1.05,1.11],END2:[.99,1.04],END3:[.94,.99],SPR1:[.88,.95],SPR2:[.82,.90],SPR3:[.72,.84]};function range(a,c,sys,dist){const base=css(a,c);if(!base)return'PB gerekli';const p=a.pb[c]||{};if(sys==='RP'){const x=p[dist]||p[400]||p[200];if(!x)return'PB gerekli';const bd=p[dist]?dist:(p[400]?400:200);return fmt(x/bd*dist)}const f=FAC[sys]||FAC.A2;return fmt(base*f[0]*dist/100)+'–'+fmt(base*f[1]*dist/100)}function loadAth(sel=''){const a=athletes();$('athSel').innerHTML='<option value="">Sporcu seçilmedi</option>'+a.map(x=>`<option ${x.name===sel?'selected':''}>${x.name}</option>`).join('')}function showAth(){const a=currentAth();if(!a){$('athOut').innerHTML='<div class="note">Sporcu kaydedip seçtiğinde kişisel tempo tablosu oluşur.</div>';return}$('aname').value=a.name;$('aprofile').value=a.profile;loadPB();const c=$('acourse').value,systems=['A1','A2','A3','END2','END3','SPR1','SPR2','SPR3','RP'];$('athOut').innerHTML=`<div class="card coach"><div class="head">${a.name} — ${c==='25'?'SCM':'LCM'} TEMPO</div><div class="body">CSS/eşik: <b>${fmt(css(a,c))}/100</b><div class="pace"><div class="h">SYS</div><div class="h">50</div><div class="h">100</div><div class="h">200</div><div class="h">400</div>${systems.map(s=>`<div class="h">${s}</div>${[50,100,200,400].map(d=>`<div>${range(a,c,s,d)}</div>`).join('')}`).join('')}</div></div></div>`}function loadPB(){const a=currentAth(),p=a?.pb?.[$('acourse').value]||{};[50,100,200,400,800,1500].forEach(d=>$('p'+d).value=p[d]?fmt(p[d]):'')}function saveAth(){const arr=athletes(),name=$('aname').value.trim();if(!name){alert('Sporcu adı gir.');return}let i=arr.findIndex(x=>x.name.toLowerCase()===name.toLowerCase()),o=i>=0?arr[i]:{name,profile:$('aprofile').value,pb:{'25':{},'50':{}}};o.name=name;o.profile=$('aprofile').value;o.pb=o.pb||{'25':{},'50':{}};const c=$('acourse').value;o.pb[c]=o.pb[c]||{};[50,100,200,400,800,1500].forEach(d=>o.pb[c][d]=sec($('p'+d).value));if(i>=0)arr[i]=o;else arr.push(o);localStorage.setItem('ybAth13',JSON.stringify(arr));loadAth(name);showAth();render()}function card(cls,title,rows,why){const m=rows.reduce((s,r)=>s+r[1],0);return`<div class="card ${cls}"><div class="head">${title}<span class="meter">${m} m</span></div><div class="body">${rows.map(r=>`<div class="row"><b>${r[0]}</b><br><span class="calc">${r[2]} = ${r[1]} m</span>${r[3]?'<br>'+r[3]:''}</div>`).join('')}<div class="why">🎓 ${why}</div></div></div>`}function render(){const d=new Date($('date').value+'T12:00'),day=DN[d.getDay()],plan=(SCH[day]||{})[S.session];if(day==='Pazartesi'){$('result').innerHTML='<div class="status">Pazartesi • OFF</div>';return}if(!plan){$('result').innerHTML=`<div class="note">${day} için ${S.session} seansı planlı değil.</div>`;return}const sys=plan[0],purpose=plan[1],a=currentAth(),course=$('pool').value,def=LIB[S.profile][sys],mult=parseInt(def[0]),main=[];for(let t=1;t<=mult;t++)def[1].forEach(r=>main.push([`Tur ${t} • ${r[0]}`,r[1],r[0].match(/\d+×\d+/)?.[0]||('1×'+r[1]),a?`🎯 ${range(a,course,sys,100)} /100 m`:'' ]));const warm=[['400 kolay serbest/sırt',400,'1×400'],['4×50 drill/swim',200,'4×50'],['4×50 build',200,'4×50']],tech=course==='25'?[['8×50 dönüş+breakout',400,'8×50'],['4×25 streamline',100,'4×25']]:[['6×50 uzun kulvar teknik',300,'6×50'],['4×50 stroke count+breakout',200,'4×50']],support=S.profile==='Uzun'?[['4×200 pull DPS',800,'4×200'],['4×50 kick build',200,'4×50']]:[['4×150 pull/swim',600,'4×150'],['4×50 kick build',200,'4×50']],race=course==='25'?[['8×50 5m giriş+dönüş+15m çıkış',400,'8×50'],['4×25 finish',100,'4×25']]:[['6×50 15m çıkış+35m ritim',300,'6×50'],['4×50 finish+stroke count',200,'4×50']],cool=[['200 çok kolay',200,'1×200'],['4×50 teknik reset',200,'4×50'],['100 rahat',100,'1×100']],total=[warm,tech,support,main,race,cool].flat().reduce((s,r)=>s+r[1],0);$('result').innerHTML=`<div class="status">${day} • ${S.profile} • ${S.session} • ${course==='25'?'25m SCM':'50m LCM'}${a?' • '+a.name:''}</div><div class="phase"><b>${sys}</b> • ${purpose}</div><div class="kpis"><div class="kpi"><b>${total} m</b>TOPLAM</div><div class="kpi"><b>120 dk</b>BİRİM</div><div class="kpi"><b>${a?range(a,course,sys,100):'—'}</b>100 m HEDEF</div></div>${card('warm','1. ISINMA',warm,'Fizyolojik hazırlık ve su hissi.')}${card('tech','2. TEKNİK / HAVUZ BECERİSİ',tech,'SCM/LCM gereksinimine göre teknik.')}${card('support','3. DESTEK',support,'Pull/kick/swim ile profil desteği.')}${card('main','4. ANA SET — '+sys,main,EDU[sys][1])}${card('race','5. YARIŞ BECERİSİ',race,'Dönüş, breakout, finish ve stroke count.')}${card('cool','6. SOĞUMA',cool,'Aktif toparlanma ve teknik reset.')}<div class="note good">✓ MATEMATİK DOĞRULANDI: ${total} m</div>`} $('date').onchange=render;$('pool').onchange=render;$('athSel').onchange=()=>{const a=currentAth();if(a){S.profile=a.profile;document.querySelectorAll('#profile button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.profile))}render()};$('acourse').onchange=()=>{loadPB();showAth()};$('saveAth').onclick=saveAth;loadAth();render()})();</script></body></html>
