<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kumsal Spor • Race Model</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.wrap{max-width:1100px;margin:auto}.brand,.card{background:#101d2d;border:1px solid #294058;border-radius:14px}.brand{padding:14px}.orange{color:#f97316}.sub{color:#9fb0c2;font-size:12px}.card{margin:10px 0;overflow:hidden}.head{padding:11px 13px;background:#17283b;font-weight:900}.body{padding:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{display:block;font-size:10px;color:#a9b8c8;font-weight:900;margin-bottom:5px}input,select{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpi{background:#0d1a29;border:1px solid #294058;border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:20px;color:#fde68a}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border-bottom:1px solid #294058;padding:7px;text-align:left}.table th{background:#17283b}.note{padding:10px;border-left:3px solid #f97316;background:#0b1625;color:#cbd5e1;margin:8px 0}.good{color:#86efac;font-weight:900}.warn{color:#fbbf24;font-weight:900}.save{width:100%;margin-top:10px;background:#f97316;border:0;color:#fff;border-radius:10px;padding:11px;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}.table{font-size:10px}}</style></head><body><div class="wrap"><div class="brand"><b><span class="orange">KUM</span>SAL SPOR • RACE MODEL</b><div class="sub">Hedef derece → split → start/15 m → dönüş → breakout → finish</div></div><div class="card"><div class="head">🏁 YARIŞ PLANI OLUŞTUR</div><div class="body"><div class="grid"><div><label>SPORCU</label><select id="ath"></select></div><div><label>HAVUZ</label><select id="course"><option value="25">25 m SCM</option><option value="50">50 m LCM</option></select></div><div><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Kurbağa</option><option>Sırt</option><option>Kelebek</option></select></div><div><label>MESAFE</label><select id="dist"><option>50</option><option>100</option><option>200</option><option>400</option><option>800</option><option>1500</option></select></div><div><label>HEDEF DERECE</label><input id="target" placeholder="örn 1:16.50"></div><div><label>START + 15 m HEDEF</label><input id="start15" placeholder="örn 7.8"></div><div><label>DÖNÜŞ HEDEFİ</label><input id="turn" placeholder="örn 0.75 sn duvar teması"></div><div><label>BREAKOUT HEDEFİ</label><input id="breakout" placeholder="örn 7.5 m / 1 pullout"></div><div><label>SON 25/50 STRATEJİSİ</label><input id="finish" placeholder="örn SR artır, DPS bozma"></div></div><button class="save" id="save">RACE MODELİ KAYDET</button></div></div><div id="out"></div></div><script>(()=>{const $=x=>document.getElementById(x);function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function sec(v){if(!v)return null;v=(''+v).replace(',','.').trim();if(v.includes(':')){let a=v.split(':');return +a[0]*60+ +a[1]}return +v||null}function fmt(s){if(!s||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}function models(){try{return JSON.parse(localStorage.getItem('ybRace13')||'[]')}catch(e){return[]}}function saveModels(x){localStorage.setItem('ybRace13',JSON.stringify(x))}function splitPlan(t,d){if(!t)return[];let reps=d/50,arr=[];if(d==50)return[{seg:'50',time:t}];if(d==100){arr=[{seg:'İlk 50',time:t*.485},{seg:'İkinci 50',time:t*.515}]}else if(d==200){let w=[.242,.248,.252,.258];arr=w.map((x,i)=>({seg:(i+1)+'. 50',time:t*x}))}else if(d==400){let base=t/4;arr=[0.98,1.00,1.00,1.02].map((x,i)=>({seg:(i+1)+'. 100',time:base*x}))}else{let unit=100,base=t/(d/unit),n=d/unit;for(let i=0;i<n;i++){let f=i==0?.985:i==n-1?1.015:1;arr.push({seg:(i+1)+'. 100',time:base*f})}}return arr}function render(){let name=$('ath').value,d=+$('dist').value,t=sec($('target').value),a=athletes().find(x=>x.name===name),course=$('course').value,stroke=$('stroke').value;if(!name){$('out').innerHTML='<div class="note">Önce sporcu seç.</div>';return}let splits=splitPlan(t,d),sum=splits.reduce((s,x)=>s+x.time,0),pb=a?.pb?.[course]?.[d],delta=pb&&t?t-pb:null;let turnCount=course==='25'?Math.max(0,d/25-1):Math.max(0,d/50-1);$('out').innerHTML=`<div class="grid"><div class="kpi"><b>${t?fmt(t):'—'}</b>HEDEF</div><div class="kpi"><b>${pb?fmt(pb):'—'}</b>MEVCUT PB</div><div class="kpi"><b class="${delta<0?'good':delta>0?'warn':''}">${delta==null?'—':(delta>0?'+':'')+delta.toFixed(2)+' sn'}</b>HEDEF-PB</div></div><div class="card"><div class="head">📊 SPLIT PLANI</div><div class="body"><table class="table"><tr><th>Bölüm</th><th>Hedef</th><th>Kümülatif</th></tr>${splits.map((x,i)=>{let c=splits.slice(0,i+1).reduce((s,y)=>s+y.time,0);return`<tr><td>${x.seg}</td><td>${fmt(x.time)}</td><td>${fmt(c)}</td></tr>`}).join('')}</table><div class="note">Planlanan toplam: <b>${fmt(sum)}</b>. Bu splitler otomatik başlangıç modelidir; gerçek yarış verisi geldikçe kişiselleştirilmelidir.</div></div></div><div class="card"><div class="head">🧠 YARIŞ BECERİ MODELİ</div><div class="body"><table class="table"><tr><th>Alan</th><th>Plan</th></tr><tr><td>Start + 15 m</td><td>${$('start15').value||'Girilmeli'}</td></tr><tr><td>Dönüş sayısı</td><td>${turnCount} dönüş • ${course==='25'?'SCM: dönüş etkisi yüksek':'LCM: yüzme sürekliliği etkisi yüksek'}</td></tr><tr><td>Dönüş standardı</td><td>${$('turn').value||'Girilmeli'}</td></tr><tr><td>Breakout</td><td>${$('breakout').value||'Girilmeli'}</td></tr><tr><td>Finish</td><td>${$('finish').value||'Girilmeli'}</td></tr><tr><td>Branş</td><td>${stroke}</td></tr></table></div></div><div class="card"><div class="head">🎯 KOÇ KARARI</div><div class="body"><div class="note">Hedef splitleri tek başına yeterli kabul etme. Yarış modeli; start, sualtı/pullout, dönüş, breakout, stroke rate/count ve son bölüm davranışıyla birlikte doğrulanmalı. Özellikle 100/200 yarışlarında ikinci yarı çöküyorsa yalnız aerobik yük artırmak yerine yarış becerisi ve pace kontrolünü birlikte incele.</div></div></div>`}function save(){let n=$('ath').value;if(!n){alert('Sporcu seç');return}let arr=models(),o={name:n,course:$('course').value,stroke:$('stroke').value,dist:+$('dist').value,target:$('target').value,start15:$('start15').value,turn:$('turn').value,breakout:$('breakout').value,finish:$('finish').value,date:new Date().toISOString().slice(0,10)};arr.push(o);saveModels(arr);render()}$('ath').innerHTML='<option value="">Sporcu seç</option>'+athletes().map(x=>`<option>${x.name}</option>`).join('');['ath','course','stroke','dist','target','start15','turn','breakout','finish'].forEach(id=>$(id).oninput=render);$('save').onclick=save;render()})();</script></body></html>
