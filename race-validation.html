<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kumsal Spor • Race Validation</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:12px}.wrap{max-width:1050px;margin:auto}.brand,.card{background:#101d2d;border:1px solid #294058;border-radius:14px}.brand{padding:14px}.orange{color:#f97316}.sub{color:#9fb0c2;font-size:12px}.card{margin:10px 0;overflow:hidden}.head{padding:11px 13px;background:#17283b;font-weight:900}.body{padding:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}label{display:block;font-size:10px;color:#a9b8c8;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.note{padding:10px;border-left:3px solid #f97316;background:#0b1625;color:#cbd5e1;margin:8px 0}.set{padding:10px;border-bottom:1px solid #294058}.set:last-child{border:0}.set b{color:#fde68a}.tag{display:inline-block;padding:2px 6px;border-radius:6px;background:#20364d;margin-right:4px;font-size:11px}.good{color:#86efac;font-weight:900}.warn{color:#fbbf24;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class='wrap'><div class='brand'><b><span class='orange'>KUM</span>SAL SPOR • RACE MODEL VALIDATION</b><div class='sub'>Yarış hedefini antrenman setinde doğrulama • V13 çekirdeğine dokunmaz</div></div><div class='card'><div class='head'>🎯 MODEL SEÇ</div><div class='body'><div class='grid'><div><label>SPORCU</label><select id='ath'></select></div><div><label>HAVUZ</label><select id='course'><option value='25'>25 m SCM</option><option value='50'>50 m LCM</option></select></div><div><label>MESAFE</label><select id='dist'><option>100</option><option selected>200</option><option>400</option><option>800</option><option>1500</option></select></div><div><label>HEDEF DERECE</label><input id='goal' placeholder='örn 2:18.00'></div></div></div></div><div id='out'></div></div><script>(()=>{const $=x=>document.getElementById(x);function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function sec(v){if(!v)return null;v=(''+v).replace(',','.').trim();if(v.includes(':')){let a=v.split(':');return +a[0]*60+ +a[1]}return +v||null}function fmt(s){if(!s||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(1).padStart(4,'0');return m?m+':'+x:x}function render(){let name=$('ath').value,c=$('course').value,d=+$('dist').value,g=sec($('goal').value),a=athletes().find(x=>x.name===name);if(!a){$('out').innerHTML='<div class="note">Önce V13 Sporcu ekranından sporcu kaydet.</div>';return}let p=a.pb?.[c]||{},pb=p[d]||null;if(!g&&pb)g=pb;if(!g){$('out').innerHTML='<div class="note">Hedef derece gir veya seçilen mesafe için PB kaydet.</div>';return}let split50=g/(d/50),split100=g/(d/100),courseTxt=c==='25'?'SCM':'LCM';let sets=[];if(d===100){sets=[['Set A — Pace doğrulama',`2 tur: 4×25 @ hedef 100 hızı (${fmt(split50/2)}) • 25'ler arası 30–45 sn • tur arası 3 dk`],['Set B — Broken 100',`2×(50 + 2×25) • 50: ${fmt(split50)} • 25: ${fmt(split50/2)} • parçalar arası 20–30 sn • set arası 5 dk`],['Başarı kriteri','Toplam model süresi hedefin ±%2 içinde; son 25'te teknik bozulma yok.']]}else if(d===200){sets=[['Set A — 200 RP',`3 tur: 4×50 @ ${fmt(split50)} • 50'ler arası 30–45 sn • tur arası 3–4 dk`],['Set B — Broken 200',`2×(100 + 2×50) • 100: ${fmt(split100)} • 50: ${fmt(split50)} • parçalar arası 20–30 sn • set arası 5–6 dk`],['Set C — Son 50 kontrolü',`4×50: ilk 3 hedef pace, 4. tekrar hedeften 0–2 sn hızlı; teknik bozulursa hız artırma.`],['Başarı kriteri','İlk ve son 50 farkı ≤%3; dönüş/breakout standardı korunur.']]}else if(d===400){sets=[['Set A — 400 RP',`3 tur: 4×100 @ ${fmt(split100)} • 100'ler arası 30–45 sn • tur arası 4 dk`],['Set B — Broken 400',`2×(200 + 2×100) • 200: ${fmt(g/2)} • 100: ${fmt(split100)} • parçalar arası 30 sn • set arası 6 dk`],['Başarı kriteri','Her 100 hedefin ±2–3% bandında; 3. ve 4. 100'lerde stroke count artışı sınırlı.']]}else{sets=[['Set A — Uzun RP blok',`4×${d>=800?200:100} @ hedef yarış ritmi • dinlenme 30–60 sn`],['Set B — Negatif kontrol',`2 tur: ilk blok kontrollü, ikinci blok aynı teknikle 1–2% hızlı`],['Başarı kriteri','Pace stabil, RPE kontrollü yükseliyor; son blokta teknik kalite korunuyor.']]};let pbDiff=pb?g-pb:null;$('out').innerHTML=`<div class='card'><div class='head'>📌 MODEL ÖZETİ</div><div class='body'><span class='tag'>${name}</span><span class='tag'>${courseTxt}</span><span class='tag'>${d} m</span><div class='note'><b>Hedef:</b> ${fmt(g)} • 50 split: ${fmt(split50)} • 100 split: ${fmt(split100)} ${pb?`• PB farkı: <span class='${pbDiff<0?'good':'warn'}'>${pbDiff<0?'hedef PB’den '+Math.abs(pbDiff).toFixed(1)+' sn hızlı':pbDiff.toFixed(1)+' sn yavaş'}</span>`:''}</div></div></div><div class='card'><div class='head'>🏊 DOĞRULAMA SETLERİ</div><div class='body'>${sets.map(s=>`<div class='set'><b>${s[0]}</b><br>${s[1]}</div>`).join('')}<div class='note'>Bu setleri test haftasında ekstra yük olarak ekleme; ilgili RP ana setinin yerine kullan. Hedef pace tutulmuyorsa dinlenmeyi azaltma. Önce tekniği ve yorgunluğu değerlendir.</div></div></div>`} $('ath').innerHTML='<option value="">Sporcu seç</option>'+athletes().map(x=>`<option>${x.name}</option>`).join('');['ath','course','dist','goal'].forEach(id=>$(id).addEventListener(id==='goal'?'input':'change',render));render()})();</script></body></html>
