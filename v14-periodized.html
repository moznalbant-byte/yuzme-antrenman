<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kumsal Spor • V14 Periodize Set Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.wrap{max-width:1050px;margin:auto}.brand,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.brand{padding:14px}.orange{color:#f97316}.sub{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.box{padding:10px}label{display:block;font-size:10px;color:#a9b8c8;font-weight:900;margin-bottom:5px}input,select{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.card{margin:9px 0;overflow:hidden}.head{padding:10px 12px;background:#17283b;font-weight:900}.body{padding:12px}.row{padding:8px 0;border-bottom:1px solid #26384c}.meter{float:right;background:#07111f;padding:2px 8px;border-radius:9px}.note{padding:10px;border-left:3px solid #f97316;background:#0b1625;color:#cbd5e1;margin:8px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{text-align:center;background:#0d1a29;border:1px solid #294058;border-radius:12px;padding:10px}.kpi b{display:block;color:#fde68a;font-size:18px}.good{color:#86efac;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="brand"><b><span class="orange">KUM</span>SAL SPOR • V14 PERIODIZE SET ENGINE</b><div class="sub">V13 korunuyor • Tarih ve seansa göre periodize antrenman</div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date" value="2026-09-22"></div><div class="box"><label>PROFİL</label><select id="profile"><option>Sprint</option><option selected>Orta</option><option>Uzun</option></select></div><div class="box"><label>HAVUZ</label><select id="pool"><option value="25">25 m SCM</option><option value="50">50 m LCM</option></select></div><div class="box"><label>SEANS</label><select id="session"></select></div></div><div id="out"><div class="note">Antrenman hazırlanıyor…</div></div></div><script>(function(){'use strict';var DN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];var SCH={Salı:{AM:['A3','Aerobik kapasite / ekonomi'],PM:['SPR3','Saf hız / nöromüsküler']},Çarşamba:{Tek:['END2','Eşik / CSS']},Perşembe:{AM:['A3','Aerobik kuvvet'],PM:['RP','Race Pace']},Cuma:{Tek:['A2','Teknik aerobik / toparlanabilir kalite']},Cumartesi:{AM:['END3','Yüksek aerobik güç'],PM:['SPR1','Laktat toleransı']},Pazar:{AM:['A3','Uzun aerobik / fartlek'],PM:['SPR2','Anaerobik güç']}};var FAM={A2:[['Aerobik Teknik','3×(400 A2 + 4×50 drill/swim + 200 pull DPS)'],['Negatif Aerobik','4×500 A2 negatif + 8×50 teknik'],['Pull Economy','3×(600 pull A2 + 4×100 swim build)'],['Aerobik Ladder','200-300-400-500-400-300-200 A2; aralarda 50 teknik']],A3:[['Progressive 100s','3×(8×100: 1-4 A2→A3, 5-8 A3 + 200 kolay)'],['Fartlek 1000','3×1000: 200 A2 / 100 A3 döngüsü + 4×100 teknik reset'],['Aerobik Ladder','2×(200-300-400-500-400-300-200), son 50 A3'],['Pull/Swim Alternation','4×(400 pull A2/A3 + 4×100 swim A3)'],['Negative 400s','6×400 negatif split; 1-3 kontrollü, 4-6 A3'],['Over-Under Aerobik','4×600: 100 A2 / 100 A3 dönüşümlü']],END2:[['CSS 200s','3×(4×200 END2 + 200 A1 reset)'],['Threshold Ladder','2×(100-200-300-400-300-200-100) END2'],['Over/Under CSS','4×(4×100: CSS+2sn / CSS / CSS-1sn / A2 reset)'],['Broken 800','4×(4×200 END2), blok arası 200 kolay'],['Threshold 300s','3×(3×300 END2 + 3×100 teknik)']],END3:[['VO2 150s','4×(4×150 END3 + 200 A1)'],['VO2 100s','5×(5×100 END3 + 200 kolay)'],['Broken 600','4×(3×200 END3 + 200 A1)'],['Descending 200s','3×(4×200 descend A3→END3 + 200 kolay)']],RP:[['Race Pace Cluster','4×(4×50 RP + 100 kolay)'],['Broken 200','6×(4×50 hedef 200 pace + 200 kolay)'],['Broken 400','4×(4×100 hedef 400 pace + 200 kolay)'],['Pace Change','4×400: 100 kontrollü / 100 RP'],['Race Finish','4×(200 kontrollü + 4×50 yarış sonu RP)']],SPR1:[['Lactate Tolerance 75','4×(3×75 güçlü + 200 kolay)'],['Race Finish 100','4×(2×100 yarış sonu kalite + 300 kolay)'],['Broken 150','5×(3×50 yüksek laktat + 250 kolay)']],SPR2:[['Power 50s','4×(4×50 %95-100 + 250 kolay)'],['Power Cluster','5×(3×50 maksimum kalite + 300 kolay)'],['25/50 Mix','4×(4×25 max + 2×50 güçlü + 250 kolay)']],SPR3:[['Pure Speed 25','4×(6×25 maksimum + 200 kolay); tekrarlar arası tam dinlenme'],['15m Speed','4×(8×15m maksimum + tam toparlanma)'],['25 Build/Max','5×(4×25: 1 build, 2-4 max + 200 kolay)']]};function el(id){return document.getElementById(id)}function phase(d){var m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON',.82];if(m===10)return['GENEL HAZIRLIK',.94];if(m===11)return['ÖZEL HAZIRLIK',1.05];if(m===12&&n<8)return['RACE SPECIFIC',.90];if(m===12&&n<15)return['TAPER',.70];if(m===12)return['YARIŞ / RECOVERY',.55];if(m===1)return['RELOAD',.82];if(m===2)return['GENEL HAZIRLIK II',.95];if(m===3)return['ÖZEL HAZIRLIK II',1.05];if(m===4)return['RACE SPECIFIC II',.92];if(m===5&&n<5)return['TAPER II',.70];if(m===5&&n<16)return['ANA YARIŞ II',.55];return['GEÇİŞ',.70]}function week(d){return Math.floor((d-new Date(2026,8,21,12))/604800000)}function target(p,s,m,w){var b={Sprint:5000,Orta:5900,Uzun:7200}[p],sf={A2:.92,A3:1.04,END2:1,END3:.94,RP:.88,SPR1:.82,SPR2:.80,SPR3:.76}[s]||1,wa=[.94,1,1.06,.88][((w%4)+4)%4];return Math.round(b*sf*m*wa/100)*100}function syncSession(){var d=new Date(el('date').value+'T12:00:00'),day=DN[d.getDay()],keys=SCH[day]?Object.keys(SCH[day]):[];el('session').innerHTML=keys.map(function(x){return'<option>'+x+'</option>'}).join('');return day}function render(){var out=el('out');try{var d=new Date(el('date').value+'T12:00:00'),day=DN[d.getDay()];if(day==='Pazartesi'){el('session').innerHTML='<option>OFF</option>';out.innerHTML='<div class="note"><b>Pazartesi OFF</b> • mobilite, uyku ve toparlanma.</div>';return}var se=el('session').value,sc=SCH[day]&&SCH[day][se];if(!sc){day=syncSession();se=el('session').value;sc=SCH[day]&&SCH[day][se]}if(!sc){out.innerHTML='<div class="note">Bu tarih için seans bulunamadı.</div>';return}var sys=sc[0],goal=sc[1],p=el('profile').value,w=week(d),ph=phase(d),arr=FAM[sys],seed=d.getDate()+d.getMonth()*31+w*7+(p==='Sprint'?3:p==='Uzun'?11:7)+sys.charCodeAt(0),fam=arr[Math.abs(seed)%arr.length],tar=target(p,sys,ph[1],w),warm=Math.round(tar*.15/100)*100,tech=Math.round(tar*.10/100)*100,cool=Math.round(tar*.08/100)*100,support=p==='Uzun'?800:p==='Orta'?600:400,main=tar-warm-tech-cool-support;out.innerHTML='<div class="kpis"><div class="kpi"><b>'+ph[0]+'</b>FAZ</div><div class="kpi"><b>H'+(w+1)+'</b>MİKRO</div><div class="kpi"><b>'+sys+'</b>SİSTEM</div><div class="kpi"><b>'+tar+' m</b>TOPLAM</div></div><div class="note"><b>'+day+' '+se+' • '+goal+'</b><br>Aynı enerji sistemi farklı haftalarda farklı set ailesi ve farklı hacim üretir.</div><div class="card"><div class="head">ISINMA <span class="meter">'+warm+' m</span></div><div class="body"><div class="row">Easy swim + kick + build. Son bölüm teknik olarak ana sete hazırlar.</div></div></div><div class="card"><div class="head">TEKNİK <span class="meter">'+tech+' m</span></div><div class="body"><div class="row">DPS / streamline / breakout + seçilen havuza göre dönüş standardı.</div></div></div><div class="card"><div class="head">ANA SET • '+fam[0]+' <span class="meter">≈ '+main+' m</span></div><div class="body"><div class="row"><b>'+fam[1]+'</b></div><div class="note">Ana set hedef hacmi yaklaşık '+main+' m. Bir sonraki V14 adımında tur/tekrar matematiği bu hedefe otomatik eşitlenecek.</div></div></div><div class="card"><div class="head">DESTEK / BECERİ <span class="meter">'+support+' m</span></div><div class="body"><div class="row">'+(sys==='RP'?'Dönüş + breakout + finish':sys.indexOf('SPR')===0?'Çıkış + 15 m hız + tam toparlanma':'Pull / kick / teknik kalite')+'</div></div></div><div class="card"><div class="head">SOĞUMA <span class="meter">'+cool+' m</span></div><div class="body">Easy mixed + teknik uzunluk + nefes normalizasyonu.</div></div><div class="note good">✓ ANTRENMAN YÜKLENDİ • '+p+' • '+el('pool').value+' m havuz • '+tar+' m</div>'}catch(e){out.innerHTML='<div class="note">V14 render hatası: '+e.message+'</div>'}}el('date').addEventListener('change',function(){syncSession();render()});el('profile').addEventListener('change',render);el('pool').addEventListener('change',render);el('session').addEventListener('change',render);syncSession();render()})();</script></body></html>
