<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kumsal Spor V14</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.wrap{max-width:1050px;margin:auto}.brand,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.brand{padding:14px}.orange{color:#f97316}.sub{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.box{padding:10px}label{display:block;font-size:10px;color:#a9b8c8;font-weight:900;margin-bottom:5px}input,select{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.card{margin:9px 0;overflow:hidden}.head{padding:10px 12px;background:#17283b;font-weight:900}.body{padding:12px}.set{padding:9px 0;border-bottom:1px solid #26384c;line-height:1.45}.set:last-child{border:0}.set b{color:#fde68a}.meter{float:right;background:#07111f;padding:2px 8px;border-radius:9px}.note{padding:10px;border-left:3px solid #f97316;background:#0b1625;color:#cbd5e1;margin:8px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{text-align:center;background:#0d1a29;border:1px solid #294058;border-radius:12px;padding:10px}.kpi b{display:block;color:#fde68a;font-size:18px}.good{color:#86efac;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="brand"><b><span class="orange">KUM</span>SAL SPOR • V14 DETAYLI ANTRENMAN</b><div class="sub">Her bölüm: tekrar × mesafe + enerji sistemi + dinlenme + amaç</div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date" value="2026-09-22"></div><div class="box"><label>PROFİL</label><select id="profile"><option>Sprint</option><option selected>Orta</option><option>Uzun</option></select></div><div class="box"><label>HAVUZ</label><select id="pool"><option value="25">25 m SCM</option><option value="50">50 m LCM</option></select></div><div class="box"><label>SEANS</label><select id="session"></select></div></div><div id="out"></div></div><script>(function(){var $=function(x){return document.getElementById(x)},DN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],SCH={Salı:{AM:['A3','Aerobik kapasite'],PM:['SPR3','Saf hız']},Çarşamba:{Tek:['END2','Eşik / CSS']},Perşembe:{AM:['A3','Aerobik kuvvet'],PM:['RP','Race Pace']},Cuma:{Tek:['A2','Aerobik teknik']},Cumartesi:{AM:['END3','Yüksek aerobik güç'],PM:['SPR1','Laktat toleransı']},Pazar:{AM:['A3','Uzun aerobik'],PM:['SPR2','Anaerobik güç']}};var MAIN={A2:[[['4×400','A2 swim, negatif split','20 sn',1600],['8×100','Pull DPS, uzun kulaç','15 sn',800],['8×50','Drill/Swim 25+25','15 sn',400]],[['3×600','A2 pull/swim dönüşümlü','25 sn',1800],['6×200','A2, son 50 build','20 sn',1200]],[['200-300-400-500-400-300-200','A2 ladder','20-30 sn',2300],['8×100','Teknik aerobik','15 sn',800]]],A3:[[['3×800','200 A2 / 200 A3 dönüşümlü','30 sn',2400],['8×200','A3 negatif split','20 sn',1600]],[['3×1000','200 A2 / 100 A3 fartlek','30 sn',3000],['8×100','A3, 1-4 build / 5-8 hold','15 sn',800]],[['6×400','A3 negatif split, ikinci 200 hızlı','25 sn',2400],['12×100','A3 tempo sabit','15 sn',1200]],[['4×600','100 A2 / 100 A3 over-under','25 sn',2400],['6×200','A3 pull güçlü','20 sn',1200]]],END2:[[['3×(4×200)','END2 / CSS; her blok sonrası 200 A1','20 sn; blok 2 dk',2400],['8×100','CSS+1–2 sn kontrollü','15 sn',800]],[['2×(100-200-300-400-300-200-100)','END2 threshold ladder','15-30 sn; set 3 dk',3200]],[['4×(4×100)','1 CSS+2 / 2 CSS / 3 CSS-1 / 4 A2 reset','15 sn; blok 90 sn',1600],['6×300','END2 sabit teknik','25 sn',1800]],[['4×(4×200)','Broken 800 END2','20 sn; blok 2 dk',3200]]],END3:[[['4×(4×150)','END3, blok sonrası 200 A1','30 sn; blok 3 dk',2400],['8×100','A3→END3 descend 1-4','20 sn',800]],[['5×(5×100)','END3 kalite sabit','25 sn; blok 3 dk',2500],['6×200','A3 güçlü, son 50 END3','25 sn',1200]],[['4×(3×200)','END3 broken 600','30 sn; blok 3 dk',2400],['8×50','Hızlı teknik, bozulmadan','30 sn',400]]],RP:[[['4×(4×50)','Hedef 200 yarış pace','20 sn; blok 3 dk',800],['8×100','A2 recovery + perfect turn','20 sn',800],['8×50','RP finish; son 15 m yarış bitiriş','45 sn',400]],[['4×(4×100)','Hedef 400 pace','20 sn; blok 3 dk',1600],['8×50','Dönüş + breakout RP','40 sn',400]],[['4×400','100 kontrollü / 100 RP pace-change','45 sn',1600],['8×50','Race finish','45 sn',400]]],SPR1:[[['4×(3×75)','Laktat toleransı %90-95','1:30; blok 5 dk',900],['8×50','Easy perfect technique','30 sn',400]],[['4×(2×100)','Race-finish kalite','3 dk; blok 5 dk',800],['8×50','Easy loosen','30 sn',400]],[['5×(3×50)','Yüksek laktat, form korunur','1:30; blok 4 dk',750],['10×50','A1 recovery','30 sn',500]]],SPR2:[[['4×(4×50)','%95-100 anaerobik güç','2 dk; blok 5 dk',800],['8×50','A1 recovery','30 sn',400]],[['5×(3×50)','Maksimum power cluster','2 dk; blok 5 dk',750],['10×50','Easy teknik','30 sn',500]],[['4×(4×25 + 2×50)','25 max + 50 güçlü','25: 1:30 / 50: 2 dk; blok 5 dk',800]]],SPR3:[[['4×(6×25)','Maksimum saf hız; kalite düşerse kes','1:30-2:00; blok 4 dk',600],['8×50','A1 recovery','30 sn',400]],[['4×(8×25)','15 m max + yüzerek tamamla','1:30; blok 4 dk',800],['8×50','Easy teknik','30 sn',400]],[['5×(4×25)','1 build + 3 max','1:30; blok 4 dk',500],['10×50','A1 recovery','30 sn',500]]]};function phase(d){var m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON',.82];if(m===10)return['GENEL HAZIRLIK',.94];if(m===11)return['ÖZEL HAZIRLIK',1.05];if(m===12&&n<8)return['RACE SPECIFIC',.90];if(m===12&&n<15)return['TAPER',.70];if(m===12)return['YARIŞ/RECOVERY',.55];if(m===1)return['RELOAD',.82];if(m===2)return['GENEL HAZIRLIK II',.95];if(m===3)return['ÖZEL HAZIRLIK II',1.05];if(m===4)return['RACE SPECIFIC II',.92];if(m===5&&n<5)return['TAPER II',.70];if(m===5&&n<16)return['ANA YARIŞ II',.55];return['GEÇİŞ',.70]}function week(d){return Math.floor((d-new Date(2026,8,21,12))/604800000)}function sessions(){var d=new Date($('date').value+'T12:00:00'),day=DN[d.getDay()],k=SCH[day]?Object.keys(SCH[day]):[];$('session').innerHTML=k.map(function(x){return'<option>'+x+'</option>'}).join('')}function rows(a){return a.map(function(x){return'<div class="set"><b>'+x[0]+'</b> • '+x[1]+'<br><small>Dinlenme: '+x[2]+' • '+x[3]+' m</small></div>'}).join('')}function render(){var d=new Date($('date').value+'T12:00:00'),day=DN[d.getDay()],out=$('out');if(day==='Pazartesi'){out.innerHTML='<div class="note">Pazartesi OFF • mobilite + recovery.</div>';return}var se=$('session').value,sc=SCH[day]&&SCH[day][se];if(!sc){sessions();se=$('session').value;sc=SCH[day]&&SCH[day][se]}if(!sc)return;var sys=sc[0],p=$('profile').value,w=week(d),ph=phase(d),families=MAIN[sys],seed=Math.abs(d.getDate()+d.getMonth()*31+w*7+(p==='Sprint'?2:p==='Uzun'?9:5)),main=families[seed%families.length],mainM=main.reduce(function(s,x){return s+x[3]},0);var scale=p==='Sprint'?.86:p==='Uzun'?1.18:1,warm=Math.round((900*scale*ph[1])/100)*100,tech=Math.round((700*scale*ph[1])/100)*100,kick=Math.round((600*scale*ph[1])/100)*100,support=Math.round((900*scale*ph[1])/100)*100,cool=Math.max(300,Math.round((500*scale*ph[1])/100)*100),total=warm+tech+kick+mainM+support+cool;var warmRows=[['400','Easy swim A1','10 sn',400],['4×100','50 kick + 50 swim build','15 sn',400],['4×50','25 drill + 25 swim','15 sn',200]],techRows=[['8×50','DPS + streamline; stroke count kaydet','15 sn',400],['4×50','Breakout/turn quality','30 sn',200]],kickRows=[['8×50','Kick A2, 1-4 build','20 sn',400]],supRows=p==='Uzun'?[['4×200','Pull A2/A3 ekonomik','20 sn',800]]:p==='Sprint'?[['8×50','Start/15m veya hız tekniği','45 sn',400]]:[['8×100','IM/teknik destek','15 sn',800]],coolRows=[['300','Easy mixed A1','—',300],['4×50','Uzun kulaç + nefes normalizasyonu','15 sn',200]];out.innerHTML='<div class="kpis"><div class="kpi"><b>'+ph[0]+'</b
