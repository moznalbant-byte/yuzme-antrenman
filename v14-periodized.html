<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kumsal Spor • V14 Periodize Set Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.wrap{max-width:1050px;margin:auto}.brand,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.brand{padding:14px}.orange{color:#f97316}.sub{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.box{padding:10px}label{display:block;font-size:10px;color:#a9b8c8;font-weight:900;margin-bottom:5px}input,select{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.card{margin:9px 0;overflow:hidden}.head{padding:10px 12px;background:#17283b;font-weight:900}.body{padding:12px}.row{padding:8px 0;border-bottom:1px solid #26384c}.row:last-child{border:0}.meter{float:right;background:#07111f;padding:2px 8px;border-radius:9px}.note{padding:10px;border-left:3px solid #f97316;background:#0b1625;color:#cbd5e1;margin:8px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{text-align:center;background:#0d1a29;border:1px solid #294058;border-radius:12px;padding:10px}.kpi b{display:block;color:#fde68a;font-size:18px}.good{color:#86efac;font-weight:900}.warn{color:#fbbf24;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="brand"><b><span class="orange">KUM</span>SAL SPOR • V14 PERIODIZE SET ENGINE</b><div class="sub">V13 çekirdeğinden ayrı test sürümü • Aynı sistem ≠ aynı antrenman</div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date" value="2026-09-22"></div><div class="box"><label>PROFİL</label><select id="profile"><option>Sprint</option><option selected>Orta</option><option>Uzun</option></select></div><div class="box"><label>HAVUZ</label><select id="pool"><option value="25">25 m SCM</option><option value="50">50 m LCM</option></select></div><div class="box"><label>SEANS</label><select id="session"><option>AM</option><option>PM</option><option>Tek</option></select></div></div><div id="out"></div></div><script>(()=>{const $=x=>document.getElementById(x),DN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];const SCH={Salı:{AM:['A3','Aerobik kapasite/ekonomi'],PM:['SPR3','Saf hız/nöromüsküler']},Çarşamba:{Tek:['END2','Eşik/CSS']},Perşembe:{AM:['A3','Aerobik kuvvet'],PM:['RP','Race Pace']},Cuma:{Tek:['A2','Teknik aerobik/recovery']},Cumartesi:{AM:['END3','VO₂/yüksek aerobik güç'],PM:['SPR1','Laktat toleransı']},Pazar:{AM:['A3','Uzun aerobik/fartlek'],PM:['SPR2','Anaerobik güç']}};const FAM={A2:[['Aerobik Teknik',['3×(400 yüzme A2 + 4×50 drill/swim + 200 pull DPS)']],['Negatif Aerobik',['4×500 A2; her 500 ikinci yarı daha hızlı + 8×50 teknik']],['Pull Economy',['3×(600 pull A2 + 4×100 swim build)']],['Aerobik Ladder',['200-300-400-500-400-300-200 A2, 50 teknik araları']]],A3:[['Progressive 100s',['3×(8×100: 1-4 A2→A3, 5-8 A3; 200 kolay blok arası)']],['Fartlek 1000',['3×1000: 200 A2/100 A3 döngüsü + 4×100 teknik reset']],['Aerobik Ladder',['2×(200-300-400-500-400-300-200), son 50 A3']],['Pull/Swim Alternation',['4×(400 pull A2/A3 + 4×100 swim A3)']],['Negative 400s',['6×400 negatif split; 1-3 kontrollü, 4-6 A3']],['Over-Under Aerobik',['4×600: 100 A2/100 A3 dönüşümlü']]],END2:[['CSS 200s',['3×(4×200 END2 + 200 A1 reset)']],['Threshold Ladder',['2×(100-200-300-400-300-200-100) END2']],['Over/Under CSS',['4×(4×100: 1 CSS+2sn, 2 CSS, 3 CSS-1sn, 4 A2 reset)']],['Broken 800',['4×(4×200 END2), bloklar arası 200 kolay']],['Threshold 300s',['3×(3×300 END2 + 3×100 teknik)']]],END3:[['VO2 150s',['4×(4×150 END3 + 200 A1)']],['VO2 100s',['5×(5×100 END3, kalite sabit; 200 kolay blok arası)']],['Broken 600',['4×(3×200 END3 + 200 A1)']],['Descending 200s',['3×(4×200 descend 1-4 A3→END3 + 200 kolay)']]],RP:[['Race Pace Cluster',['4×(4×50 RP + 100 kolay), split kalite']],['Broken 200',['6×(4×50 hedef 200 pace, 15-20sn; 200 kolay)']],['Broken 400',['4×(4×100 hedef 400 pace + 200 kolay)']],['Pace Change',['4×400: 100 kontrollü/100 RP dönüşümlü']],['Race Finish',['4×(200 kontrollü + 4×50 yarış sonu RP)']]],SPR1:[['Lactate Tolerance 75',['4×(3×75 güçlü + 200 kolay), tam teknik']],['Race Finish 100',['4×(2×100 yarış sonu kalite + 300 kolay)']],['Broken 150',['5×(3×50 yüksek laktat + 250 kolay)']]],SPR2:[['Power 50s',['4×(4×50 %95-100 + 250 kolay), tam dinlenme']],['Power Cluster',['5×(3×50 maksimum kalite + 300 kolay)']],['25/50 Mix',['4×(4×25 max + 2×50 güçlü + 250 kolay)']]],SPR3:[['Pure Speed 25',['4×(6×25 maksimum, 1:30-2:30 dinlenme + 200 kolay)']],['15m Speed',['4×(8×15m maksimum + tam toparlanma), teknik kalite']],['25 Build/Max',['5×(4×25: 1 build, 2-4 max kalite + 200 kolay)']]};function phase(d){let m=d.getMonth()+1,day=d.getDate();if(m===9)return['ADAPTASYON','Yük kontrollü yükselir',.82];if(m===10)return['GENEL HAZIRLIK','Aerobik kapasite + teknik',.94];if(m===11)return['ÖZEL HAZIRLIK','Eşik/VO₂/RP artar',1.05];if(m===12&&day<8)return['RACE SPECIFIC','Yarış hızı ve kalite',.90];if(m===12&&day<15)return['TAPER','Hacim ↓ yoğunluk korunur',.70];if(m===12)return['YARIŞ / RECOVERY','Zirve ve toparlanma',.55];if(m===1)return['RELOAD','Tekrar hacim kur',.82];if(m===2)return['GENEL HAZIRLIK II','Aerobik kapasite',.95];if(m===3)return['ÖZEL HAZIRLIK II','Eşik + VO₂',1.05];if(m===4)return['RACE SPECIFIC II','RP ağırlığı',.92];if(m===5&&day<5)return['TAPER II','Hacim ↓ kalite korunur',.70];if(m===5&&day<16)return['ANA YARIŞ II','Zirve',.55];return['GEÇİŞ','Teknik + yenilenme',.70]}function weekIndex(d){const s=new Date(2026,8,21);return Math.floor((d-s)/604800000)}function target(p,sys,mult,wi){const base={Sprint:5000,Orta:5900,Uzun:7200}[p],sysf={A2:.92,A3:1.04,END2:1.00,END3:.94,RP:.88,SPR1:.82,SPR2:.80,SPR3:.76}[sys]||1;const wave=[.94,1.00,1.06,.88][((wi%4)+4)%4];return Math.round(base*sysf*mult*wave/100)*100}function pick(sys,p,d,wi){let a=FAM[sys]||FAM.A2;let seed=d.getDate()+d.getMonth()*31+wi*7+(p==='Sprint'?3:p==='Uzun'?11:7)+(sys.charCodeAt(0)||0);return a[((seed%a.length)+a.length)%a.length]}function support(p,sys,t){let x=[];if(sys==='SPR3'||sys==='SPR2')x.push(['Çıkış + 15m','8×15m maksimum kalite, tam dinlenme',120]);if(sys==='RP'||sys==='SPR1')x.push(['Yarış becerisi','8×25 dönüş/breakout/finish standardı',200]);if(sys==='END2'||sys==='END3')x.push(['Teknik kalite','8×50 DPS + stroke count kontrol',400]);if(p==='Uzun')x.push(['Pull destek','4×200 pull ekonomik',800]);else if(p==='Orta')x.push(['IM/teknik destek','8×100 drill/swim',800]);else x.push(['Hız tekniği','8×50 drill/build',400]);return x}function render(){let d=new Date($('date').value+'T12:00:00'),day=DN[d.getDay()],se=$('session').value,p=$('profile').value,sc=SCH[day]?.[se];if(day==='Pazartesi'){out.innerHTML='<div class="note">Pazartesi OFF • toparlanma / mobilite / uyku.</div>';return}if(!sc){out.innerHTML=`<div class="note">${day} için ${se} seansı yok. Haftalık düzene uygun AM/PM/TEK seç.</div>`;return}let [sys,goal]=sc,wi=weekIndex(d),ph=phase(d),fam=pick(sys,p,d,wi),tar=target(p,sys,ph[2],wi),sup=support(p,sys,tar);let warm=Math.round(tar*.14/100)*100,tech=Math.round(tar*.10/100)*100,cool=Math.round(tar*.08/100)*100,supm=sup.reduce((s,x)=>s+x[2],0),main=Math.max(800,tar-warm-tech-cool-supm);out.innerHTML=`<div class="kpis"><div class="kpi"><b>${ph[0]}</b>FAZ</div><div class="kpi"><b>H${wi+1}</b>MİKRO</div><div class="kpi"><b>${sys}</b>SİSTEM</div><div class="kpi"><b>${tar} m</b>HEDEF</div></div><div class="note"><b>${goal}</b> • ${ph[1]} • 4 haftalık dalga: yüklenme/yükselme/yüksek/deload. Aynı enerji sistemi tekrar geldiğinde set ailesi tarihe ve mikro döngüye göre döner.</div><div class="card"><div class="head">ISINMA <span class="meter">${warm} m</span></div><div class="body"><div class="row">${Math.round(warm*.55/50)*50} m easy swim + ${Math.round(warm*.25/50)*50} m kick + kalan build/drill</div></div></div><div class="card"><div class="head">TEKNİK <span class="meter">${tech} m</span></div><div class="body"><div class="row">Stroke length + line + breakout standardı; kalite bozulursa tekrar sayısı azalt.</div></div></div><div class="card"><div class="head">ANA SET • ${fam[0]} <span class="meter">≈${main} m</span></div><div class="body">${fam[1].map(x=>`<div class="row">${x}</div>`).join('')}<div class="note">Bu aile ${sys} amacına hizmet eder. Hedef ana-set hacmi ≈${main} m; koç tekrar/tur sayısını bu hedefe göre tamamlar. Dinlenme enerji sistemini değiştirecek kadar kısaltılmaz.</div></div></div><div class="card"><div class="head">DESTEK / BECERİ <span class="meter">${supm} m</span></div><div class="body">${sup.map(x=>`<div class="row"><b>${x[0]}</b> — ${x[1]} <span class="meter">${x[2]} m</span></div>`).join('')}</div></div><div class="card"><div class="head">SOĞUMA <span class="meter">${cool} m</span></div><div class="body">Easy mixed + nefes normalizasyonu + teknik uzunluk.</div></div><div class="note good">✓ V14 TEST MODU: V13 değiştirilmedi. Tarihi 7 gün/14 gün ileri alarak aynı seansın set ailesi ve periodize hacminin değiştiğini kontrol et.</div>`}['date','profile','pool','session'].forEach(x=>$(x).onchange=render);render()})();</script></body></html>
