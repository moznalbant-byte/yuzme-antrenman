<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kumsal Spor V15 Unified</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1050px;margin:auto}.brand,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.brand{padding:14px}.orange{color:#f97316}.sub,small{color:#9fb0c2}.nav,.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.nav a,.nav button,button{border:1px solid #2a4058;background:#14253a;color:#fff;border-radius:10px;padding:10px;font-weight:800;text-decoration:none}.nav button{flex:1}.nav .on,.save{background:#f97316}.screen{display:none}.screen.on{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#a9b8c8;font-weight:900;margin:4px 0}input,select{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.card{margin:9px 0;overflow:hidden}.head{padding:10px 12px;background:#17283b;font-weight:900}.body{padding:12px}.set{padding:9px 0;border-bottom:1px solid #26384c;line-height:1.45}.set b{color:#fde68a}.meter{float:right;background:#07111f;padding:2px 8px;border-radius:9px}.note{padding:10px;border-left:3px solid #f97316;background:#0b1625;color:#cbd5e1;margin:8px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{text-align:center;background:#0d1a29;border:1px solid #294058;border-radius:12px;padding:9px}.kpi b{display:block;color:#fde68a}.pace{width:100%;border-collapse:collapse;font-size:11px}.pace td,.pace th{border-bottom:1px solid #294058;padding:6px;text-align:center}.good{color:#86efac;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="brand"><b><span class="orange">KUM</span>SAL SPOR • V15 UNIFIED</b><div class="sub">V13 sporcu/PB verisi + V14 değişken detaylı set motoru • veriyi silmez</div></div><div class="nav"><button class="on" data-p="training">ANTRENMAN</button><button data-p="athlete">SPORCU / PB</button><button data-p="academy">AKADEMİ</button><a href="coach-center.html">KOÇ MERKEZİ</a></div><section id="training" class="screen on"><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date" value="2026-09-22"></div><div class="box"><label>SPORCU</label><select id="athSel"></select></div><div class="box"><label>PROFİL</label><select id="profile"><option>Sprint</option><option selected>Orta</option><option>Uzun</option></select></div><div class="box"><label>HAVUZ</label><select id="pool"><option value="25">25 m SCM</option><option value="50">50 m LCM</option></select></div><div class="box"><label>SEANS</label><select id="session"></select></div></div><div id="result"></div></section><section id="athlete" class="screen"><div class="card"><div class="head">SPORCU PROFİLİ + KULVAR BAZLI PB</div><div class="body"><div class="grid"><div><label>AD SOYAD</label><input id="aname"></div><div><label>PROFİL</label><select id="aprofile"><option>Sprint</option><option selected>Orta</option><option>Uzun</option></select></div><div><label>PB KULVARI</label><select id="acourse"><option value="25">25 m SCM</option><option value="50">50 m LCM</option></select></div><div><label>50 PB</label><input id="p50"></div><div><label>100 PB</label><input id="p100"></div><div><label>200 PB</label><input id="p200"></div><div><label>400 PB</label><input id="p400"></div><div><label>800 PB</label><input id="p800"></div><div><label>1500 PB</label><input id="p1500"></div></div><button id="save" class="save" style="width:100%;margin-top:10px">KAYDET / GÜNCELLE</button><div id="athOut"></div></div></div></section><section id="academy" class="screen"><div id="lessons"></div></section></div><script>(function(){'use strict';var $=function(x){return document.getElementById(x)},DN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],EDU={A1:['Toparlanma','Düşük yük; teknik kalite ve dolaşım.'],A2:['Aerobik koruma','Ekonomik aerobik yüzme; yüksek tekrar kalitesi.'],A3:['Aerobik gelişim','Aerobik kapasite ve sürdürülebilir hacim.'],END2:['Eşik / CSS','CSS çevresinde sürdürülebilir yüksek aerobik hız.'],END3:['Yüksek aerobik güç','Eşik üstü yüksek aerobik güç; kalite bozulmadan.'],SPR1:['Laktat toleransı','Yüksek asidozda hız ve tekniği koruma.'],SPR2:['Anaerobik güç','Yüksek glikolitik güç; uzun toparlanma.'],SPR3:['Saf hız','ATP-PC / nöromüsküler maksimum hız; tam dinlenme.'],RP:['Race Pace','Hedef yarış split, ritim, dönüş ve finish davranışı.']},SCH={Salı:{AM:['A3','Aerobik kapasite'],PM:['SPR3','Saf hız']},Çarşamba:{Tek:['END2','Eşik / CSS']},Perşembe:{AM:['A3','Aerobik kuvvet'],PM:['RP','Race Pace']},Cuma:{Tek:['A2','Aerobik teknik']},Cumartesi:{AM:['END3','Yüksek aerobik güç'],PM:['SPR1','Laktat toleransı']},Pazar:{AM:['A3','Uzun aerobik'],PM:['SPR2','Anaerobik güç']}};var MAIN={A2:[[['4×400','A2 negatif split','20 sn',1600],['8×100','Pull DPS','15 sn',800],['8×50','Drill/Swim','15 sn',400]],[['3×600','A2 pull/swim','25 sn',1800],['6×200','A2 son 50 build','20 sn',1200]],[['200-300-400-500-400-300-200','A2 ladder','20-30 sn',2300],['8×100','Teknik aerobik','15 sn',800]]],A3:[[['3×800','200 A2 / 200 A3','30 sn',2400],['8×200','A3 negatif split','20 sn',1600]],[['3×1000','200 A2 / 100 A3 fartlek','30 sn',3000],['8×100','A3 build/hold','15 sn',800]],[['6×400','A3 negatif split','25 sn',2400],['12×100','A3 tempo sabit','15 sn',1200]],[['4×600','100 A2 / 100 A3 over-under','25 sn',2400],['6×200','A3 pull güçlü','20 sn',1200]]],END2:[[['3×(4×200)','END2/CSS; blok sonrası 200 A1','20 sn; blok 2 dk',2400],['8×100','CSS+1–2 sn','15 sn',800]],[['2×(100-200-300-400-300-200-100)','END2 ladder','15-30 sn; set 3 dk',3200]],[['4×(4×100)','CSS+2 / CSS / CSS-1 / A2 reset','15 sn; blok 90 sn',1600],['6×300','END2 teknik sabit','25 sn',1800]],[['4×(4×200)','Broken 800 END2','20 sn; blok 2 dk',3200]]],END3:[[['4×(4×150)','END3; blok sonrası 200 A1','30 sn; blok 3 dk',2400],['8×100','A3→END3 descend','20 sn',800]],[['5×(5×100)','END3 kalite sabit','25 sn; blok 3 dk',2500],['6×200','A3 güçlü, son 50 END3','25 sn',1200]],[['4×(3×200)','END3 broken 600','30 sn; blok 3 dk',2400],['8×50','Hızlı teknik','30 sn',400]]],RP:[[['4×(4×50)','Hedef 200 RP','20 sn; blok 3 dk',800],['8×100','A2 recovery + perfect turn','20 sn',800],['8×50','RP finish','45 sn',400]],[['4×(4×100)','Hedef 400 RP','20 sn; blok 3 dk',1600],['8×50','Dönüş + breakout RP','40 sn',400]],[['4×400','100 kontrollü / 100 RP','45 sn',1600],['8×50','Race finish','45 sn',400]]],SPR1:[[['4×(3×75)','%90-95 laktat toleransı','1:30; blok 5 dk',900],['8×50','A1 teknik','30 sn',400]],[['4×(2×100)','Race-finish kalite','3 dk; blok 5 dk',800],['8×50','Easy loosen','30 sn',400]]],SPR2:[[['4×(4×50)','%95-100 power','2 dk; blok 5 dk',800],['8×50','A1 recovery','30 sn',400]],[['5×(3×50)','Maksimum power cluster','2 dk; blok 5 dk',750],['10×50','Easy teknik','30 sn',500]]],SPR3:[[['4×(6×25)','Maksimum saf hız','1:30-2:00; blok 4 dk',600],['8×50','A1 recovery','30 sn',400]],[['4×(8×25)','15 m max + tamamla','1:30; blok 4 dk',800],['8×50','Easy teknik','30 sn',400]]]};function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function sec(v){if(!v)return null;v=(''+v).replace(',','.').trim();if(v.indexOf(':')>-1){var a=v.split(':');return +a[0]*60+ +a[1]}return +v||null}function fmt(s){if(!s||!isFinite(s))return'—';var m=Math.floor(s/60),x=(s-m*60).toFixed(1).padStart(4,'0');return m?m+':'+x:x}function css(a,c){var p=a&&a.pb&&a.pb[c];if(!p)return null;if(p[400]&&p[200])return(p[400]-p[200])/2;var d=[1500,800,400,200,100].find(function(x){return p[x]});return d?p[d]/(d/100)*1.08:null}var FAC={A1:[1.18,1.28],A2:[1.10,1.18],A3:[1.05,1.11],END2:[.99,1.04],END3:[.94,.99],SPR1:[.88,.95],SPR2:[.82,.90],SPR3:[.72,.84]};function range(a,c,s,d){var b=css(a,c);if(!b)return'PB gerekli';var f=FAC[s]||FAC.A2;if(s==='RP'){var p=a.pb[c]||{},x=p[d]||p[400]||p[200],bd=p[d]?d:(p[400]?400:200);return x?fmt(x/bd*d):'PB gerekli'}return fmt(b*f[0]*d/100)+'–'+fmt(b*f[1]*d/100)}function loadAth(sel){var a=athletes();$('athSel').innerHTML='<option value="">Sporcu seçilmedi</option>'+a.map(function(x){return'<option '+(x.name===sel?'selected':'')+'>'+x.name+'</option>'}).join('')}function current(){return athletes().find(function(x){return x.name===$('athSel').value})}function sessions(){var d=new Date($('date').value+'T12:00:00'),day=DN[d.getDay()],k=SCH[day]?Object.keys(SCH[day]):[];$('session').innerHTML=k.map(function(x){return'<option>'+x+'</option>'}).join('')}function phase(d){var m=d.getMonth()+1,n=d.getDate();if(m===9)return'ADAPTASYON';if(m===10)return'GENEL HAZIRLIK';if(m===11)return'ÖZEL HAZIRLIK';if(m===12&&n<10)return'RACE SPECIFIC';if(m===12&&n<18)return'TAPER';if(m===12)return'YARIŞ/RECOVERY';if(m===1)return'RELOAD';if(m===2)return'GENEL HAZIRLIK II';if(m===3)return'ÖZEL HAZIRLIK II';if(m===4)return'RACE SPECIFIC II';if(m===5&&n<8)return'TAPER II';if(m===5&&n<16)return'ANA YARIŞ II';return'GEÇİŞ'}function week(d){return Math.floor((d-new Date(2026,8,21,12))/604800000)}function rows(a,ath,course,sys){return a.map(function(x){var hint=ath?' • kişisel 100m '+sys+': '+range(ath,course,sys,100):'';return'<div class="set"><b>'+x[0]+'</b> • '+x[1]+'<br><small>Dinlenme: '+x[2]+' • '+x[3]+' m'+hint+'</small></div>'}).join('')}function render(){var d=new Date($('date').value+'T12:00:00'),day=DN[d.getDay()],out=$('result');if(day==='Pazartesi'){out.innerHTML='<div class="note">Pazartesi OFF • toparlanma / mobilite.</div>';return}var se=$('session').value,sc=SCH[day]&&SCH[day][se];if(!sc){sessions();se=$('session').value;sc=SCH[day]&&SCH[day][se]}if(!sc)return;var sys=sc[0],p=$('profile').value,w=week(d),fam=MAIN[sys],seed=Math.abs(d.getDate()+d.getMonth()*31+w*7+(p==='Sprint'?2:p==='Uzun'?9:5)),main=fam[seed%fam.length],ath=current(),course=$('pool').value,mainM=main.reduce(function(s,x){return s+x[3]},0),warm=p==='Uzun'?1200:p==='Orta'?1000:800,tech=600,kick=p==='Uzun'?800:p==='Orta'?600:400,support=p==='Uzun'?1000:p==='Orta'?800:500,cool=500,total=warm+tech+kick+mainM+support+cool;var wr=[['400','Easy A1','10 sn',400],['4×100','50 kick + 50 swim build','15 sn',400],['4×50','25 drill + 25 swim','15 sn',200]],tr=[['8×50','DPS + streamline + stroke count','15 sn',400],['4×50','Dönüş / breakout standardı','30 sn',200]],kr=[['8×50','Kick A2 1-4 build','20 sn',400]],sr=p==='Uzun'?[['5×200','Pull A2/A3 ekonomik','20 sn',1000]]:p==='Orta'?[['8×100','IM/teknik destek','15 sn',800]]:[['10×50','Start/15m veya hız tekniği','45 sn',500]],cr=[['300','Easy mixed A1','—',300],['4×50','Uzun kulaç + nefes normalizasyonu','15 sn',200]];out.innerHTML='<div class="kpis"><div class="kpi"><b>'+phase(d)+'</b>FAZ</div><div class="kpi"><b>H'+(w+1)+'</b>MİKRO</div><div class="kpi"><b>'+sys+'</b>SİSTEM</div><div class="kpi"><b>'+total+' m</b>GERÇEK TOPLAM</div></div><div class="note"><b>'+day+' '+se+' • '+sc[1]+'</b> • '+p+' • '+(course==='25'?'SCM':'LCM')+(ath?' • '+ath.name:'')+'</div><div class="card"><div class="head">1 ISINMA</div><div class="body">'+rows(wr,ath,course,'A1')+'</div></div><div class="card"><div class="head">2 TEKNİK</div><div class="body">'+rows(tr,ath,course,'A2')+'</div></div><div class="card"><div class="head">3 AYAK</div><div class="body">'+rows(kr,ath,course,'A2')+'</div></div><div class="card"><div class="head">4 ANA SET <span class="meter">'+mainM+' m</span></div><div class="body">'+rows(main,ath,course,sys)+'<div class="note"><b>Neden?</b> '+EDU[sys][1]+'</div></div></div><div class="card"><div class="head">5 DESTEK / YARIŞ BECERİSİ</div><div class="body">'+rows(sr,ath,course,sys==='RP'?'RP':'A2')+'</div></div><div class="card"><div class="head">6 SOĞUMA</div><div class="body">'+rows(cr,ath,course,'A1')+'</div></div>'}function loadPB(){var a=current(),c=$('acourse').value,p=a&&a.pb&&a.pb[c]||{};[50,100,200,400,800,1500].forEach(function(d){$('p'+d).value=p[d]?fmt(p[d]):''})}function showAth(){var a=current();if(!a){$('athOut').innerHTML='<div class="note">V13 kayıtları burada kullanılmaya devam eder.</div>';return}$('aname').value=a.name;$('aprofile').value=a.profile;loadPB();var c=$('acourse').value,ss=['A1','A2','A3','END2','END3','SPR1','SPR2','SPR3','RP'];$('athOut').innerHTML='<div class="card"><div class="head">'+a.name+' • '+(c==='25'?'SCM':'LCM')+' KİŞİSEL TEMPO</div><div class="body">CSS: <b>'+fmt(css(a,c))+'/100</b><table class="pace"><tr><th>SYS</th><th>50</th><th>100</th><th>200</th><th>400</th></tr>'+ss.map(function(s){return'<tr><th>'+s+'</th>'+[50,100,200,400].map(function(d){return'<td>'+range(a,c,s,d)+'</td>'}).join('')+'</tr>'}).join('')+'</table></div></div>'}document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('on')});document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('on')});b.classList.add('on');$(b.dataset.p).classList.add('on');if(b.dataset.p==='athlete')showAth()}});$('date').onchange=function(){sessions();render()};$('profile').onchange=render;$('pool').onchange=render;$('session').onchange=render;$('athSel').onchange=function(){var a=current();if(a)$('profile').value=a.profile;render()};$('acourse').onchange=function(){loadPB();showAth()};$('save').onclick=function(){var name=$('aname').value.trim();if(!name){alert('Sporcu adı gir');return}var a=athletes(),i=a.findIndex(function(x){return x.name.toLowerCase()===name.toLowerCase()}),old=i>=0?a[i]:{name:name,profile:$('aprofile').value,pb:{'25':{},'50':{}}};old.name=name;old.profile=$('aprofile').value;old.pb=old.pb||{'25':{},'50':{}};old.pb[$('acourse').value]=old.pb[$('acourse').value]||{};[50,100,200,400,800,1500].forEach(function(d){old.pb[$('acourse').value][d]=sec($('p'+d).value)});if(i>=0)a[i]=old;else a.push(old);localStorage.setItem('ybAth13',JSON.stringify(a));loadAth(name);showAth();render()};$('lessons').innerHTML=Object.keys(EDU).map(function(k){return'<div class="card"><div class="head">'+k+' • '+EDU[k][0]+'</div><div class="body">'+EDU[k][1]+'</div></div>'}).join('');loadAth();sessions();render()})();</script></body></html>
