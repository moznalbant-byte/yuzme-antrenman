<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V16 Performance Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1100px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;font-weight:900;color:#9fb0c2;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;color:#fde68a;font-size:17px}.head{font-weight:900;margin-bottom:8px}.set{border-top:1px solid #294058;padding:10px 0;line-height:1.45}.set b{color:#fde68a}.tag{display:inline-block;padding:3px 7px;border-radius:8px;background:#17283b;margin:2px;font-size:11px}.why{border-left:3px solid #f97316;background:#0b1625;padding:10px;margin-top:8px;color:#cbd5e1}.warn{border-left-color:#facc15}.good{color:#86efac}@media(max-width:700px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V16 PERFORMANCE ENGINE</b><div class="muted">Athlete → Event → Development → Phase → Load → Goal → Set Family → Individual Target → Validation</div></div><div class="grid"><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>EVENT PROFİLİ</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>GELİŞİM GRUBU</label><select id="dev"><option value="A">A • teknik/erken gelişim</option><option value="B">B • gelişim/PHV çevresi</option><option value="C" selected>C • yüksek performans</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50">50m LCM</option></select></div><div class="box"><label>SEZON FAZI</label><select id="phase"><option>Genel Hazırlık</option><option selected>Özel Hazırlık</option><option>Race Specific</option><option>Taper</option></select></div><div class="box"><label>SEANS AMACI</label><select id="goal"><option>Aerobik Ekonomi</option><option>Threshold / END2</option><option>Aerobik Güç / END3</option><option>Saf Hız</option><option>Speed Endurance</option><option selected>Race Pace</option></select></div></div><div id="out"></div></div><script>(function(){var $=x=>document.getElementById(x);function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function fmt(s){if(!s||!isFinite(s))return'—';var m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}function css(a,c){var p=a&&a.pb&&a.pb[c];return p&&p[400]&&p[200]?200/(p[400]-p[200]):null}function rp(a,c,d){var p=a&&a.pb&&a.pb[c]||{},t=p[d];return t?{t:t,p50:t/(d/50),p100:t/(d/100)}:null}var RULES={"50/100":{vol:[2200,3800],rep:'12.5–50m',rest:'1:3–1:8+',skills:'Start • 15m • breakout • finish',families:{'Saf Hız':'Pure Speed Cluster','Speed Endurance':'Broken 100 / lactate tolerance','Race Pace':'50/100 Race Pace Cluster'}},"100/200":{vol:[3200,4800],rep:'25–100m',rest:'kaliteye göre 1:2–1:5',skills:'Start • turn • breakout • son 25/50',families:{'Threshold / END2':'Threshold support','Aerobik Güç / END3':'Aerobic power 100s','Speed Endurance':'Speed endurance 50/75','Race Pace':'Broken 200 Race Model'}},"200/400":{vol:[4200,6000],rep:'50–300m',rest:'15sn–3dk amaca göre',skills:'Turn • pace judgement • finish',families:{'Aerobik Ekonomi':'Economy + DPS','Threshold / END2':'Over-under threshold','Aerobik Güç / END3':'Aerobic power ladder','Race Pace':'200/400 Race Pace Progression'}},"400/800":{vol:[5200,7000],rep:'100–600m',rest:'15–60sn',skills:'Pace judgement • turns • race finish',families:{'Aerobik Ekonomi':'Negative aerobic','Threshold / END2':'CSS threshold blocks','Aerobik Güç / END3':'Broken aerobic power','Race Pace':'400/800 Pace Change'}},"800/1500":{vol:[6000,8000],rep:'200–1500m',rest:'10–45sn',skills:'Economy • pace discipline • finish',families:{'Aerobik Ekonomi':'Long economy / fartlek','Threshold / END2':'Long threshold','Aerobik Güç / END3':'Controlled aerobic power','Race Pace':'800/1500 Race Rhythm'}}};function prescription(ev,goal,a,c,dev){if(dev==='A')return[{name:'Beceri Devresi',set:'12×50 çeşitli drill/oyun + 8×25 kontrollü hız',rest:'15–30 sn',rpe:'3–5',tol:'Süre değil teknik kalite',stop:'Teknik bozulursa görevi değiştir',why:'Grup A’da katı CSS reçetesi yerine motor öğrenme ve çok yönlü yüzme öncelikli.'}];var R=RULES[ev],family=R.families[goal]||goal,base=rp(a,c,ev==='50/100'?100:ev==='100/200'?200:ev==='200/400'?200:ev==='400/800'?400:800),target=base?fmt(base.p50):'PB/Test gerekli';if(goal==='Race Pace')return[{name:family,set:ev==='50/100'?'2×(4×25 RP + 2×50 RP)':'3×(4×50 RP + 200 A1 reset)',rest:ev==='50/100'?'25: 90sn • 50: 2–3dk':'50: 20–30sn • blok: 2–3dk',rpe:'7–9',tol:'±1.5–2%',stop:'2 ardışık tekrarda >%3 pace kaybı veya teknik kriter ihlali',why:'Yarış hızını kontrollü tekrar ederek split, dönüş ve finish davranışını yarışa transfer etmek.',target:target}];if(goal==='Threshold / END2')return[{name:family,set:'3×(4×200 END2 + 200 A1 reset)',rest:'200: 20sn • blok: 2dk',rpe:'6–7',tol:'±2%',stop:'Son 3 tekrarda >%3 progresif pace kaybı',why:'Sürdürülebilir yüksek aerobik hız ve pace kontrolü. CSS yalnız uygun profilde yaklaşık referanstır.',target:css(a,c)?fmt(100/css(a,c))+'/100m':'CSS testi gerekli'}];if(goal==='Saf Hız')return[{name:family,set:'3×(6×25 maksimum kalite)',rest:'90sn–2dk • blok 4dk',rpe:'8–9',tol:'En iyi 25 hızının %95+ bölgesi',stop:'2 tekrarda >%3 hız kaybı',why:'Saf hız CSS’den değil kısa mesafe maksimal hız verisinden kalibre edilmelidir.'}];return[{name:family,set:'Amaç ve event profiline göre progresif set ailesi',rest:R.rest,rpe:'5–8',tol:'Amaç bazlı',stop:'Pace + teknik kalite birlikte değerlendirilir',why:'V16 seti rastgele seçmez; event, gelişim grubu, faz ve seans amacı kesişiminden üretir.'}]}function render(){var list=athletes(),a=list.find(x=>x.name===$('ath').value),ev=$('event').value,dev=$('dev').value,c=$('course').value,g=$('goal').value,R=RULES[ev],P=prescription(ev,g,a,c,dev),load=JSON.parse(localStorage.getItem('v16Load')||'{"rpe":0,"pace":0}'),flag=load.rpe>=8&&load.pace<=-3?'TOPARLANMA BAYRAĞI':'NORMAL';$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+ev+'</b>EVENT</div><div class="kpi"><b>'+R.vol[0]+'–'+R.vol[1]+'m</b>SEANS BANDI</div><div class="kpi"><b>'+R.rep+'</b>TEKRAR</div><div class="kpi"><b>'+flag+'</b>READINESS</div></div><div class="card"><div class="head">ATHLETE INTELLIGENCE</div><span class="tag">'+(a?a.name:'Sporcu seçilmedi')+'</span><span class="tag">Grup '+dev+'</span><span class="tag">'+$('phase').value+'</span><span class="tag">'+c+'m</span><div class="why">Race skills: <b>'+R.skills+'</b>. SCM/LCM için sabit dönüşüm katsayısı kullanılmıyor; her kulvarın PB/test verisi ayrı okunuyor.</div></div>'+P.map(x=>'<div class="card"><div class="head">MAIN SET • '+x.name+'</div><div class="set"><b>'+x.set+'</b></div>'+(x.target?'<div class="set">Kişisel hedef referansı: <b>'+x.target+'</b></div>':'')+'<div class="set">Dinlenme: <b>'+x.rest+'</b> • RPE: <b>'+x.rpe+'</b></div><div class="set">Pace toleransı: <b>'+x.tol+'</b></div><div class="set">Durdur/değiştir: <b>'+x.stop+'</b></div><div class="why"><b>KOÇA NEDEN?</b> '+x.why+'</div></div>').join('')+'<div class="card"><div class="head">PLAN → ACTUAL / ADAPTASYON</div><div class="grid"><div class="box"><label>SON SEANS RPE</label><input id="rpe" type="number" min="1" max="10" value="'+(load.rpe||'')+'"></div><div class="box"><label>PACE SAPMASI %</label><input id="pace" type="number" step="0.1" value="'+(load.pace||'')+'"></div><div class="box"><label>TEKNİK</label><select id="tech"><option>Temiz</option><option>Bozuldu</option></select></div></div><button id="saveLoad" style="margin-top:8px;padding:10px;width:100%;font-weight:900">GERİ BİLDİRİMİ KAYDET</button><div class="why warn">Bu sürüm ACWR’yi tek başına sakatlık kararı olarak kullanmaz. RPE + pace sapması + teknik kalite + yük trendi birlikte karar desteği üretmek üzere geliştiriliyor.</div></div>';$('saveLoad').onclick=function(){localStorage.setItem('v16Load',JSON.stringify({rpe:+$('rpe').value||0,pace:+$('pace').value||0,tech:$('tech').value,date:new Date().toISOString()}));render()}}var list=athletes();$('ath').innerHTML='<option value="">Sporcu seç</option>'+list.map(a=>'<option>'+a.name+'</option>').join('');['ath','event','dev','course','phase','goal'].forEach(id=>$(id).onchange=render);render()})();</script></body></html>
