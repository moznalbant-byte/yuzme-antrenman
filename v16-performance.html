<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V16 Performance Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1100px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;font-weight:900;color:#9fb0c2;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;color:#fde68a;font-size:17px}.head{font-weight:900;margin-bottom:8px}.set{border-top:1px solid #294058;padding:10px 0;line-height:1.45}.set b{color:#fde68a}.tag{display:inline-block;padding:3px 7px;border-radius:8px;background:#17283b;margin:2px;font-size:11px}.why{border-left:3px solid #f97316;background:#0b1625;padding:10px;margin-top:8px;color:#cbd5e1}.warn{border-left-color:#facc15}.good{color:#86efac}.meter{float:right;background:#07111f;padding:3px 8px;border-radius:9px;color:#fde68a}@media(max-width:700px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V16 PERFORMANCE ENGINE</b><div class="muted">Tam birim: Warm-up → Technique → Kick/Pull → Pre-set → Main → Secondary → Race Skills → Cooldown → Actual</div></div><div class="grid"><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>EVENT PROFİLİ</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>GELİŞİM GRUBU</label><select id="dev"><option value="A">A • teknik/erken gelişim</option><option value="B">B • gelişim/PHV çevresi</option><option value="C" selected>C • yüksek performans</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50">50m LCM</option></select></div><div class="box"><label>SEZON FAZI</label><select id="phase"><option>Genel Hazırlık</option><option selected>Özel Hazırlık</option><option>Race Specific</option><option>Taper</option></select></div><div class="box"><label>SEANS AMACI</label><select id="goal"><option>Aerobik Ekonomi</option><option>Threshold / END2</option><option>Aerobik Güç / END3</option><option>Saf Hız</option><option>Speed Endurance</option><option selected>Race Pace</option></select></div></div><div id="out"></div></div><script>(function(){var $=x=>document.getElementById(x);function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function fmt(s){if(!s||!isFinite(s))return'—';var m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}function css(a,c){var p=a&&a.pb&&a.pb[c];return p&&p[400]&&p[200]?200/(p[400]-p[200]):null}function rp(a,c,d){var p=a&&a.pb&&a.pb[c]||{},t=p[d];return t?{t:t,p50:t/(d/50),p100:t/(d/100)}:null}var RULES={"50/100":{vol:[2200,3800],rep:'12.5–50m',skills:'Start • 15m • breakout • finish',families:{'Saf Hız':'Pure Speed Cluster','Speed Endurance':'Broken 100 / lactate tolerance','Race Pace':'50/100 Race Pace Cluster'}},"100/200":{vol:[3200,4800],rep:'25–100m',skills:'Start • turn • breakout • son 25/50',families:{'Threshold / END2':'Threshold support','Aerobik Güç / END3':'Aerobic power 100s','Speed Endurance':'Speed endurance 50/75','Race Pace':'Broken 200 Race Model'}},"200/400":{vol:[4200,6000],rep:'50–300m',skills:'Turn • pace judgement • finish',families:{'Aerobik Ekonomi':'Economy + DPS','Threshold / END2':'Over-under threshold','Aerobik Güç / END3':'Aerobic power ladder','Race Pace':'200/400 Race Pace Progression'}},"400/800":{vol:[5200,7000],rep:'100–600m',skills:'Pace judgement • turns • race finish',families:{'Aerobik Ekonomi':'Negative aerobic','Threshold / END2':'CSS threshold blocks','Aerobik Güç / END3':'Broken aerobic power','Race Pace':'400/800 Pace Change'}},"800/1500":{vol:[6000,8000],rep:'200–1500m',skills:'Economy • pace discipline • finish',families:{'Aerobik Ekonomi':'Long economy / fartlek','Threshold / END2':'Long threshold','Aerobik Güç / END3':'Controlled aerobic power','Race Pace':'800/1500 Race Rhythm'}}};function mainSet(ev,goal,a,c,dev){if(dev==='A')return{name:'Beceri Devresi',items:[['12×50','çeşitli drill/oyun','15–30sn',600],['8×25','kontrollü hız, teknik temiz','45sn',200]],rpe:'3–5',tol:'teknik kalite',stop:'Teknik bozulursa görevi değiştir',why:'Erken gelişimde katı CSS reçetesi yerine beceri ve çok yönlülük.'};var R=RULES[ev],family=R.families[goal]||goal,bd=ev==='50/100'?100:ev==='100/200'?200:ev==='200/400'?200:ev==='400/800'?400:800,b=rp(a,c,bd);if(goal==='Race Pace')return{name:family,items:ev==='50/100'?[['2×(4×25)','RP kalite','90sn; blok 3dk',200],['4×50','100 RP / finish','2–3dk',200]]:[['3×(4×50)','RP split kalitesi','20–30sn; blok 2–3dk',600],['3×200','A1 reset','30sn',600]],target:b?fmt(b.p50)+'/50m':'PB/Test gerekli',rpe:'7–9',tol:'±1.5–2%',stop:'2 ardışık tekrarda >%3 pace kaybı veya teknik bozulma',why:'Yarış hızını split, dönüş ve finish davranışıyla tekrar üretmek.'};if(goal==='Threshold / END2')return{name:family,items:[['3×(4×200)','END2 / threshold','20sn; blok 2dk',2400],['3×200','A1 reset','30sn',600]],target:css(a,c)?fmt(100/css(a,c))+'/100m':'CSS testi gerekli',rpe:'6–7',tol:'±2%',stop:'Son 3 tekrarda >%3 progresif pace kaybı',why:'Sürdürülebilir yüksek aerobik hız; CSS uygun profilde yaklaşık referanstır.'};if(goal==='Saf Hız')return{name:family,items:[['3×(6×25)','maksimum kalite','90sn–2dk; blok 4dk',450],['6×50','A1 teknik recovery','30sn',300]],rpe:'8–9',tol:'en iyi kısa hızın %95+',stop:'2 tekrarda >%3 hız kaybı',why:'Saf hız kısa maksimal testten kalibre edilir; CSS kullanılmaz.'};if(goal==='Speed Endurance')return{name:family,items:[['4×(3×50)','yüksek kalite / hız dayanıklılığı','60–90sn; blok 4dk',600],['4×100','A1 reset','30sn',400]],rpe:'8–9',tol:'±2%',stop:'2 ardışık tekrarda >%3 hız kaybı',why:'Maksimal hızı yarış boyunca koruma kapasitesini geliştirmek.'};if(goal==='Aerobik Güç / END3')return{name:family,items:[['4×(4×100)','A3→END3 descend','20–25sn; blok 2dk',1600],['8×100','A2 teknik reset','15sn',800]],rpe:'7–8',tol:'±2%',stop:'Teknik kayıp + pace düşüşü birlikteyse blok kes',why:'Yüksek aerobik güç; kalite korunarak eşik üstü uyaran.'};return{name:family,items:[['3×800','A2 ekonomi / negatif split','25sn',2400],['8×100','DPS + stroke count','15sn',800]],rpe:'4–6',tol:'ritim tutarlılığı',stop:'DPS belirgin düşerse dinlenme artır',why:'Aerobik ekonomi ve teknik sürdürülebilirlik.'}}function support(ev,goal,dev){if(dev==='A')return{warm:[['400','karışık kolay + oyunlu koordinasyon','—',400]],tech:[['8×50','drill / scull / streamline','20sn',400]],kp:[['8×50','4 kick + 4 pull teknik','20sn',400]],pre:[['8×25','build, teknik bozulmadan','30sn',200]],secondary:[['8×50','çoklu stil beceri','20sn',400]],skills:[['8×15m','çıkış/streamline/breakout oyunlu kalite','tam dinlenme',120]],cool:[['200','easy mixed','—',200]]};var sprint=ev==='50/100'||ev==='100/200',long=ev==='400/800'||ev==='800/1500';return{warm:sprint?[['400','A1 mixed','—',400],['4×100','50 kick + 50 swim build','15sn',400]]:long?[['600','A1 mixed','—',600],['6×100','build 1–3 / 4–6','15sn',600]]:[['500','A1 mixed','—',500],['5×100','build','15sn',500]],tech:[['8×50','25 drill + 25 swim; DPS','15sn',400],['4×50','streamline + breakout','30sn',200]],kp:sprint?[['8×50','power kick; odd board/even streamline','30sn',400],['6×50','pull teknik, yüksek dirsek','20sn',300]]:long?[['8×100','pull A2, DPS sabit','15sn',800],['8×50','kick A2 build','20sn',400]]:[['6×100','pull A2/A3','20sn',600],['8×50','kick build','20sn',400]],pre:goal==='Race Pace'?[['8×50','1 easy / 1 build / 1 RP feel / 1 easy ×2','20sn',400]]:goal==='Saf Hız'?[['6×25','build to fast, tam kalite','45sn',150]]:[['6×100','A2→A3 progressive','20sn',600]],secondary:sprint?[['8×50','easy-fast by 25, teknik korunur','30sn',400]]:long?[['6×200','A2 negatif split','20sn',1200]]:[['6×150','A2/A3 kontrollü','20sn',900]],skills:sprint?[['6×15m','start + breakout ölçümü','tam dinlenme',90],['6×25','turn in/out + finish','60sn',150]]:long?[['8×50','turn + 10m çıkış, ritim kaybetme','30sn',400],['4×100','race finish son 25 build','30sn',400]]:[['8×50','turn + breakout + finish','40sn',400]],cool:[['300','A1 easy mixed','—',300],['4×50','uzun kulaç + nefes normalizasyonu','15sn',200]]}}function meters(a){return a.reduce((s,x)=>s+x[3],0)}function card(title,a){return'<div class="card"><div class="head">'+title+' <span class="meter">'+meters(a)+' m</span></div>'+a.map(x=>'<div class="set"><b>'+x[0]+'</b> • '+x[1]+'<br><span class="muted">Dinlenme: '+x[2]+' • '+x[3]+' m</span></div>').join('')+'</div>'}function render(){var list=athletes(),a=list.find(x=>x.name===$('ath').value),ev=$('event').value,dev=$('dev').value,c=$('course').value,g=$('goal').value,R=RULES[ev],M=mainSet(ev,g,a,c,dev),S=support(ev,g,dev),load=JSON.parse(localStorage.getItem('v16Load')||'{"rpe":0,"pace":0}'),flag=(load.rpe>=8&&load.pace<=-3)||load.tech==='Bozuldu'?'DİKKAT / RECOVERY':'NORMAL',mainM=meters(M.items),total=meters(S.warm)+meters(S.tech)+meters(S.kp)+meters(S.pre)+mainM+meters(S.secondary)+meters(S.skills)+meters(S.cool);$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+ev+'</b>EVENT</div><div class="kpi"><b>'+total+' m</b>GERÇEK TOPLAM</div><div class="kpi"><b>'+R.rep+'</b>TEKRAR PROFİLİ</div><div class="kpi"><b>'+flag+'</b>READINESS</div></div><div class="card"><div class="head">ATHLETE INTELLIGENCE</div><span class="tag">'+(a?a.name:'Sporcu seçilmedi')+'</span><span class="tag">Grup '+dev+'</span><span class="tag">'+$('phase').value+'</span><span class="tag">'+c+'m</span><span class="tag">'+g+'</span><div class="why">Race skills: <b>'+R.skills+'</b>. Bu seansın toplamı kartların gerçek metrelerinin toplamıdır.</div></div>'+card('1 • ISINMA',S.warm)+card('2 • TEKNİK / MOTOR KALİTE',S.tech)+card('3 • KICK / PULL',S.kp)+card('4 • PRE-SET',S.pre)+'<div class="card"><div class="head">5 • MAIN SET • '+M.name+' <span class="meter">'+mainM+' m</span></div>'+M.items.map(x=>'<div class="set"><b>'+x[0]+'</b> • '+x[1]+'<br><span class="muted">Dinlenme: '+x[2]+' • '+x[3]+' m</span></div>').join('')+(M.target?'<div class="set">Kişisel hedef: <b>'+M.target+'</b></div>':'')+'<div class="set">RPE: <b>'+M.rpe+'</b> • Pace toleransı: <b>'+M.tol+'</b></div><div class="set">Durdur/değiştir: <b>'+M.stop+'</b></div><div class="why"><b>KOÇA NEDEN?</b> '+M.why+'</div></div>'+card('6 • SECONDARY SET',S.secondary)+card('7 • RACE SKILLS',S.skills)+card('8 • COOLDOWN',S.cool)+'<div class="card"><div class="head">PLAN → ACTUAL / ADAPTASYON</div><div class="grid"><div class="box"><label>SON SEANS RPE</label><input id="rpe" type="number" min="1" max="10" value="'+(load.rpe||'')+'"></div><div class="box"><label>PACE SAPMASI %</label><input id="pace" type="number" step="0.1" value="'+(load.pace||'')+'"></div><div class="box"><label>TEKNİK</label><select id="tech"><option '+(load.tech==='Temiz'?'selected':'')+'>Temiz</option><option '+(load.tech==='Bozuldu'?'selected':'')+'>Bozuldu</option></select></div></div><button id="saveLoad" style="margin-top:8px;padding:10px;width:100%;font-weight:900">GERİ BİLDİRİMİ KAYDET</button><div class="why warn">Readiness tek bir ACWR eşiğine bağlanmaz. RPE + pace sapması + teknik kalite birlikte bayrak üretir; nihai karar koçtadır.</div></div>';$('saveLoad').onclick=function(){localStorage.setItem('v16Load',JSON.stringify({rpe:+$('rpe').value||0,pace:+$('pace').value||0,tech:$('tech').value,date:new Date().toISOString()}));render()}}var list=athletes();$('ath').innerHTML='<option value="">Sporcu seç</option>'+list.map(a=>'<option>'+a.name+'</option>').join('');['ath','event','dev','course','phase','goal'].forEach(id=>$(id).onchange=render);render()})();</script></body></html>
