<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V17 Closed Loop Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1180px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;color:#fde68a;font-size:17px}.row{border-top:1px solid #294058;padding:10px 0;line-height:1.5}.row b{color:#fde68a}.ok,.warn,.bad{background:#0b1625;padding:10px;border-left:3px solid #22c55e}.warn{border-left-color:#facc15}.bad{border-left-color:#ef4444}.tag{display:inline-block;background:#17283b;border-radius:8px;padding:4px 7px;margin:2px;font-size:11px}.nav a{display:inline-block;color:#fff;text-decoration:none;background:#17283b;padding:8px 10px;border-radius:8px;margin:3px}.btn{display:inline-block;color:#fff;text-decoration:none;background:#f97316;padding:10px 12px;border-radius:9px;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V17 CLOSED LOOP ENGINE</b><div class="muted">Test → kişisel hedef → antrenman önerisi → gerçekleşen geri bildirim → sonraki karar.</div><div class="nav"><a href="v17-test-entry.html">Test Girişi</a><a href="v17-coach-dashboard.html">Coach Dashboard</a><a href="v17-season-engine.html">Season Engine</a></div></div><div class="grid"><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>EVENT</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50">50m LCM</option></select></div></div><div id="out"></div></div><script>(function(){const $=x=>document.getElementById(x);function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function tests(){try{return JSON.parse(localStorage.getItem('v17Tests')||'[]')}catch(e){return[]}}function latest(name,type,course){return tests().filter(x=>x.athlete===name&&x.type===type&&(!course||x.course===course)).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}function fmt(s){if(!s||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}function ageDays(date){return date?Math.floor((Date.now()-new Date(date).getTime())/86400000):9999}function stale(rec,days){return !rec||ageDays(rec.date)>days}function pb(a,c,d){return a&&a.pb&&a.pb[c]&&a.pb[c][d]||null}function raceTarget(a,c,event){let dist=event==='50/100'?100:event==='100/200'?200:event==='200/400'?200:event==='400/800'?400:800,t=pb(a,c,dist);return t?{dist:dist,p50:t/(dist/50),p100:t/(dist/100)}:null}function render(){let name=$('ath').value,a=athletes().find(x=>x.name===name),event=$('event').value,stroke=$('stroke').value,c=$('course').value,css=latest(name,'css',c),spr=latest(name,'sprint',c),eff=latest(name,'eff',c),well=latest(name,'wellness'),skill=latest(name,'skills',c),rp=raceTarget(a,c,event);let css100=css&&css.derived&&css.derived.css100,s25=spr&&spr.data&&(+spr.data.v25||null),s50=spr&&spr.data&&(+spr.data.v50||null),readiness=well&&well.derived&&well.derived.readiness;let readinessFlag=!well?'VERİ YOK':readiness>=6.5?'HAZIR':readiness>=5?'ORTA':'DİKKAT';let cssState=stale(css,42)?'GÜNCEL DEĞİL':'GÜNCEL',sprState=stale(spr,42)?'GÜNCEL DEĞİL':'GÜNCEL';let goal;if(event==='50/100')goal=s25?('25m kalite hedefi: '+(s25/0.98).toFixed(2)+'–'+(s25/0.95).toFixed(2)+' sn'):'25m sprint testi gerekli';else goal=css100?('END2 referansı ≈ '+fmt(css100)+'/100m'):'CSS testi gerekli';let decision='NORMAL YÜK';if(readinessFlag==='DİKKAT')decision='YÜKÜ AZALT / RECOVERY';else if(readinessFlag==='ORTA')decision='KALİTEYİ KORU, HACMİ TEMKİNLİ';if(eff&&eff.data&&+eff.data.breakrep&&+eff.data.breakrep<=5)decision+=' • TEKNİK BOZULMA ERKEN';$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+cssState+'</b>CSS</div><div class="kpi"><b>'+sprState+'</b>SPRINT</div><div class="kpi"><b>'+readinessFlag+'</b>READINESS</div><div class="kpi"><b>'+decision+'</b>KARAR</div></div><div class="card"><b>SON TEST REFERANSLARI</b><div class="row"><b>CSS</b> '+(css?css.date+' • '+fmt(css100)+'/100':'Kayıt yok')+' '+(css?'<span class="tag">'+css.course+'m</span>':'')+'</div><div class="row"><b>Sprint</b> '+(spr?spr.date+' • 25m '+(s25||'—')+' • 50m '+(s50||'—'):'Kayıt yok')+'</div><div class="row"><b>Efficiency</b> '+(eff?eff.date+' • DPS '+((eff.derived&&eff.derived.distancePerStroke)?eff.derived.distancePerStroke.toFixed(2):'—')+' • SR '+(eff.data.sr||'—'):'Kayıt yok')+'</div><div class="row"><b>Race skills</b> '+(skill?skill.date+' • Start15 '+(skill.data.start15||'—')+' • breakout '+(skill.data.bo||'—')+'m':'Kayıt yok')+'</div><div class="row"><b>Wellness</b> '+(well?well.date+' • readiness '+(readiness?readiness.toFixed(1):'—')+' • RPE '+(well.data.rpe||'—'):'Kayıt yok')+'</div></div><div class="card"><b>BUGÜNKÜ KİŞİSEL HEDEF MOTORU</b><div class="row"><b>'+event+' • '+stroke+'</b><br>'+goal+'</div><div class="row"><b>Race Pace</b><br>'+(rp?('50 split ≈ '+fmt(rp.p50)+' • 100 split ≈ '+fmt(rp.p100)):'Event PB gerekli')+'</div><div class="'+(readinessFlag==='DİKKAT'?'bad':readinessFlag==='ORTA'?'warn':'ok')+'"><b>Koç önerisi:</b> '+decision+'. Test verileri 6 haftadan eskiyse yeni testle doğrula. SCM ve LCM verilerini ayrı tut.</div></div><div class="card"><b>KAPALI DÖNGÜ KURALI</b><div class="row">1. Test kaydı girilir.</div><div class="row">2. Sistem en güncel ve aynı havuzdaki testi bulur.</div><div class="row">3. END2 / sprint / race-pace hedefi hesaplanır.</div><div class="row">4. Seans sonrası RPE, pace ve teknik geri bildirimi girilir.</div><div class="row">5. İki ardışık kaliteli doğrulamada tempo güncelleme önerisi; kötü readiness veya erken teknik bozulmada yük azaltma önerisi çıkar.</div><div class="ok">Sistem otomatik ve geri döndürülemez değişiklik yapmaz; koç onayı korunur.</div></div><a class="btn" href="v17-season-engine.html">Antrenman Motoruna Geç →</a>'}function init(){let a=athletes();$('ath').innerHTML='<option value="">Sporcu seç</option>'+a.map(x=>'<option>'+x.name+'</option>').join('');['ath','event','stroke','course'].forEach(id=>$(id).onchange=render);render()}init()})();</script></body></html>
