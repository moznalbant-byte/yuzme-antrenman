<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V17 Coach Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1180px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;color:#fde68a}.test{border-top:1px solid #294058;padding:10px 0;line-height:1.45}.test b{color:#fde68a}.alert{border-left:3px solid #f97316;background:#0b1625;padding:12px}.ok{border-left-color:#22c55e}.warn{border-left-color:#facc15}.nav a,.btn{display:inline-block;color:#fff;text-decoration:none;background:#17283b;padding:8px 10px;border-radius:8px;margin:3px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#0c1827;border:1px solid #294058;border-radius:10px;padding:8px;min-height:110px}.day b{display:block;color:#fde68a}.mini{font-size:10px;color:#cbd5e1;margin-top:5px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.week{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.week{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V17 COACH DASHBOARD</b><div class="muted">Season Engine + Test Calendar tek ekranda. Tarihi seç → fazı gör → haftanın antrenman hedeflerini ve yapılması gereken ölçümleri birlikte gör.</div><div class="nav"><a href="v17-season-engine.html">Antrenman Motoru</a><a href="v17-test-calendar.html">Test Takvimi</a><a href="v17-test-guide.html">Test Rehberi</a></div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date" value="2026-09-22"></div><div class="box"><label>EVENT</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div><div class="box"><label>GELİŞİM</label><select id="dev"><option value="A">A • erken gelişim</option><option value="B">B • PHV çevresi</option><option value="C" selected>C • yüksek performans</option></select></div></div><div id="out"></div></div><script>(function(){const $=x=>document.getElementById(x),DAYS=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON','Teknik + başlangıç kapasitesi'];if(m===10)return['GENEL HAZIRLIK','Kapasite + teknik'];if(m===11)return['ÖZEL HAZIRLIK','Threshold + power + RP'];if(m===12&&n<8)return['RACE SPECIFIC I','Yarış modeli'];if(m===12&&n<15)return['TAPER I','Hacim ↓ kalite korunur'];if(m===12)return['PEAK I / TRANSITION','İlk zirve'];if(m===1)return['REBUILD','Yenilenme + baseline'];if(m===2)return['GENEL HAZIRLIK II','Kapasite + kuvvet'];if(m===3)return['ÖZEL HAZIRLIK II','Threshold + power + RP'];if(m===4)return['RACE SPECIFIC II','Ana yarış modeli'];if(m===5&&n<5)return['TAPER II','Ana taper'];if(m===5&&n<16)return['PEAK II','Ana yarış'];if(m===5)return['TRANSITION','Toparlanma'];if(m===6)return['GEÇİŞ','Teknik + yenilenme'];if(m===7)return['GELİŞİM','Teknik + genel kapasite'];return['PRE-SEASON','Yeni sezon tabanı']}function wk(d){let s=new Date(2026,8,21,12),w=Math.floor((d-s)/604800000);return{n:w+1,deload:((w%4)+4)%4===3}}function tests(ph,event,dev){let sprint=event==='50/100'||event==='100/200';if(dev==='A')return[['Teknik video + stroke count','4–6 haftada bir, tercihen deload','tech'],['15m / 25m kontrollü hız','4–6 haftada bir','speed'],['Boy / gelişim','6–8 haftada bir','growth']];if(ph[0]==='ADAPTASYON'||ph[0]==='PRE-SEASON'||ph[0]==='REBUILD')return[[sprint?'15/25/50 sprint baseline':'CSS 200+400 baseline','Fazın ilk 7–10 günü',sprint?'speed':'css'],['8×50 efficiency','İlk 2 hafta','tech'],['Start / turn / breakout','İlk 2 hafta','tech']];if(ph[0].includes('GENEL'))return[[sprint?'15/25m sprint':'CSS / 7×200 step','4–6 hafta; deload ideal',sprint?'speed':'css'],['8×50 efficiency','4–6 hafta','tech'],['Wellness + RPE','Her seans','recovery']];if(ph[0].includes('ÖZEL'))return[[sprint?'Sprint + speed endurance':'CSS / step test','Fazın 2.–3. haftası',sprint?'speed':'css'],['Race-pace test','Faz sonuna doğru','race'],['Start-turn-breakout','4–6 haftada bir','tech']];if(ph[0].includes('RACE SPECIFIC'))return[['Race Model Test','Ana yarıştan 2–4 hafta önce','race'],['Kısa speed check','10–21 gün önce','speed']];if(ph[0].includes('TAPER'))return[['Kısa kalite kontrol','Yarıştan 5–10 gün önce','speed'],['Start / breakout / turn check','3–7 gün önce','tech'],['Wellness + RPE','Her gün','recovery']];if(ph[0].includes('PEAK'))return[['Yarış sonucu + split','Her ana yarış','race'],['Start/turn analizi','Yarış sonrası 24–72 saat','tech']];return[['Teknik video / wellness','Düşük stresli dönemde','tech']]}function weekGoals(ph){if(ph[0].includes('TAPER')||ph[0].includes('PEAK'))return['Recovery/Teknik','Race Pace','Saf Hız','Recovery/Teknik','Race Pace','Saf Hız','Race Pace'];if(ph[0].includes('ÖZEL')||ph[0].includes('RACE SPECIFIC'))return['Recovery','Threshold','Aerobik Güç','Race Pace','Recovery/Teknik','Speed Endurance','Aerobik Ekonomi'];return['Recovery','Aerobik Ekonomi','Threshold','Teknik','Recovery/Teknik','Aerobik Güç','Aerobik Ekonomi']}function render(){let d=new Date($('date').value+'T12:00:00'),ph=phase(d),w=wk(d),ts=tests(ph,$('event').value,$('dev').value),goals=weekGoals(ph),mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+ph[0]+'</b>FAZ</div><div class="kpi"><b>H'+w.n+'</b>HAFTA</div><div class="kpi"><b>'+(w.deload?'DELOAD':'BUILD')+'</b>MİKRO</div><div class="kpi"><b>'+ts.length+'</b>TEST/ÖLÇÜM</div></div><div class="card"><div class="alert '+(w.deload?'ok':'warn')+'"><b>🧪 '+(ts.length?'ÖLÇÜM PENCERESİ':'TEST YOK')+'</b><br>'+(w.deload?'Deload haftası: karşılaştırmalı test için uygun pencere.':'Build haftası: testleri ana kalite setleriyle çakıştırma; gerekiyorsa test, o günün ana kalite işi olsun.')+'</div>'+ts.map(t=>'<div class="test"><b>'+t[0]+'</b> • '+t[1]+' <a class="btn" href="v17-test-guide.html#'+t[2]+'">Nasıl Ölçerim?</a></div>').join('')+'</div><div class="card"><b>BU HAFTANIN ANTRENMAN HARİTASI</b><div class="week">'+goals.map((g,i)=>{let x=new Date(mon);x.setDate(mon.getDate()+i);return'<div class="day"><b>'+DAYS[(i+1)%7]+' • '+x.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})+'</b><div class="mini">'+(i===0?'OFF / toparlanma':g)+'</div><div class="mini">'+(i===0?'':$('stroke').value+' • '+$('event').value)+'</div></div>'}).join('')+'</div></div><div class="card"><div class="alert"><b>Karar zinciri</b><br>Test sonucu → kişisel tempo/teknik referansı → Season Engine set hedefi → Plan/Actual → sonraki yük kararı. Test tek başına otomatik yük değişikliği yapmaz; koç onayı korunur.</div><a class="btn" href="v17-season-engine.html">Bu tarihin antrenmanını aç →</a></div>'}['date','event','stroke','dev'].forEach(x=>$(x).onchange=render);render()})();</script></body></html>
