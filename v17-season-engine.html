<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kumsal Spor V17 Season Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1180px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:9px;text-align:center}.kpi b{display:block;color:#fde68a;font-size:16px}.tag{display:inline-block;background:#17283b;border-radius:8px;padding:4px 7px;margin:2px;font-size:11px}.head{font-weight:900}.set{padding:9px 0;border-top:1px solid #294058;line-height:1.45}.set b{color:#fde68a}.meter{float:right;background:#07111f;padding:3px 8px;border-radius:9px;color:#fde68a}.why{border-left:3px solid #f97316;background:#0b1625;padding:10px;margin-top:8px;color:#cbd5e1}.warn{border-left-color:#facc15}.ok{color:#86efac}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#0c1827;border:1px solid #294058;border-radius:10px;padding:8px;min-height:130px}.day b{display:block;color:#fde68a}.mini{font-size:10px;color:#cbd5e1;margin-top:5px}.peak{border-color:#f97316}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.week{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V17 PERIODIZED SEASON ENGINE</b><div class="muted">Tarih → Faz → Mikro döngü → Event → Branş → Gelişim → Seans amacı → Set ailesi → Kişisel hedef → Gerçekleşen geri bildirim</div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date" value="2026-09-22"></div><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>EVENT PROFİLİ</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>BRANŞ</label><select id="stroke"><option selected>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div><div class="box"><label>GELİŞİM</label><select id="dev"><option value="A">A • teknik/erken gelişim</option><option value="B">B • gelişim/PHV çevresi</option><option value="C" selected>C • yüksek performans</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50">50m LCM</option></select></div><div class="box"><label>SEANS</label><select id="session"></select></div><div class="box"><label>KOÇ OVERRIDE</label><select id="override"><option value="auto">Otomatik</option><option>Aerobik Ekonomi</option><option>Threshold / END2</option><option>Aerobik Güç / END3</option><option>Race Pace</option><option>Saf Hız</option><option>Speed Endurance</option><option>Recovery / Teknik</option></select></div></div><div id="out"></div></div><script>(function(){'use strict';const $=x=>document.getElementById(x);const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function fmt(s){if(!s||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(1).padStart(4,'0');return m?m+':'+x:x}function pb(a,c,d){return a&&a.pb&&a.pb[c]&&a.pb[c][d]||null}function css(a,c){let p=a&&a.pb&&a.pb[c];return p&&p[400]&&p[200]?200/(p[400]-p[200]):null}function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON','Genel hazırlık',0.78];if(m===10)return['GENEL HAZIRLIK','Kapasite + teknik',0.94];if(m===11)return['ÖZEL HAZIRLIK','Threshold + power + RP',1.00];if(m===12&&n<8)return['RACE SPECIFIC I','Yarış özgüllüğü',0.88];if(m===12&&n<15)return['TAPER I','Hacim düşer, kalite korunur',0.66];if(m===12)return['PEAK I / TRANSITION','İlk zirve + toparlanma',0.52];if(m===1)return['REBUILD','Yenilenme + yeniden yükleme',0.72];if(m===2)return['GENEL HAZIRLIK II','Kapasite + kuvvet',0.92];if(m===3)return['ÖZEL HAZIRLIK II','Threshold + power + RP',1.00];if(m===4)return['RACE SPECIFIC II','Hedef yarış modeli',0.90];if(m===5&&n<5)return['TAPER II','Ana zirve taper',0.64];if(m===5&&n<16)return['PEAK II','Ana yarış',0.48];if(m===5)return['TRANSITION','Aktif toparlanma',0.55];if(m===6)return['GEÇİŞ','Teknik + mental/fiziksel yenilenme',0.55];if(m===7)return['GELİŞİM','Teknik + genel kapasite',0.70];return['PRE-SEASON','Yeni sezon tabanı',0.76]}function micro(d){let s=new Date(2026,8,21,12),w=Math.floor((d-s)/604800000),wave=['BUILD 1','BUILD 2','BUILD 3','DELOAD'];return{week:w+1,wave:wave[((w%4)+4)%4],factor:[.94,1,1.06,.84][((w%4)+4)%4]}}const EVENT={"50/100":{base:3400,main:'sprint',rep:'12.5–75m',skills:'start • 15m • breakout • turn • finish'},"100/200":{base:4300,main:'speed-endurance',rep:'25–150m',skills:'start • turn • breakout • race finish'},"200/400":{base:5400,main:'middle',rep:'50–300m',skills:'pace judgement • turns • finish'},"400/800":{base:6400,main:'middle-distance',rep:'100–600m',skills:'economy • turns • race finish'},"800/1500":{base:7400,main:'distance',rep:'200–1500m',skills:'economy • pace discipline • finish'}};const STROKE={Serbest:{tech:'DPS + stroke rate dengesi; yüksek dirsek catch; streamline',skill:'turn-in/turn-out + breakout'},Sırtüstü:{tech:'body line + rotation + early catch',skill:'underwater dolphin + breakout + turn approach'},Kurbağalama:{tech:'pull-kick timing + narrow kick + line',skill:'pullout + breakout + turn/finish'},Kelebek:{tech:'wave rhythm + 2nd kick + breathing control',skill:'underwater + breakout + last-15m rhythm'},'Bireysel Karışık':{tech:'4 stroke efficiency + transition pacing',skill:'stroke transitions + legal turns + weak-stroke support'}};const WEEK={Salı:{AM:'Aerobik Ekonomi',PM:'Saf Hız'},Çarşamba:{Tek:'Threshold / END2'},Perşembe:{AM:'Aerobik Güç / END3',PM:'Race Pace'},Cuma:{Tek:'Recovery / Teknik'},Cumartesi:{AM:'Threshold / END2',PM:'Speed Endurance'},Pazar:{AM:'Aerobik Ekonomi',PM:'Race Pace'}};function adaptGoal(base,ph,event){if(ph[0].startsWith('TAPER')||ph[0].startsWith('PEAK')){if(base==='Aerobik Ekonomi')return'Recovery / Teknik';if(base==='Threshold / END2')return event==='800/1500'?'Threshold / END2':'Race Pace';if(base==='Aerobik Güç / END3')return'Race Pace'}if(ph[0].includes('ADAPTASYON')||ph[0].includes('GENEL')){if(base==='Speed Endurance')return event==='50/100'?'Saf Hız':'Aerobik Güç / END3';if(base==='Race Pace')return event==='50/100'?'Saf Hız':'Threshold / END2'}return base}function sessionOptions(){let d=new Date($('date').value+'T12:00:00'),day=DAYS[d.getDay()],keys=WEEK[day]?Object.keys(WEEK[day]):[];$('session').innerHTML=keys.length?keys.map(x=>'<option>'+x+'</option>').join(''):'<option>OFF</option>'}function target(a,c,event,goal){if(!a)return'PB/test gerekli';if(goal==='Threshold / END2'){let v=css(a,c);return v?fmt(100/v)+'/100m':'200+400 PB/CSS testi gerekli'}let dist=event==='50/100'?100:event==='100/200'?200:event==='200/400'?200:event==='400/800'?400:800,t=pb(a,c,dist);if(goal==='Race Pace'&&t)return'50 split ≈ '+fmt(t/(dist/50));if(goal==='Saf Hız'){let p50=pb(a,c,50);return p50?'25 hedef ≈ '+fmt(p50/2*0.98)+' veya kısa test':'25/50 sprint testi gerekli'}return'kişisel test + RPE + teknik'}function setPack(event,goal,stroke,dev,seed){let S=STROKE[stroke];if(dev==='A')return{main:'Beceri Odaklı Gelişim',items:[['12×50',S.tech,'20sn',600],['8×25','kontrollü hızlı, teknik temiz','40sn',200],['8×50','4 farklı stil / beceri oyunu','20sn',400]],rpe:'3–5',tol:'süre değil teknik kalite',stop:'teknik bozulursa görevi sadeleştir'};let variants={};variants['Aerobik Ekonomi']=[[['3×800','A2 negatif split; stroke count sabit','25sn',2400],['8×100','pull/swim economy','15sn',800]],[['4×600','100 A2/100 A3 over-under','20sn',2400],['10×100','DPS + tempo kontrol','15sn',1000]],[['200-300-400-500-400-300-200','aerobik ladder','20sn',2300],['8×150','pull/swim alternation','20sn',1200]]];variants['Threshold / END2']=[[['3×(4×200)','END2; blok sonu 200 A1','20sn; blok 2dk',2400],['6×300','threshold teknik sabit','25sn',1800]],[['2×(100-200-300-400-300-200-100)','threshold ladder','15–30sn',3200],['8×100','CSS çevresi kalite','15sn',800]],[['4×(4×100)','over-under CSS: +2/CSS/-1/A2','15sn; blok 90sn',1600],['4×400','negatif split threshold','30sn',1600]]];variants['Aerobik Güç / END3']=[[['4×(4×150)','END3; blok sonrası 200 easy','30sn; blok 3dk',2400],['8×100','A3→END3 descend','20sn',800]],[['5×(5×100)','END3 kalite sabit','25sn; blok 3dk',2500],['6×200','A3 güçlü son 50 END3','25sn',1200]],[['4×(3×200)','broken 600 aerobic power','30sn; blok 3dk',2400],['8×50','fast technique','30sn',400]]];variants['Race Pace']=[[['4×(4×50)','RP split kalite','20–30sn; blok 2–3dk',800],['8×100','A1 reset + perfect turn','20sn',800]],[['4×(4×100)','400/200 RP cluster','20–30sn; blok 3dk',1600],['8×50','RP finish','45sn',400]],[['4×400','100 control / 100 RP pace-change','45sn',1600],['8×50',S.skill,'45sn',400]]];variants['Saf Hız']=[[['4×(6×25)','maksimum kalite','90–120sn; blok 4dk',600],['8×50','A1 recovery','30sn',400]],[['4×(8×15m)','max speed + easy finish','tam dinlenme',480],['8×50',S.skill,'45sn',400]],[['5×(4×25)','1 build + 3 max','90sn; blok 4dk',500],['10×50','easy technique','30sn',500]]];variants['Speed Endurance']=[[['4×(3×75)','yüksek kalite / hız dayanıklılığı','90sn; blok 5dk',900],['8×50','A1 recovery','30sn',400]],[['4×(2×100)','race-finish quality','3dk; blok 5dk',800],['8×50','loosen','30sn',400]],[['5×(3×50)','yüksek laktat toleransı, teknik korunur','90sn; blok 4dk',750],['10×50','A1 reset','30sn',500]]];variants['Recovery / Teknik']=[[['12×100','A1 mixed / drill by 25','15sn',1200],['8×50',S.tech,'20sn',400]],[['6×200','A1/A2 easy economy','15sn',1200],['12×50','drill/scull/streamline','20sn',600]]];let arr=variants[goal]||variants['Aerobik Ekonomi'],pick=arr[Math.abs(seed)%arr.length];if(event==='50/100'&&(goal==='Threshold / END2'||goal==='Aerobik Güç / END3'))pick=pick.map(x=>[x[0],x[1]+' • sprint profilinde toplam kalite hacmi koçça azaltılabilir',x[2],Math.round(x[3]*.72/50)*50]);if(event==='800/1500'&&(goal==='Aerobik Ekonomi'||goal==='Threshold / END2'))pick=pick.map(x=>[x[0],x[1],x[2],Math.round(x[3]*1.18/50)*50]);return{main:goal,items:pick,rpe:goal==='Saf Hız'||goal==='Speed Endurance'?'8–9':goal==='Race Pace'?'7–9':goal==='Recovery / Teknik'?'2–4':'5–7',tol:goal==='Race Pace'?'±1.5–2%':goal==='Threshold / END2'?'±2%':'teknik + pace birlikte',stop:'2 ardışık tekrarda >%3 kalite kaybı veya belirgin teknik bozulma → dinlenme artır / seti kısalt'}}function support(event,goal,stroke,dev){let S=STROKE[stroke],sprint=event==='50/100'||event==='100/200',long=event==='400/800'||event==='800/1500';if(dev==='A')return{warm:[['400','easy mixed + koordinasyon','—',400]],tech:[['8×50',S.tech,'20sn',400]],kp:[['8×50','kick/pull teknik dönüşümlü','20sn',400]],pre:[['8×25','build teknik temiz','30sn',200]],sec:[['8×50','çoklu stil / beceri','20sn',400]],skills:[['8×15m',S.skill,'tam dinlenme',120]],cool:[['200','easy mixed','—',200]]};return{warm:sprint?[['400','A1 mixed','—',400],['4×100','50 kick + 50 build','15sn',400]]:long?[['600','A1 mixed','—',600],['6×100','build 1–3 / 4–6','15sn',600]]:[['500','A1 mixed','—',500],['5×100','progressive build','15sn',500]],tech:[['8×50',S.tech,'15–20sn',400],['4×50','streamline/breakout quality','30sn',200]],kp:sprint?[['8×50','power kick','30sn',400],['6×50','pull technique','20sn',300]]:long?[['8×100','pull A2 DPS sabit','15sn',800],['8×50','kick A2 build','20sn',400]]:[['6×100','pull A2/A3','20sn',600],['8×50','kick build','20sn',400]],pre:goal==='Race Pace'?[['8×50','easy/build/RP feel/easy ×2','20sn',400]]:goal==='Saf Hız'?[['6×25','build to fast','45sn',150]]:[['6×100','A2→A3 progressive','20sn',600]],sec:sprint?[['8×50','easy-fast by 25','30sn',400]]:long?[['6×200','A2 negative split','20sn',1200]]:[['6×150','A2/A3 controlled','20sn',900]],skills:sprint?[['6×15m','start + breakout ölçümü','tam dinlenme',90],['6×25',S.skill,'60sn',150]]:long?[['8×50',S.skill,'30sn',400],['4×100','race finish son 25 build','30sn',400]]:[['8×50',S.skill,'40sn',400]],cool:[['300','A1 easy mixed','—',300],['4×50','uzun kulaç + nefes normalizasyonu','15sn',200]]}}function meters(a){return a.reduce((s,x)=>s+x[3],0)}function card(title,a){return'<div class="card"><div class="head">'+title+' <span class="meter">'+meters(a)+' m</span></div>'+a.map(x=>'<div class="set"><b>'+x[0]+'</b> • '+x[1]+'<br><span class="muted">Dinlenme: '+x[2]+' • '+x[3]+' m</span></div>').join('')+'</div>'}function weeklyPreview(ph,event,dev){let days=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];return'<div class="card"><div class="head">HAFTALIK MİKRO DÖNGÜ</div><div class="week">'+days.map(day=>{if(day==='Pazartesi')return'<div class="day"><b>'+day+'</b><div class="mini">OFF • mobilite / uyku / toparlanma</div></div>';let w=WEEK[day],txt=Object.keys(w||{}).map(k=>k+': '+adaptGoal(w[k],ph,event)).join('<br>');return'<div class="day"><b>'+day+'</b><div class="mini">'+txt+'</div></div>'}).join('')+'</div></div>'}function render(){let d=new Date($('date').value+'T12:00:00'),day=DAYS[d.getDay()],ph=phase(d),mi=micro(d),event=$('event').value,stroke=$('stroke').value,dev=$('dev').value,c=$('course').value,a=athletes().find(x=>x.name===$('ath').value),sess=$('session').value;if(day==='Pazartesi'||sess==='OFF'){$('out').innerHTML=weeklyPreview(ph,event,dev)+'<div class="why">Pazartesi OFF. V17 bu günü otomatik toparlanma günü olarak kilitler.</div>';return}let base=WEEK[day]&&WEEK[day][sess]||'Aerobik Ekonomi',goal=$('override').value==='auto'?adaptGoal(base,ph,event):$('override').value,seed=d.getDate()+d.getMonth()*31+mi.week*11+event.length+stroke.length,S=support(event,goal,stroke,dev),M=setPack(event,goal,stroke,dev,seed),mainM=meters(M.items),raw=meters(S.warm)+meters(S.tech)+meters(S.kp)+meters(S.pre)+mainM+meters(S.sec)+meters(S.skills)+meters(S.cool),target=Math.round(EVENT[event].base*ph[2]*mi.factor/100)*100,load=JSON.parse(localStorage.getItem('v17Load')||'{"rpe":0,"pace":0,"tech":"Temiz"}'),flag=(load.rpe>=8&&load.pace<=-3)||load.tech==='Bozuldu'?'DİKKAT / RECOVERY':'NORMAL';$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+ph[0]+'</b>FAZ</div><div class="kpi"><b>H'+mi.week+'</b>'+mi.wave+'</div><div class="kpi"><b>'+goal+'</b>AMAÇ</div><div class="kpi"><b>'+raw+' m</b>GERÇEK TOPLAM</div><div class="kpi"><b>'+flag+'</b>READINESS</div></div>'+weeklyPreview(ph,event,dev)+'<div class="card"><div class="head">SESSION INTELLIGENCE</div><span class="tag">'+day+' '+sess+'</span><span class="tag">'+event+'</span><span class="tag">'+stroke+'</span><span class="tag">Grup '+dev+'</span><span class="tag">'+c+'m</span><span class="tag">Sezon hedef hacim referansı: '+target+'m</span><div class="why">Motor seti rastgele seçmez: tarih/faz + mikro dalga + event profili + branş + gelişim grubu + seans amacı birlikte set ailesini belirler. Hedef hacim referanstır; gerçek toplam kartlardaki matematiksel metredir.</div></div>'+card('1 • ISINMA',S.warm)+card('2 • TEKNİK / MOTOR KALİTE',S.tech)+card('3 • KICK / PULL',S.kp)+card('4 • PRE-SET',S.pre)+'<div class="card"><div class="head">5 • MAIN SET • '+M.main+' <span class="meter">'+mainM+' m</span></div>'+M.items.map(x=>'<div class="set"><b>'+x[0]+'</b> • '+x[1]+'<br><span class="muted">Dinlenme: '+x[2]+' • '+x[3]+' m</span></div>').join('')+'<div class="set">Kişisel hedef: <b>'+targetText(a,c,event,goal)+'</b></div><div class="set">RPE: <b>'+M.rpe+'</b> • Tolerans: <b>'+M.tol+'</b></div><div class="set">Durdur/değiştir: <b>'+M.stop+'</b></div><div class="why"><b>KOÇA NEDEN?</b> '+why(goal,event,stroke,ph[0])+'</div></div>'+card('6 • SECONDARY SET',S.sec)+card('7 • RACE SKILLS',S.skills)+card('8 • COOLDOWN',S.cool)+'<div class="card"><div class="head">PLAN → ACTUAL / ADAPTASYON</div><div class="grid"><div class="box"><label>RPE</label><input id="rpe" type="number" min="1" max="10" value="'+(load.rpe||'')+'"></div><div class="box"><label>PACE SAPMASI %</label><input id="pace" type="number" step="0.1" value="'+(load.pace||'')+'"></div><div class="box"><label>TEKNİK</label><select id="tech"><option '+(load.tech==='Temiz'?'selected':'')+'>Temiz</option><option '+(load.tech==='Bozuldu'?'selected':'')+'>Bozuldu</option></select></div><div class="box"><label>NOT</label><input id="note" value="'+(load.note||'')+'"></div></div><button id="save" style="width:100%;padding:10px;margin-top:8px;font-weight:900">GERİ BİLDİRİMİ KAYDET</button><div class="why warn">V17 otomatik tıbbi/sakatlık kararı vermez. Yük, RPE, pace ve teknik sinyalleri koç kararını destekler.</div></div>';$('save').onclick=function(){localStorage.setItem('v17Load',JSON.stringify({rpe:+$('rpe').value||0,pace:+$('pace').value||0,tech:$('tech').value,note:$('note').value,date:$('date').value}));render()}}function targetText(a,c,event,goal){return target(a,c,event,goal)}function why(goal,event,stroke,phaseName){let m={'Aerobik Ekonomi':'Aerobik ekonomi ve teknik sürdürülebilirlik.','Threshold / END2':'Sürdürülebilir yüksek aerobik hız ve pace kontrolü.','Aerobik Güç / END3':'Eşik üstü aerobik güç; teknik bozulmadan kalite.','Race Pace':'Hedef yarış splitlerini, dönüş ve finish davranışını yarışa aktarmak.','Saf Hız':'Maksimum nöromüsküler hız; tam toparlanma ile kalite.','Speed Endurance':'Maksimum hızı yarış boyunca koruma kapasitesi.','Recovery / Teknik':'Yorgunluk azaltılırken teknik kalite ve su hissini korumak.'};return m[goal]+' • '+event+' • '+stroke+' • '+phaseName}let A=athletes();$('ath').innerHTML='<option value="">Sporcu seç</option>'+A.map(x=>'<option>'+x.name+'</option>').join('');['date','event','stroke','dev','course'].forEach(id=>$(id).onchange=function(){if(id==='date')sessionOptions();render()});$('session').onchange=render;$('override').onchange=render;sessionOptions();render()})();</script></body></html>
