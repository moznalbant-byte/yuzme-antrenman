<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V17 Test Takvimi</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1100px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}input,select{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;color:#fde68a;font-size:16px}.item{border-top:1px solid #294058;padding:10px 0;line-height:1.45}.tag{display:inline-block;background:#17283b;border-radius:8px;padding:4px 7px;margin:2px;font-size:11px}.ok{border-left:3px solid #22c55e;background:#0b1625;padding:10px}.warn{border-left:3px solid #facc15;background:#0b1625;padding:10px}.bad{border-left:3px solid #ef4444;background:#0b1625;padding:10px}.nav a{display:inline-block;color:#fff;text-decoration:none;background:#17283b;padding:8px 10px;border-radius:8px;margin:3px}.test{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;border-top:1px solid #294058;padding:10px 0}.test b{color:#fde68a}.pri{font-weight:900}.p1{color:#86efac}.p2{color:#fde68a}.p3{color:#cbd5e1}@media(max-width:700px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.test{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V17 PERIODİZE TEST TAKVİMİ</b><div class="muted">Tarih + faz + profil + gelişim grubuna göre “şimdi neyi ölçmeliyim?” motoru.</div><div class="nav"><a href="v17-season-engine.html">Season Engine</a><a href="v17-test-guide.html">Test Nasıl Yapılır?</a></div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date" value="2026-09-22"></div><div class="box"><label>EVENT PROFİLİ</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>GELİŞİM</label><select id="dev"><option value="A">A • erken gelişim</option><option value="B">B • gelişim / PHV çevresi</option><option value="C" selected>C • yüksek performans</option></select></div></div><div id="out"></div></div><script>(function(){const $=x=>document.getElementById(x);function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON','Başlangıç ölçümleri'];if(m===10)return['GENEL HAZIRLIK','Kapasite takibi'];if(m===11)return['ÖZEL HAZIRLIK','Pace / güç doğrulama'];if(m===12&&n<8)return['RACE SPECIFIC I','Yarış modeli'];if(m===12&&n<15)return['TAPER I','Minimum test, kalite kontrol'];if(m===12)return['PEAK I / TRANSITION','Yarış sonucu + toparlanma'];if(m===1)return['REBUILD','Yeniden baseline'];if(m===2)return['GENEL HAZIRLIK II','Kapasite takibi'];if(m===3)return['ÖZEL HAZIRLIK II','Pace / güç doğrulama'];if(m===4)return['RACE SPECIFIC II','Yarış modeli'];if(m===5&&n<5)return['TAPER II','Minimum test, kalite kontrol'];if(m===5&&n<16)return['PEAK II','Ana yarış'];if(m===5)return['TRANSITION','Toparlanma'];if(m===6)return['GEÇİŞ','Teknik / gelişim ölçümleri'];if(m===7)return['GELİŞİM','Teknik + hız gelişimi'];return['PRE-SEASON','Yeni sezon baseline']}function week(d){let s=new Date(2026,8,21,12),w=Math.floor((d-s)/604800000);return w+1}function test(name,why,when,priority,link){return{name,why,when,priority,link}}function testsFor(ph,event,dev,w){let a=[],isSprint=event==='50/100'||event==='100/200',isDist=event==='400/800'||event==='800/1500',deload=((w-1)%4+4)%4===3;if(dev==='A'){a.push(test('Teknik video + stroke count','Beceri gelişimini izlemek için','4–6 haftada bir; tercihen deload haftası','1','#tech'));a.push(test('15m / 25m kontrollü hız','Hız becerisini yorgunluk yaratmadan izlemek için','4–6 haftada bir','2','#speed'));a.push(test('Boy / gelişim takibi','Büyüme hızındaki değişimi temkin sinyali olarak görmek için','6–8 haftada bir','2','#growth'));return a}if(ph[0]==='ADAPTASYON'||ph[0]==='PRE-SEASON'||ph[0]==='REBUILD'){if(isSprint)a.push(test('15m / 25m / 50m sprint baseline','SPR2/SPR3 ve kısa hız referansını kurmak için','Fazın ilk 7–10 günü','1','#speed'));else a.push(test('CSS 200+400 baseline','END2 / threshold referansını kurmak için','Fazın ilk 7–10 günü','1','#css'));a.push(test('8×50 efficiency','Teknik verim, stroke count/rate baseline','İlk 2 hafta','1','#eff'));a.push(test('Start / turn / breakout video','Yarış becerisi baseline','İlk 2 hafta','2','#skills'));a.push(test('Boy + dinlenik nabız + wellness','Gelişim ve toparlanma baseline','Faz başlangıcı','2','#growth'));return a}if(ph[0].includes('GENEL HAZIRLIK')){if(!isSprint)a.push(test('CSS veya 7×200 step','Aerobik kapasite ve threshold trendini kontrol','4–6 hafta arayla; deload haftası ideal','1','#css'));if(isSprint)a.push(test('15m / 25m sprint','Saf hızın korunup geliştiğini görmek','4–6 hafta arayla','1','#speed'));a.push(test('8×50 efficiency','Hız artarken tekniğin bozulup bozulmadığını görmek','4–6 hafta arayla','2','#eff'));a.push(test('Wellness + RPE trendi','Yük toleransını izlemek','Her gün / her seans','1','#recovery'));return a}if(ph[0].includes('ÖZEL HAZIRLIK')){if(isSprint){a.push(test('Sprint test + speed endurance doğrulama','Maks hız ve hız dayanıklılığını ayrı görmek','Fazın 2.–3. haftası','1','#speed'));a.push(test('Race-pace broken test','100/200 yarış hızını doğrulamak','Faz ortası veya sonu','1','#race'))}else{a.push(test('CSS / 7×200 step','Threshold gelişimini doğrulamak','Fazın 2.–3. haftası','1','#css'));a.push(test('Race-pace test','Aerobik gelişimin yarış temposuna transferini görmek','Faz sonuna doğru','1','#race'))}a.push(test('Start-turn-breakout ölçümü','Yarış becerisini teknik olarak doğrulamak','4–6 haftada bir','2','#skills'));return a}if(ph[0].includes('RACE SPECIFIC')){a.push(test('Race Model Test','Hedef split, dönüş ve finish modelini doğrulamak','Ana yarıştan yaklaşık 2–4 hafta önce','1','#race'));a.push(test('Kısa speed check','Nöromüsküler hız kaybı var mı görmek','Ana yarıştan 10–21 gün önce; düşük hacim','2','#speed'));a.push(test('8×50 efficiency azaltılmış versiyon','Teknik kaliteyi yormadan kontrol etmek','Faz içinde 1 kez','2','#eff'));return a}if(ph[0].includes('TAPER')){a.push(test('Kısa kalite kontrol','Hız/teknik hazır mı görmek; fitness testi yapmak değil','Yarıştan 5–10 gün önce, çok düşük hacim','1','#speed'));a.push(test('Start / breakout / turn check','Yarış becerilerinin keskinliğini kontrol','Yarıştan 3–7 gün önce, az tekrar','1','#skills'));a.push(test('Wellness + RPE','Taper yanıtını takip etmek','Her gün','1','#recovery'));return a}if(ph[0].includes('PEAK')){a.push(test('Yarış verisi kaydı','En geçerli performans testi yarışın kendisidir','Her ana yarış','1','#race'));a.push(test('Split + start + turn analizi','Bir sonraki makrosiklusun eksiklerini çıkarmak','Yarış sonrası 24–72 saat içinde analiz','1','#skills'));return a}if(ph[0].includes('TRANSITION')||ph[0]==='GEÇİŞ'){a.push(test('Wellness / toparlanma','Yorgunluğun çözülmesini izlemek','Haftalık','1','#recovery'));a.push(test('Teknik video','Düşük stresli dönemde teknik eksikleri görmek','Geçişin 2. yarısı','2','#tech'));a.push(test('Boy / gelişim ölçümü','Yeni blok öncesi gelişim verisini güncellemek','6–8 hafta dolduysa','2','#growth'));return a}a.push(test('Teknik + hız baseline','Yeni blok için referans oluşturmak','Faz başlangıcı','1','#tech'));return a}function render(){let d=new Date($('date').value+'T12:00:00'),ph=phase(d),w=week(d),event=$('event').value,dev=$('dev').value,arr=testsFor(ph,event,dev,w),deload=((w-1)%4+4)%4===3;$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+ph[0]+'</b>FAZ</div><div class="kpi"><b>H'+w+'</b>HAFTA</div><div class="kpi"><b>'+(deload?'DELOAD':'BUILD')+'</b>MİKRO</div><div class="kpi"><b>'+arr.length+'</b>ÖNERİ</div></div><div class="card"><div class="'+(deload?'ok':'warn')+'"><b>Bu hafta ölçüm mantığı:</b> '+(deload?'Deload haftası; karşılaştırmalı test için uygun pencere.':'Build haftası; ağır test gerekiyorsa haftanın ana kalite seanslarıyla çakıştırma. Teknik ve wellness ölçümleri yapılabilir.')+'</div></div><div class="card"><h3>Şimdi neyi ölçmeliyim?</h3>'+arr.map(t=>'<div class="test"><div><b>'+t.name+'</b><br><span class="muted">'+t.why+'</span></div><div><span class="pri p'+t.priority+'">Öncelik '+t.priority+'</span><br>'+t.when+'</div><div><a style="color:#fff" href="v17-test-guide.html'+t.link+'">Nasıl Ölçerim? →</a></div></div>').join('')+'</div><div class="card"><div class="bad"><b>Önemli:</b> Taper ve peak dönemlerinde tam kapasite testleriyle yorgunluk yaratma. O dönemde amaç fitness ölçmek değil, yarış kalitesi ve teknik keskinliği doğrulamaktır.</div></div>'}['date','event','dev'].forEach(x=>$(x).onchange=render);render()})();</script></body></html>
