<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V17 Test Sonuç Girişi</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1100px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input,textarea{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}textarea{min-height:80px}.btn{display:inline-block;width:100%;padding:11px;border:0;border-radius:10px;background:#f97316;color:#fff;font-weight:900;margin-top:8px}.nav a{display:inline-block;color:#fff;text-decoration:none;background:#17283b;padding:8px 10px;border-radius:8px;margin:3px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;color:#fde68a;font-size:17px}.row{border-top:1px solid #294058;padding:10px 0;line-height:1.45}.row b{color:#fde68a}.ok{border-left:3px solid #22c55e;background:#0b1625;padding:10px}.warn{border-left:3px solid #facc15;background:#0b1625;padding:10px}.bad{border-left:3px solid #ef4444;background:#0b1625;padding:10px}.tag{display:inline-block;background:#17283b;border-radius:8px;padding:4px 7px;margin:2px;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V17 TEST SONUÇ GİRİŞİ</b><div class="muted">Testi seç → sonucu gir → sistem türetilmiş metrikleri hesaplasın → sporcu geçmişine kaydetsin.</div><div class="nav"><a href="v17-coach-dashboard.html">Coach Dashboard</a><a href="v17-test-calendar.html">Test Takvimi</a><a href="v17-test-guide.html">Nasıl Ölçerim?</a><a href="v17-season-engine.html">Season Engine</a></div></div><div class="grid"><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>TEST</label><select id="test"><option value="css">CSS 200+400</option><option value="sprint">15/25/50 Sprint</option><option value="eff">8×50 Efficiency</option><option value="skills">Start / Turn / Breakout</option><option value="wellness">RPE / Wellness</option><option value="growth">Boy / Gelişim</option></select></div><div class="box"><label>TARİH</label><input id="date" type="date"></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50">50m LCM</option></select></div><div class="box"><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div><div class="box"><label>KOÇ NOTU</label><input id="note" placeholder="örn. iyi toparlanmış, teknik temiz"></div></div><div id="fields" class="card"></div><button id="save" class="btn">TESTİ KAYDET VE HESAPLA</button><div id="summary"></div><div class="card"><b>SON TESTLER</b><div id="history"></div></div></div><script>(function(){const $=x=>document.getElementById(x);$('date').value=new Date().toISOString().slice(0,10);function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function tests(){try{return JSON.parse(localStorage.getItem('v17Tests')||'[]')}catch(e){return[]}}function saveTests(x){localStorage.setItem('v17Tests',JSON.stringify(x))}function sec(v){if(v===null||v===undefined||v==='')return null;v=(''+v).replace(',','.').trim();if(v.includes(':')){let a=v.split(':');return +a[0]*60+ +a[1]}let n=+v;return isFinite(n)?n:null}function fmt(s){if(s===null||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}function f(label,id,ph){return'<div class="box"><label>'+label+'</label><input id="'+id+'" placeholder="'+(ph||'')+'"></div>'}function fields(){let t=$('test').value,h='';if(t==='css')h='<b>CSS 200+400</b><div class="grid">'+f('200m süre','v200','örn. 2:14.50')+f('400m süre','v400','örn. 4:38.20')+f('200 RPE','r200','1-10')+f('400 RPE','r400','1-10')+'</div><div class="warn">Aynı havuz uzunluğu ve benzer test protokolüyle karşılaştır.</div>';if(t==='sprint')h='<b>SPRINT</b><div class="grid">'+f('15m','v15','sn')+f('25m','v25','sn')+f('50m','v50','sn')+f('Breakout mesafesi','bo','m')+f('50m stroke count','sc','çevrim')+f('RPE','rpe','1-10')+'</div>';if(t==='eff')h='<b>8×50 EFFICIENCY</b><div class="grid">'+f('Ortalama 50 süre','avg50','sn')+f('En iyi 50','best50','sn')+f('Ortalama stroke count','avgsc','çevrim')+f('Stroke rate','sr','çevrim/dk')+f('Teknik bozulma tekrarı','breakrep','örn. 6')+f('RPE','rpe','1-10')+'</div>';if(t==='skills')h='<b>START / TURN / BREAKOUT</b><div class="grid">'+f('Start 15m','start15','sn')+f('Breakout','bo','m')+f('5m turn-in','tin','sn')+f('5m turn-out','tout','sn')+f('Finish 5m','finish','sn')+f('Video notu','video','dosya/link notu')+'</div>';if(t==='wellness')h='<b>RPE / WELLNESS</b><div class="grid">'+f('Seans RPE','rpe','1-10')+f('Uyku','sleep','1-5')+f('Kas ağrısı','sore','1-5')+f('Stres','stress','1-5')+f('Enerji/iştah','energy','1-5')+f('Dinlenik nabız','rhr','bpm')+'</div>';if(t==='growth')h='<b>BOY / GELİŞİM</b><div class="grid">'+f('Boy','height','cm')+f('Kilo','weight','kg')+'</div><div class="warn">Bu alan klinik biyolojik yaş tayini değildir; yalnız gelişim trendi için kullanılır.</div>';$('fields').innerHTML=h}function derive(rec){let d={};if(rec.type==='css'){let a=sec(rec.data.v200),b=sec(rec.data.v400);if(a&&b&&b>a){let speed=200/(b-a);d.cssSpeed=speed;d.css100=100/speed;d.css200=200/speed}}if(rec.type==='sprint'){let p15=sec(rec.data.v15),p25=sec(rec.data.v25),p50=sec(rec.data.v50);if(p15)d.v15=15/p15;if(p25)d.v25=25/p25;if(p50)d.v50=50/p50;if(p25)d.spr3_25=[p25/0.98,p25/0.95];if(p50)d.rp100_50=p50}if(rec.type==='eff'){let t=sec(rec.data.avg50),sc=+rec.data.avgsc;if(t&&sc)d.distancePerStroke=50/sc}if(rec.type==='skills'){let a=sec(rec.data.start15);if(a)d.startSpeed15=15/a}if(rec.type==='wellness'){let r=+rec.data.rpe||0,s=+rec.data.sleep||0,so=+rec.data.sore||0,st=+rec.data.stress||0,en=+rec.data.energy||0;d.readiness=(s*2+en*2+(6-so)*2+(6-st)*2+(11-r))/9}return d}function collect(){let data={};$('fields').querySelectorAll('input').forEach(i=>data[i.id]=i.value);return data}function latestFor(name,type){return tests().filter(x=>x.athlete===name&&x.type===type).sort((a,b)=>b.date.localeCompare(a.date))[0]}function summary(rec){let d=rec.derived||{},html='<div class="card"><b>HESAPLANAN SONUÇ</b>';if(rec.type==='css')html+='<div class="kpis"><div class="kpi"><b>'+fmt(d.css100)+'</b>CSS /100</div><div class="kpi"><b>'+fmt(d.css200)+'</b>CSS /200</div><div class="kpi"><b>'+(d.cssSpeed?d.cssSpeed.toFixed(3):'—')+' m/s</b>CSS HIZ</div><div class="kpi"><b>'+rec.course+'m</b>HAVUZ</div></div><div class="ok">Bu değer END2/threshold referansı olarak kullanılabilir; sprint için ana tempo kaynağı değildir.</div>';if(rec.type==='sprint')html+='<div class="kpis"><div class="kpi"><b>'+(d.v15?d.v15.toFixed(2):'—')+'</b>15m m/s</div><div class="kpi"><b>'+(d.v25?d.v25.toFixed(2):'—')+'</b>25m m/s</div><div class="kpi"><b>'+(d.v50?d.v50.toFixed(2):'—')+'</b>50m m/s</div><div class="kpi"><b>'+fmt(sec(rec.data.v50))+'</b>50m</div></div><div class="ok">Sprint hedefleri CSS’den değil kısa hız verisinden kalibre edilmeli.</div>';if(rec.type==='eff')html+='<div class="kpis"><div class="kpi"><b>'+fmt(sec(rec.data.avg50))+'</b>ORT 50</div><div class="kpi"><b>'+(d.distancePerStroke?d.distancePerStroke.toFixed(2):'—')+'m</b>DPS</div><div class="kpi"><b>'+(rec.data.sr||'—')+'</b>SR</div><div class="kpi"><b>'+(rec.data.avgsc||'—')+'</b>SC</div></div>';if(rec.type==='wellness')html+='<div class="kpis"><div class="kpi"><b>'+(d.readiness?d.readiness.toFixed(1):'—')+'</b>READINESS</div><div class="kpi"><b>'+(rec.data.rpe||'—')+'</b>RPE</div><div class="kpi"><b>'+(rec.data.sleep||'—')+'</b>UYKU</div><div class="kpi"><b>'+(rec.data.rhr||'—')+'</b>RHR</div></div>';html+='</div>';$('summary').innerHTML=html}function history(){let name=$('ath').value,arr=tests().filter(x=>!name||x.athlete===name).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);$('history').innerHTML=arr.length?arr.map(x=>'<div class="row"><b>'+x.date+' • '+x.athlete+' • '+x.type.toUpperCase()+'</b><br><span class="tag">'+x.course+'m</span><span class="tag">'+x.stroke+'</span> '+(x.note||'')+'</div>').join(''):'<div class="row muted">Henüz test kaydı yok.</div>'}function refreshAth(){let a=athletes();$('ath').innerHTML='<option value="">Sporcu seç</option>'+a.map(x=>'<option>'+x.name+'</option>').join('')}$('save').onclick=function(){let name=$('ath').value;if(!name){alert('Önce sporcu seç');return}let rec={id:Date.now(),athlete:name,type:$('test').value,date:$('date').value,course:$('course').value,stroke:$('stroke').value,note:$('note').value,data:collect()};rec.derived=derive(rec);let arr=tests();arr.push(rec);saveTests(arr);summary(rec);history()};$('test').onchange=fields;$('ath').onchange=history;refreshAth();fields();history()})();</script></body></html>
