<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V18 Sporcu Dosyası</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1200px;margin:auto}.card{background:#101d2d;border:1px solid #294058;border-radius:16px;padding:15px;margin-bottom:12px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{background:#0b1625;border-radius:11px;padding:11px}.k b{color:#fde68a}.tag{display:inline-block;background:#17283b;border-radius:7px;padding:5px 7px;font-size:11px;margin:2px}.btn,a.btn{display:inline-block;border:0;border-radius:10px;padding:10px 12px;background:#f97316;color:#fff;text-decoration:none;font-weight:900;cursor:pointer;margin:2px}.btn.alt{background:#17283b}.row{padding:9px 0;border-top:1px solid #294058}.ok{color:#86efac}.warn{color:#fbbf24}select{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:800}@media(max-width:700px){.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:460px){.grid,.two{grid-template-columns:1fr}.btn,a.btn{width:100%;text-align:center}}</style></head><body><div class="w"><div class="card"><b><span class="orange">KUMSAL SPOR</span> • SPORCU DOSYASI</b><div class="muted">Tek sporcunun profil, performans, test ve antrenman karar merkezi.</div><p><a class="btn alt" href="v18-athletes.html">← Sporcular</a><a class="btn alt" href="v18-mobile.html">📱 Mobil</a></p></div><div class="card"><label>SPORCU</label><select id="ath"></select></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>const $=x=>document.getElementById(x);function q(){return new URLSearchParams(location.search).get('ath')}function render(){let a=KSData.athlete($('ath').value);if(!a)return;let c=String(a.course||'50'),css=KSData.css(a.name,c),well=KSData.latest(a.name,'wellness'),tests=KSData.tests().filter(x=>x.athlete===a.name),pbs=[];['Serbest','Sırtüstü','Kurbağalama','Kelebek','Bireysel Karışık'].forEach(s=>[50,100,200,400,800,1500].forEach(d=>{let p=KSData.pb(a.name,s,c,d);if(p)pbs.push({s,d,p})}));let ready=well&&well.derived?well.derived.readiness:null;$('out').innerHTML='<div class="grid"><div class="k"><span class="muted">BRANŞ</span><br><b>'+(a.stroke||'—')+'</b></div><div class="k"><span class="muted">MESAFE PROFİLİ</span><br><b>'+(a.event||'—')+'</b></div><div class="k"><span class="muted">GELİŞİM</span><br><b>'+(a.group?'Grup '+a.group:'—')+'</b></div><div class="k"><span class="muted">HAVUZ</span><br><b>'+c+'m</b></div></div><div class="two"><div class="card"><h3>Bugünkü karar</h3><div class="row"><b>Antrenmana hazırlık:</b> '+(ready!=null?Number(ready).toFixed(1):'veri yok')+'</div><div class="row"><b>CSS:</b> '+(css?KSData.fmt(css.sec100)+'/100m':'eksik')+'</div><div class="row"><b>Test kaydı:</b> '+tests.length+'</div><p><a class="btn" href="v18-season-engine.html">Kişisel Antrenmanı Aç</a><a class="btn alt" href="v18-group-training.html">Grup Antrenmanına Ata</a></p></div><div class="card"><h3>PB / Performans</h3>'+(pbs.length?pbs.slice(0,12).map(x=>'<div class="row"><b>'+x.s+' '+x.d+'m</b> • '+KSData.fmt(x.p.time)+' <span class="tag">'+(x.p.verified?'doğrulanmış':'havuz belirsiz')+'</span></div>').join(''):'<div class="warn">PB verisi yok.</div>')+'</div></div><div class="two"><div class="card"><h3>Test ve ölçümler</h3>'+(tests.length?tests.slice(-8).reverse().map(t=>'<div class="row"><b>'+t.type+'</b> • '+(t.date||'tarih yok')+'</div>').join(''):'<div class="warn">Henüz test kaydı yok.</div>')+'<p><a class="btn alt" href="v17-test-entry.html">Test / Ölçüm Gir</a></p></div><div class="card"><h3>Antrenör notu</h3><div class="row">'+(a.notes||'Henüz not girilmedi.')+'</div><div class="row"><span class="muted">Kişisel çalışma zorunlu değildir. Sporcu uygun gelişim/branş grubuyla ortak set yapabilir; gerektiğinde tempo, tekrar veya dinlenme kişiye göre ayrıştırılır.</span></div></div></div>'}function init(){let r=KSData.roster();$('ath').innerHTML=r.map(a=>'<option>'+a.name+'</option>').join('');if(q()&&r.some(a=>a.name===q()))$('ath').value=q();$('ath').onchange=render;render()}init();</script></body></html>
