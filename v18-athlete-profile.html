<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V18 Sporcu Dosyası</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1180px;margin:auto}.card{background:#101d2d;border:1px solid #294058;border-radius:16px;padding:15px;margin-bottom:12px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.k{background:#0b1625;border-radius:11px;padding:11px}.k b{display:block;color:#fde68a}.tag{display:inline-block;background:#17283b;padding:5px 8px;border-radius:8px;font-size:11px;margin:2px}.btn,a.btn{display:inline-block;border:0;background:#f97316;color:#fff;text-decoration:none;font-weight:900;padding:10px 12px;border-radius:10px;margin:3px}.secondary{background:#17283b!important}.row{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.test{padding:8px 0;border-top:1px solid #294058}.mode{padding:12px;border-radius:12px;background:#0b1625;margin-top:8px}.mode b{color:#fde68a}select{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:800}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="card"><b><span class="orange">KUMSAL SPOR</span> • SPORCU DOSYASI</b><div class="muted">Tek sporcuya ait profil, performans verisi, test durumu ve antrenman modu tek ekranda.</div><p><a class="btn secondary" href="v18-athletes.html">← Sporcular</a><a class="btn secondary" href="v18-mobile.html">📱 Mobil</a></p></div><div class="card"><label class="muted">SPORCU</label><select id="ath"></select></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>const $=x=>document.getElementById(x);function qname(){return new URLSearchParams(location.search).get('athlete')}function render(){let n=$('ath').value,a=KSData.athlete(n);if(!a)return;let c=String(a.course||'50'),css=KSData.css(n,c),tests=KSData.tests().filter(x=>x.athlete===n).sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))),p50=KSData.pb(n,a.stroke||'Serbest',c,50),p100=KSData.pb(n,a.stroke||'Serbest',c,100),p200=KSData.pb(n,a.stroke||'Serbest',c,200),well=KSData.latest(n,'wellness');let readiness=well&&well.derived&&well.derived.readiness?Number(well.derived.readiness).toFixed(1):'—';$('out').innerHTML='<div class="card"><h2>'+n+'</h2><span class="tag">'+(a.stroke||'Branş yok')+'</span><span class="tag">'+(a.event||'Profil yok')+'</span><span class="tag">Grup '+(a.group||'—')+'</span><span class="tag">'+c+'m</span><div class="grid" style="margin-top:10px"><div class="k"><b>'+(p50?KSData.fmt(p50.time):'—')+'</b>50m PB</div><div class="k"><b>'+(p100?KSData.fmt(p100.time):'—')+'</b>100m PB</div><div class="k"><b>'+(p200?KSData.fmt(p200.time):'—')+'</b>200m PB</div><div class="k"><b>'+(css?KSData.fmt(css.sec100):'—')+'</b>CSS /100m</div></div></div><div class="row"><div class="card"><h3>Antrenman Kararı</h3><div class="mode"><b>Kişisel Antrenman</b><br><span class="muted">PB/CSS, branş, mesafe profili ve test verisine göre kişiye özel reçete.</span><br><a class="btn" href="v18-season-engine.html">Kişisel Planı Aç</a></div><div class="mode"><b>Grup Antrenmanı</b><br><span class="muted">Benzer gelişim grubu ve çalışma seviyesindeki sporcularla ortak ana set; gerekiyorsa kulvar içinde kişisel tempo.</span><br><a class="btn" href="v18-group-training.html">Gruba Ata / Grup Planı Aç</a></div><div class="mode"><b>Antrenmana Hazırlık</b><br><span class="muted">Son readiness: '+readiness+'. Seans öncesi koç gözlemi ve geri bildirim nihai kararı belirler.</span></div></div><div class="card"><h3>Son Testler</h3>'+(tests.length?tests.slice(0,6).map(t=>'<div class="test"><b>'+String(t.type||'Test').toUpperCase()+'</b> • '+(t.date||'Tarih yok')+'<br><span class="muted">'+(t.course?t.course+'m • ':'')+'kayıt mevcut</span></div>').join(''):'<div class="muted">Henüz test kaydı yok.</div>')+'<p><a class="btn secondary" href="v17-test-entry.html">Test / Ölçüm Gir</a></p></div></div>'}function init(){let r=KSData.roster();$('ath').innerHTML=r.map(a=>'<option>'+a.name+'</option>').join('');let q=qname();if(q&&r.some(a=>a.name===q))$('ath').value=q;$('ath').onchange=render;render()}init();</script></body></html>
