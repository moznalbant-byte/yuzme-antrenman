<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Event Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1180px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:9px;text-align:center}.kpi b{display:block;color:#fde68a}.row{padding:10px 0;border-top:1px solid #294058;line-height:1.5}.row b{color:#fde68a}.tag{display:inline-block;background:#17283b;padding:4px 7px;border-radius:7px;margin:2px;font-size:11px}.set{background:#0c1827;border:1px solid #294058;border-radius:10px;padding:10px;margin:7px 0}.set strong{color:#fde68a}.why{border-left:3px solid #f97316;background:#0b1625;padding:10px}.warn{border-left-color:#facc15}.nav a{display:inline-block;color:white;text-decoration:none;background:#17283b;padding:8px 10px;border-radius:8px;margin:3px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V18 EXACT EVENT ENGINE</b><div class="muted">Artık “100/200” değil: tam yarış + branş → yarış modeli → beceri → enerji önceliği → set mimarisi → kişisel split.</div><div class="nav"><a href="v18-performance-hub.html">Performance Hub</a><a href="v17-test-entry.html">Test Girişi</a><a href="v17-season-engine.html">Season Engine</a></div></div><div class="grid"><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div><div class="box"><label>YARIŞ</label><select id="dist"></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50">50m LCM</option></select></div><div class="box"><label>FAZ</label><select id="phase"><option>Genel Hazırlık</option><option selected>Özel Hazırlık</option><option>Race Specific</option><option>Taper</option></select></div></div><div id="out"></div></div><script>(function(){const $=x=>document.getElementById(x);function athletes(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function tests(){try{return JSON.parse(localStorage.getItem('v17Tests')||'[]')}catch(e){return[]}}function latest(n,t,c){return tests().filter(x=>x.athlete===n&&x.type===t&&(!c||x.course===c)).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}function fmt(s){if(!s||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}function pb(a,c,d){return a&&a.pb&&a.pb[c]&&a.pb[c][d]||null}const D={Serbest:[50,100,200,400,800,1500],Sırtüstü:[50,100,200],Kurbağalama:[50,100,200],Kelebek:[50,100,200],'Bireysel Karışık':[100,200,400]};const ST={Serbest:{skill:'streamline → breakout → catch/DPS → turn speed → finish',tech:'DPS + stroke rate dengesi'},Sırtüstü:{skill:'underwater dolphin → breakout → turn approach → turn-out',tech:'body line + rotation + early catch'},Kurbağalama:{skill:'start/pullout → breakout → pull-kick timing → turn → finish timing',tech:'dar kick + line + timing'},Kelebek:{skill:'underwater → breakout → 2nd kick → breathing pattern → last-15m rhythm',tech:'wave rhythm + hip-driven timing'},'Bireysel Karışık':{skill:'stroke transitions → legal turns → weak-stroke protection → finish',tech:'4 stroke economy + transition pacing'}};function profile(st,d){if(d===50)return{type:'PURE SPRINT',primary:'Saf hız + start/breakout',secondary:'Power / teknik kalite',rep:'10–35m',rest:'tam / çok uzun',rpe:'8–9'};if(d===100)return{type:'SPRINT ENDURANCE',primary:'Race pace + speed endurance',secondary:'Saf hız korunumu',rep:'15–75m',rest:'uzun',rpe:'8–9'};if(d===200)return{type:st==='Kurbağalama'||st==='Kelebek'?'TECHNICAL MIDDLE':'MIDDLE',primary:'Race pace + aerobik güç',secondary:'Teknik dayanıklılık',rep:'25–150m',rest:'orta-uzun',rpe:'7–9'};if(d===400)return{type:'MIDDLE ENDURANCE',primary:'Threshold + race pace',secondary:'Aerobik güç',rep:'50–300m',rest:'orta',rpe:'6–8'};return{type:'DISTANCE',primary:'Aerobik ekonomi + threshold',secondary:'Pace judgement + finish',rep:'100–800m',rest:'kısa-orta',rpe:'5–8'}}function sets(st,d,ph){let s=ST[st],x=[];if(d===50)x=[['8×15m','bloktan maksimum çıkış + breakout','2–3dk'],['2×(4×25)','%95+ hız; teknik bozulmadan','90sn / blok 4dk'],['6×25',s.skill,'tam dinlenme']];else if(d===100)x=[['4×(4×25)','100 yarış modelinin çeyrekleri; hedef split','30–45sn / blok 3dk'],['6×50','broken 100 race pace','2–3dk'],['6×15m',s.skill,'tam dinlenme']];else if(d===200)x=[['3×(4×50)','200 yarış split modeli: kontrollü → taşı → finish','30sn / blok 3dk'],['6×100','A3/END3 teknik sabit','25–40sn'],['6×25',s.skill,'60–90sn']];else if(d===400)x=[['3×(4×100)','400 pace: 1 kontrollü / 2 hedef / 1 finish','20–30sn / blok 2dk'],['6×200','END2 threshold + negatif split','20sn'],['4×50','race finish','60sn']];else x=[['4×400','hedef pace + stroke count kontrol','20–30sn'],['3×(600)','negative split / economy','30sn'],['8×100','race finish rhythm','20sn']];if(ph==='Genel Hazırlık')x=x.map((a,i)=>i===0?[a[0],a[1]+' • yoğunluk kontrollü, teknik öncelikli',a[2]]:a);if(ph==='Taper')x=x.map((a,i)=>[a[0],a[1]+' • hacmi azalt, kaliteyi koru',i===0?'tam/uzun':a[2]]);return x}function render(){let n=$('ath').value,a=athletes().find(x=>x.name===n),st=$('stroke').value,d=+$('dist').value,c=$('course').value,ph=$('phase').value,p=profile(st,d),t=pb(a,c,d),css=latest(n,'css',c),spr=latest(n,'sprint',c),skill=latest(n,'skills',c),split=t?t/(d/50):null,arr=sets(st,d,ph);let ref=d<=100?(spr?'Sprint testi mevcut':'Sprint testi gerekli'):(d>=400?(css?'CSS mevcut':'CSS testi gerekli'):'PB + race-pace testi');$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+p.type+'</b>PROFİL</div><div class="kpi"><b>'+p.primary+'</b>ANA UYARAN</div><div class="kpi"><b>'+p.rep+'</b>TEKRAR</div><div class="kpi"><b>'+p.rest+'</b>DİNLENME</div><div class="kpi"><b>'+p.rpe+'</b>RPE</div></div><div class="card"><b>YARIŞ MODELİ • '+d+' '+st+'</b><div class="row"><b>Teknik zincir:</b> '+ST[st].skill+'</div><div class="row"><b>Teknik kalite:</b> '+ST[st].tech+'</div><div class="row"><b>PB:</b> '+(t?fmt(t):'Bu havuzda kayıt yok')+' <span class="tag">'+c+'m</span></div><div class="row"><b>PB tabanlı 50 split referansı:</b> '+(split?fmt(split):'PB gerekli')+' <span class="tag">yarış içi gerçek split yerine kaba başlangıç referansı</span></div><div class="row"><b>Kalibrasyon:</b> '+ref+'</div></div><div class="card"><b>BU EVENT İÇİN SET MİMARİSİ • '+ph+'</b>'+arr.map((x,i)=>'<div class="set"><strong>'+(i===0?'MAIN':'BLOCK '+(i+1))+' • '+x[0]+'</strong><br>'+x[1]+'<br><span class="tag">Dinlenme '+x[2]+'</span></div>').join('')+'<div class="why"><b>Neden?</b> Aynı branşın 50, 100 ve 200’ü artık aynı motoru kullanmıyor. Yarış uzadıkça saf hızdan speed-endurance, teknik dayanıklılık, threshold ve pace judgement yönüne ağırlık kayıyor.</div></div><div class="card"><b>VERİ KALİTESİ / SONRAKİ ÖLÇÜM</b><div class="row">'+(d<=100?'15m/25m/50m sprint + start/breakout verisi öncelikli.':d>=400?'CSS/step + stroke count/rate + race pace öncelikli.':'Race-pace + efficiency + start/turn verisi öncelikli.')+'</div><div class="'+(skill?'why':'why warn')+'">Race skills: '+(skill?'kayıt mevcut • '+skill.date:'ölçüm kaydı yok • start/turn/breakout testi planla')+'</div></div>'}function updateD(){let st=$('stroke').value;$('dist').innerHTML=D[st].map(x=>'<option value="'+x+'">'+x+'m</option>').join('');if(D[st].includes(100))$('dist').value='100';render()}function init(){$('ath').innerHTML='<option value="">Sporcu seç</option>'+athletes().map(x=>'<option>'+x.name+'</option>').join('');$('stroke').onchange=updateD;['ath','dist','course','phase'].forEach(x=>$(x).onchange=render);updateD()}init()})();</script></body></html>
