<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Event Engine</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1180px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis,.splits{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.kpi,.split{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:9px;text-align:center}.kpi b,.split b{display:block;color:#fde68a}.row{padding:10px 0;border-top:1px solid #294058;line-height:1.5}.row b{color:#fde68a}.tag{display:inline-block;background:#17283b;padding:4px 7px;border-radius:7px;margin:2px;font-size:11px}.set{background:#0c1827;border:1px solid #294058;border-radius:10px;padding:10px;margin:7px 0}.set strong{color:#fde68a}.why{border-left:3px solid #f97316;background:#0b1625;padding:10px}.warn{border-left-color:#facc15}.nav a{display:inline-block;color:white;text-decoration:none;background:#17283b;padding:8px 10px;border-radius:8px;margin:3px}@media(max-width:800px){.grid,.kpis,.splits{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V18 EXACT EVENT ENGINE</b><div class="muted">Sporcu PB → tam branş/mesafe → yarış split modeli → set hedefi. Tahmini splitler ölçülmüş yarış splitleri gelene kadar başlangıç modelidir.</div><div class="nav"><a href="v18-performance-hub.html">Performance Hub</a><a href="v17-test-entry.html">Test Girişi</a><a href="v17-season-engine.html">Season Engine</a></div></div><div class="grid"><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>BRANŞ</label><select id="stroke"></select></div><div class="box"><label>YARIŞ</label><select id="dist"></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50" selected>50m LCM</option></select></div><div class="box"><label>FAZ</label><select id="phase"><option>Genel Hazırlık</option><option selected>Özel Hazırlık</option><option>Race Specific</option><option>Taper</option></select></div></div><div id="out"></div></div><script>(function(){const $=x=>document.getElementById(x);const ROSTER=['Elif Gönül Acar','Hasan Ege Ceylan','Melisa Öner','Mine Filiz','Defne Ceylan','Miraç Bayraktar'];const KNOWN={ 'Miraç Bayraktar':{'Kurbağalama':{50:34.32,100:78.53},'Serbest':{50:28.73}} };const ALL={Serbest:[50,100,200,400,800,1500],Sırtüstü:[50,100,200],Kurbağalama:[50,100,200],Kelebek:[50,100,200],'Bireysel Karışık':[100,200,400]};const ST={Serbest:{skill:'streamline → breakout → catch/DPS → turn speed → finish',tech:'DPS + stroke rate dengesi'},Sırtüstü:{skill:'underwater dolphin → breakout → turn approach → turn-out',tech:'body line + rotation + early catch'},Kurbağalama:{skill:'start/pullout → breakout → pull-kick timing → turn → finish timing',tech:'dar kick + line + timing'},Kelebek:{skill:'underwater → breakout → 2nd kick → breathing pattern → last-15m rhythm',tech:'wave rhythm + hip-driven timing'},'Bireysel Karışık':{skill:'stroke transitions → legal turns → weak-stroke protection → finish',tech:'4 stroke economy + transition pacing'}};function saved(){try{return JSON.parse(localStorage.getItem('ybAth13')||'[]')}catch(e){return[]}}function athletes(){let m={};ROSTER.forEach(n=>m[n]={name:n,pb:{}});saved().forEach(a=>{if(a&&a.name)m[a.name]=Object.assign({},m[a.name]||{},a)});return Object.values(m)}function tests(){try{return JSON.parse(localStorage.getItem('v17Tests')||'[]')}catch(e){return[]}}function latest(n,t,c){return tests().filter(x=>x.athlete===n&&x.type===t&&(!c||x.course===c)).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}function fmt(s){if(!s||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}function getPB(a,n,st,c,d){let candidates=[];if(a&&a.pb){candidates=[a.pb[c]&&a.pb[c][st]&&a.pb[c][st][d],a.pb[c]&&a.pb[c][d],a.pb[st]&&a.pb[st][c]&&a.pb[st][c][d],a.pb[st]&&a.pb[st][d]]}for(let x of candidates)if(Number(x)>0)return Number(x);if(KNOWN[n]&&KNOWN[n][st]&&KNOWN[n][st][d])return KNOWN[n][st][d];return null}function raceSplits(total,d,st){if(!total)return[];if(d===50)return[{lab:'50',sec:total,note:'PB'}];let weights;if(d===100)weights=st==='Kurbağalama'?[.485,.515]:[.49,.51];else if(d===200)weights=st==='Kurbağalama'||st==='Kelebek'?[.238,.249,.253,.260]:[.242,.249,.252,.257];else if(d===400)weights=[.247,.249,.251,.253];else{let n=d/100;weights=Array(n).fill(1/n);weights=weights.map((w,i)=>w+(i<n/2?-0.002/n:0.002/n))}let unit=d===100?50:100;return weights.map((w,i)=>({lab:(i+1)*unit+'m',sec:total*w,note:i===0?'Açılış':i===weights.length-1?'Finish':'Taşı'}))}function profile(st,d){if(d===50)return{type:'PURE SPRINT',primary:'Saf hız + start/breakout',rep:'10–35m',rest:'tam / çok uzun',rpe:'8–9'};if(d===100)return{type:'SPRINT ENDURANCE',primary:'Race pace + speed endurance',rep:'15–75m',rest:'uzun',rpe:'8–9'};if(d===200)return{type:st==='Kurbağalama'||st==='Kelebek'?'TECHNICAL MIDDLE':'MIDDLE',primary:'Race pace + aerobik güç',rep:'25–150m',rest:'orta-uzun',rpe:'7–9'};if(d===400)return{type:'MIDDLE ENDURANCE',primary:'Threshold + race pace',rep:'50–300m',rest:'orta',rpe:'6–8'};return{type:'DISTANCE',primary:'Aerobik ekonomi + threshold',rep:'100–800m',rest:'kısa-orta',rpe:'5–8'}}function sets(st,d,ph,rs){let splitTxt=rs.length?rs.map(x=>x.lab+' '+fmt(x.sec)).join(' • '):'PB/race test girilince hedef oluşacak',x=[];if(d===50)x=[['8×15m','bloktan maksimum çıkış + breakout','2–3dk'],['2×(4×25)','%95+ hız; teknik bozulmadan','90sn / blok 4dk'],['6×25',ST[st].skill,'tam dinlenme']];else if(d===100)x=[['4×(4×25)','100 yarış modelini parçala • '+splitTxt,'30–45sn / blok 3dk'],['6×50','broken 100; hedef yarış ritmi','2–3dk'],['6×15m',ST[st].skill,'tam dinlenme']];else if(d===200)x=[['3×(4×50)','200 yarış modeli • '+splitTxt,'30sn / blok 3dk'],['6×100','A3/END3 teknik sabit','25–40sn'],['6×25',ST[st].skill,'60–90sn']];else if(d===400)x=[['3×(4×100)','400 yarış modeli • '+splitTxt,'20–30sn / blok 2dk'],['6×200','END2 threshold + negatif split','20sn'],['4×50','race finish','60sn']];else x=[['4×400','hedef pace + stroke count kontrol','20–30sn'],['3×600','negative split / economy','30sn'],['8×100','race finish rhythm','20sn']];if(ph==='Genel Hazırlık')x=x.map((a,i)=>i===0?[a[0],a[1]+' • teknik öncelikli',a[2]]:a);if(ph==='Taper')x=x.map(a=>[a[0],a[1]+' • hacmi azalt, kaliteyi koru','tam/uzun']);return x}function render(){let n=$('ath').value,a=athletes().find(x=>x.name===n),st=$('stroke').value,d=+$('dist').value,c=$('course').value,ph=$('phase').value,p=profile(st,d),t=getPB(a,n,st,c,d),rs=raceSplits(t,d,st),css=latest(n,'css',c),spr=latest(n,'sprint',c),skill=latest(n,'skills',c),arr=sets(st,d,ph,rs);let ref=d<=100?(spr?'Sprint testi mevcut':'Sprint testi gerekli'):(d>=400?(css?'CSS mevcut':'CSS testi gerekli'):'PB + race-pace testi gerekli');$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+p.type+'</b>PROFİL</div><div class="kpi"><b>'+p.primary+'</b>ANA UYARAN</div><div class="kpi"><b>'+p.rep+'</b>TEKRAR</div><div class="kpi"><b>'+p.rest+'</b>DİNLENME</div><div class="kpi"><b>'+p.rpe+'</b>RPE</div></div><div class="card"><b>'+n+' • '+d+' '+st+'</b><div class="row"><b>PB:</b> '+(t?fmt(t):'Kayıt yok')+' • '+c+'m</div><div class="row"><b>Teknik zincir:</b> '+ST[st].skill+'</div><div class="row"><b>Kalibrasyon:</b> '+ref+'</div>'+(rs.length?'<div class="splits">'+rs.map(x=>'<div class="split"><b>'+fmt(x.sec)+'</b>'+x.lab+'<div class="muted">'+x.note+'</div></div>').join('')+'</div><div class="why warn"><b>Split modeli:</b> Bunlar PB’den üretilmiş başlangıç hedefleridir; gerçek yarış splitleri girildiğinde onların yerini ölçülmüş model almalı.</div>':'<div class="why warn"><b>PB eksik.</b> Bu branş/mesafe/havuz için derece girildiğinde yarış split motoru açılacak.</div>')+'</div><div class="card"><b>SET MİMARİSİ • '+ph+'</b>'+arr.map((x,i)=>'<div class="set"><strong>'+(i===0?'MAIN':'BLOCK '+(i+1))+' • '+x[0]+'</strong><br>'+x[1]+'<br><span class="tag">Dinlenme '+x[2]+'</span></div>').join('')+'</div><div class="card"><b>VERİ KALİTESİ</b><div class="row">Race skills: '+(skill?'✓ '+skill.date:'ölçüm yok')+'</div><div class="row">'+(d<=100?'Öncelik: 15/25/50 sprint + start/breakout.':d>=400?'Öncelik: CSS/step + stroke count/rate + gerçek yarış splitleri.':'Öncelik: race-pace + efficiency + gerçek yarış splitleri.')+'</div></div>'}function updateDistances(){let st=$('stroke').value;$('dist').innerHTML=ALL[st].map(x=>'<option value="'+x+'">'+x+'m</option>').join('');$('dist').value=ALL[st].includes(100)?100:ALL[st][0];render()}function init(){let aa=athletes();$('ath').innerHTML=aa.map(x=>'<option>'+x.name+'</option>').join('');$('stroke').innerHTML=Object.keys(ALL).map(x=>'<option>'+x+'</option>').join('');$('stroke').onchange=updateDistances;['ath','dist','course','phase'].forEach(x=>$(x).onchange=render);updateDistances()}init()})();</script></body></html>
