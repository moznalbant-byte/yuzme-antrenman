<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Exact Event Unified</title><style>body{margin:0;padding:12px;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1050px;margin:auto}.card{background:#101d2d;border:1px solid #294058;border-radius:14px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{background:#101d2d;border:1px solid #294058;border-radius:12px;padding:10px}label{display:block;color:#9fb0c2;font-size:10px;font-weight:900;margin-bottom:5px}select{width:100%;padding:10px;border:0;border-radius:8px;background:#fff4bf;font-weight:800}.orange{color:#f97316}.row{border-top:1px solid #294058;padding:10px 0}.row b{color:#fde68a}.set{background:#0c1827;border:1px solid #294058;border-radius:10px;padding:10px;margin:7px 0}.warn{border-left:3px solid #facc15;padding:10px;background:#0b1625}.ok{border-left-color:#22c55e}.nav a{display:inline-block;background:#17283b;color:#fff;text-decoration:none;padding:6px 8px;border-radius:8px;margin:2px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><div class="card"><b><span class="orange">KUMSAL SPOR</span> • V18 EXACT EVENT • UNIFIED</b><div class="nav"><a href="v18-season-engine.html">Season Engine</a><a href="v18-performance-hub.html">Performance Hub</a><a href="v17-test-entry.html">Test Girişi</a><a href="v18-system-check.html">Sistem Kontrol</a></div></div><div class="grid"><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div><div class="box"><label>MESAFE</label><select id="dist"><option>50</option><option selected>100</option><option>200</option><option>400</option><option>800</option><option>1500</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50" selected>50m LCM</option></select></div></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>(function(){const $=x=>document.getElementById(x);function render(){if(!window.KSData){$('out').innerHTML='<div class="card">Data core yüklenemedi.</div>';return}let n=$('ath').value,s=$('stroke').value,d=+$('dist').value,c=$('course').value,p=KSData.pb(n,s,c,d),css=KSData.css(n,c),spr=KSData.latest(n,'sprint',c),skill=KSData.latest(n,'skills',c),usable=p&&p.verified,split=usable?p.time/(d/50):null,type=d<=50?'PURE SPRINT':d<=100?'SPRINT ENDURANCE':d<=200?'MIDDLE':d<=400?'MIDDLE ENDURANCE':'DISTANCE',sets=d<=50?[['8×15m','start + breakout • tam dinlenme'],['2×(4×25)','%95+ hız • 90sn / blok 4dk']]:d<=100?[['4×(4×25)','100 yarış modeli • 30–45sn'],['6×50','broken 100 • 2–3dk']]:d<=200?[['3×(4×50)','200 RP • 30sn / blok 3dk'],['6×100','A3/END3 • 25–40sn']]:d<=400?[['3×(4×100)','400 RP • 20–30sn'],['6×200','END2 negatif split • 20sn']]:[['4×400','pace + stroke count • 20–30sn'],['3×600','negative split / economy • 30sn']];$('out').innerHTML='<div class="card"><b>'+n+' • '+d+'m '+s+' • '+type+'</b><div class="row"><b>PB:</b> '+(p?KSData.fmt(p.time):'yok')+' • '+(p?(p.verified?c+'m doğrulandı':'havuz doğrulanmamış'):'—')+'</div><div class="row"><b>Race pace 50:</b> '+(split?KSData.fmt(split):'doğrulanmış PB gerekli')+'</div><div class="row"><b>CSS:</b> '+(css?KSData.fmt(css.sec100)+'/100m • '+css.source:'yok / gerekli olabilir')+'</div><div class="row"><b>Sprint testi:</b> '+(spr?'✓ '+spr.date:'ölçüm yok')+' • <b>Race skills:</b> '+(skill?'✓ '+skill.date:'ölçüm yok')+'</div><div class="warn '+(usable?'ok':'')+'">'+(usable?'PB tempo üretiminde kullanılabilir.':p?'Derece korunuyor fakat havuz doğrulanmadan otomatik tempo üretmiyor.':'Bu event için PB eksik.')+'</div></div><div class="card"><b>EVENT SET MİMARİSİ</b>'+sets.map(x=>'<div class="set"><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('')+'<div class="warn">Set hedefleri KSData üzerinden gelen PB/test durumuna göre yorumlanır; nihai karar koçta.</div></div>'}function init(){if(!window.KSData){render();return}$('ath').innerHTML=KSData.roster().map(a=>'<option>'+a.name+'</option>').join('');['ath','stroke','dist','course'].forEach(x=>$(x).onchange=render);render()}init()})();</script></body></html>
