<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V18 Grup Antrenmanı</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1180px;margin:auto}.card{background:#101d2d;border:1px solid #294058;border-radius:16px;padding:15px;margin-bottom:12px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}select,input{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:800}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}.ath{padding:10px;border-radius:10px;background:#0b1625;margin:6px 0}.ath input{width:auto}.tag{display:inline-block;background:#17283b;padding:4px 7px;border-radius:7px;font-size:10px;margin:2px}.btn{border:0;background:#f97316;color:#fff;font-weight:900;padding:11px 13px;border-radius:10px;cursor:pointer}.set{border-top:1px solid #294058;padding:11px 0}.set b{color:#fde68a}.lane{background:#0b1625;border-left:3px solid #f97316;border-radius:8px;padding:9px;margin-top:7px}.nav a{display:inline-block;color:#fff;background:#17283b;text-decoration:none;padding:8px 10px;border-radius:8px;margin:2px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="card"><b><span class="orange">KUMSAL SPOR</span> • GRUP ANTRENMANI</b><div class="muted">Aynı yaş demek otomatik olarak aynı antrenman demek değildir. Grup; gelişim grubu + mesafe profili + teknik/performans düzeyi birlikte düşünülerek oluşturulur.</div><div class="nav"><a href="v18-athletes.html">Sporcular</a><a href="v18-athlete-profile.html">Sporcu Dosyası</a><a href="v18-season-engine.html">Kişisel Antrenman</a><a href="v18-mobile.html">📱 Mobil</a></div></div><div class="card"><h3>1. Grubu Oluştur</h3><div class="grid"><div><label>GELİŞİM GRUBU</label><select id="group"><option>A</option><option>B</option><option selected>C</option></select></div><div><label>MESAFE ODAĞI</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div><label>ANA AMAÇ</label><select id="goal"><option>Aerobik Temel</option><option selected>Eşik / END2</option><option>Hız Dayanıklılığı</option><option>Yarış Temposu</option><option>Teknik / Toparlanma</option></select></div></div><div id="athletes"></div><p><button class="btn" onclick="build()">Seçili Sporculara Grup Antrenmanı Oluştur</button></p></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>const $=x=>document.getElementById(x);function renderAth(){let g=$('group').value,e=$('event').value,r=KSData.roster();let suggested=r.filter(a=>(a.group||'C')===g&&(a.event||'200/400')===e);$('athletes').innerHTML='<h4>Önerilen sporcular</h4><div class="muted">Filtre: Grup '+g+' • '+e+'. Koç isterse aşağıdan başka sporcuyu da ekleyebilir.</div>'+r.map(a=>'<label class="ath"><input class="pick" type="checkbox" value="'+a.name+'" '+(suggested.some(x=>x.name===a.name)?'checked':'')+'> <b>'+a.name+'</b> <span class="tag">Grup '+(a.group||'—')+'</span><span class="tag">'+(a.event||'profil yok')+'</span><span class="tag">'+(a.stroke||'branş yok')+'</span></label>').join('')}function build(){let names=[...document.querySelectorAll('.pick:checked')].map(x=>x.value),goal=$('goal').value,e=$('event').value;if(!names.length){$('out').innerHTML='<div class="card">⚠ En az bir sporcu seç.</div>';return}let main=goal==='Eşik / END2'?(e==='50/100'?'3×(6×50)':'3×(4×100)'):goal==='Hız Dayanıklılığı'?'3×(6×25)':'Aerobik Temel'===goal?'12×100':goal==='Yarış Temposu'?'2×(6×50)':'8×50 drill/swim';let athletes=names.map(n=>{let a=KSData.athlete(n),c=String(a&&a.course||'50'),css=KSData.css(n,c),p=css?KSData.fmt(css.sec100)+'/100m':'RPE/teknik kalite';return '<div class="lane"><b>'+n+'</b> • '+(a&&a.stroke||'—')+'<br><span class="muted">Aynı ana set: '+main+' • kişisel referans: '+p+'</span></div>'}).join('');$('out').innerHTML='<div class="card"><h3>2. Ortak Grup Antrenmanı</h3><div class="set"><b>Isınma</b><br>400–600m A1 + branş karışık. Grup birlikte.</div><div class="set"><b>Teknik hazırlık</b><br>8×50 drill/swim. Koç aynı komutu verir; branşa göre drill farklılaştırılabilir.</div><div class="set"><b>Ana set • '+main+'</b><br>'+goal+'. Tek set mimarisi korunur; sporcular kişisel tempo veya çıkış aralığıyla kulvar içinde ayrıştırılır.'+athletes+'</div><div class="set"><b>Yarış becerisi</b><br>Start/dönüş/breakout istasyonları. Branşa göre küçük alt gruplar.</div><div class="set"><b>Soğuma</b><br>200–400m A1 kolay.</div><div class="lane"><b>Koç kuralı:</b> Yaşı yakın olsa bile belirgin teknik seviye, gelişim evresi veya tempo farkı varsa aynı kulvarda aynı çıkış süresi zorlanmaz. Ana amaç ortak tutulup doz kişiselleştirilir.</div></div>'}['group','event'].forEach(id=>$(id).onchange=renderAth);renderAth();</script></body></html>
