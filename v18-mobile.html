<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>V18 Antrenör</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 12px calc(82px + env(safe-area-inset-bottom))}.app{max-width:600px;margin:auto}.top{position:sticky;top:0;z-index:4;background:rgba(7,17,31,.96);padding:12px 0 10px}.brand{font-weight:950;font-size:18px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.hero,.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin-bottom:10px}.hero h1{font-size:23px;margin:4px 0}.status{display:flex;gap:7px;overflow:auto;padding:3px 0}.pill{white-space:nowrap;background:#17283b;border-radius:999px;padding:7px 10px;font-size:11px}.pill b{color:#fde68a}.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:10px;color:#9fb0c2;font-weight:900;display:block;margin-bottom:5px}select,input{width:100%;border:0;border-radius:12px;padding:12px;background:#fff4bf;font-weight:850}.title{font-size:14px;font-weight:950;color:#fde68a;margin-bottom:8px}.set{border-top:1px solid #294058;padding:12px 0}.set:first-of-type{border-top:0}.sethead{display:flex;justify-content:space-between;gap:8px;font-weight:900}.meter{color:#fde68a;white-space:nowrap}.rx{font-size:17px;font-weight:950;margin:5px 0}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;background:#17283b;padding:5px 7px;border-radius:7px}.target{color:#fde68a}.check{margin-top:9px;width:100%;border:1px solid #36516d;background:#0b1625;color:#fff;padding:9px;border-radius:10px;font-weight:850}.check.done{background:#153522;border-color:#22c55e}.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mini{background:#0b1625;border-radius:12px;padding:10px;text-align:center}.mini b{display:block;color:#fde68a;font-size:16px}.good{border-left:3px solid #22c55e}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#0b1625;border-top:1px solid #294058;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.bottom a{text-decoration:none;color:#9fb0c2;text-align:center;font-size:10px;padding:7px 2px;border-radius:9px}.bottom a.active{background:#17283b;color:#fff}.ico{display:block;font-size:20px;margin-bottom:2px}@media(min-width:700px){body{background:#07111f}.bottom{max-width:600px;left:50%;transform:translateX(-50%);border:1px solid #294058;border-bottom:0;border-radius:16px 16px 0 0}.selects{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="app"><div class="top"><div class="brand"><span class="orange">KUMSAL SPOR</span> • ANTRENÖR</div><div class="muted">Havuz başı mobil çalışma ekranı</div></div><div class="hero"><div class="muted" id="day"></div><h1>Bugünkü Antrenman</h1><div class="status"><span class="pill"><b id="phase">—</b> faz</span><span class="pill"><b id="goal">—</b> amaç</span><span class="pill"><b id="total">—</b> toplam</span></div></div><div class="card"><div class="selects"><div><label>SPORCU</label><select id="ath"></select></div><div><label>SEANS</label><select id="session"><option>Sabah</option><option>Akşam</option></select></div><div><label>PROFİL</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div></div></div><div id="out"></div></div><nav class="bottom"><a class="active" href="v18-mobile.html"><span class="ico">⌂</span>Bugün</a><a href="v18-performance-hub.html"><span class="ico">♟</span>Sporcular</a><a href="v17-test-entry.html"><span class="ico">◉</span>Testler</a><a href="v18-season-engine.html"><span class="ico">▦</span>Sezon</a><a href="v18-system-check.html"><span class="ico">⚙</span>Kontrol</a></nav><script src="v18-data-core.js"></script><script>(function(){const $=x=>document.getElementById(x),BASE={'50/100':3000,'100/200':3600,'200/400':4200,'400/800':5000,'800/1500':5600};function phase(d){let m=d.getMonth()+1;if(m===9)return['ADAPTASYON','Aerobik Ekonomi'];if(m===10)return['GENEL HAZIRLIK','Aerobik Ekonomi'];if(m===11)return['ÖZEL HAZIRLIK','Eşik / END2'];if(m===12)return['YARIŞA ÖZGÜ','Yarış Temposu'];if(m>=3&&m<=4)return['ÖZEL HAZIRLIK II','Yarış Temposu'];if(m===5)return['ZİRVE / TAPER','Yarış Temposu'];return['GELİŞİM','Teknik + Aerobik']}function rx(m,u){u=u||100;if(m%u)u=50;return Math.round(m/u)+'×'+u}function render(){if(!window.KSData){$('out').innerHTML='<div class="card">Veri merkezi yüklenemedi.</div>';return}let d=new Date(),n=$('ath').value,e=$('event').value,st=$('stroke').value,ses=$('session').value,p=phase(d),goal=ses==='Akşam'?(e==='50/100'?'Saf Hız':'Yarış Temposu'):p[1],target=Math.round(BASE[e]*(ses==='Akşam'?.78:1)/50)*50,parts=[.16,.12,.38,.14,.10,.10].map(x=>Math.round(target*x/50)*50);parts[2]+=target-parts.reduce((a,b)=>a+b,0);let names=['Su Isınması','Teknik + Hazırlık','Ana Set','Kick / Pull','Yarış Becerisi','Soğuma'],desc=['A1 kolay + kademeli hızlanma',st+' tekniği • drill/swim',goal+' • ana kalite bloğu','Branşa özel kuvvet + ekonomi','Start • dönüş • breakout • finish','A1 çok kolay + uzun kulaç'],rests=['10–15sn','15–20sn',goal==='Saf Hız'?'75–120sn':'20–30sn','20sn','30–60sn','serbest'],rpes=['2–3','3–4',goal==='Saf Hız'?'8–9':'6–8','4–6','5–8','1–2'];$('day').textContent=d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});$('phase').textContent=p[0];$('goal').textContent=goal;$('total').textContent=target+'m';let sets=names.map((x,i)=>'<div class="set"><div class="sethead"><span>'+(i+1)+'. '+x+'</span><span class="meter">'+parts[i]+'m</span></div><div class="rx">'+rx(parts[i],i===1||i===4?50:(e==='50/100'?50:100))+'</div><div>'+desc[i]+'</div><div class="tags"><span class="tag">Dinlenme '+rests[i]+'</span><span class="tag">RPE '+rpes[i]+'</span></div><button class="check" onclick="this.classList.toggle('done');this.textContent=this.classList.contains('done')?'✓ Tamamlandı':'Seti tamamla'">Seti tamamla</button></div>').join('');$('out').innerHTML='<div class="card"><div class="title">'+n+' • '+ses+' Birim Antrenmanı</div>'+sets+'</div><div class="card good"><div class="title">Antrenman Özeti</div><div class="summary"><div class="mini"><b>'+target+'m</b>Toplam</div><div class="mini"><b>'+goal+'</b>Ana amaç</div><div class="mini"><b>'+st+'</b>Branş</div><div class="mini"><b>'+e+'</b>Profil</div></div></div>'}function init(){if(!window.KSData){render();return}$('ath').innerHTML=KSData.roster().map(a=>'<option>'+a.name+'</option>').join('');['ath','session','event','stroke'].forEach(x=>$(x).onchange=render);render()}init()})();</script></body></html>
