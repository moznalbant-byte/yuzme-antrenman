<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Sporcu Performans Merkezi</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1180px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;color:#fde68a}.row{border-top:1px solid #294058;padding:10px 0;line-height:1.5}.row b{color:#fde68a}.ok,.warn,.bad{background:#0b1625;padding:10px;border-left:3px solid #22c55e;margin-top:8px}.warn{border-left-color:#facc15}.bad{border-left-color:#ef4444}.nav a{display:inline-block;background:#17283b;color:#fff;text-decoration:none;border-radius:8px;padding:7px 9px;margin:2px}.cta{display:block;background:#f97316;color:#fff;text-decoration:none;padding:11px;border-radius:10px;text-align:center;font-weight:900;margin-top:8px}@media(max-width:800px){.grid,.kpis{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.kpis{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • SPORCU PERFORMANS MERKEZİ</b><div class="muted">Sezon, test, kişisel en iyi derece (PB), antrenmana hazırlık ve kişisel tempo tek ekranda.</div><div class="nav"><a href="v18-season-engine.html">Sezon ve Antrenman Planı</a><a href="v18-exact-event-engine.html">Branş ve Yarış Planı</a><a href="v17-test-entry.html">Test ve Ölçüm Girişi</a><a href="v18-system-check.html">Sistem Kontrolü</a></div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date"></div><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>YARIŞ MESAFE PROFİLİ</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m Kısa Kulvar (SCM)</option><option value="50" selected>50m Uzun Kulvar (LCM)</option></select></div></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>(function(){const $=x=>document.getElementById(x);$('date').value=new Date().toISOString().slice(0,10);function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON','Teknik + başlangıç kapasitesi'];if(m===10)return['GENEL HAZIRLIK','Kapasite + teknik'];if(m===11)return['ÖZEL HAZIRLIK','Eşik + güç + yarış temposu'];if(m===12&&n<8)return['YARIŞA ÖZGÜ I','Yarış modeli'];if(m===12&&n<15)return['YARIŞ ÖNCESİ AZALTMA I','Hacim azalır, kalite korunur'];if(m===12)return['ZİRVE I','İlk ana yarış'];if(m===1)return['YENİDEN YÜKLEME','Yenilenme + yeniden yükleme'];if(m===2)return['GENEL HAZIRLIK II','Kapasite + kuvvet'];if(m===3)return['ÖZEL HAZIRLIK II','Eşik + güç + yarış temposu'];if(m===4)return['YARIŞA ÖZGÜ II','Ana yarış modeli'];if(m===5&&n<5)return['YARIŞ ÖNCESİ AZALTMA II','Ana taper dönemi'];if(m===5&&n<16)return['ZİRVE II','Ana yarış'];return['GEÇİŞ / GELİŞİM','Teknik + kapasite']}function render(){if(!window.KSData){$('out').innerHTML='<div class="card bad">Ortak veri çekirdeği yüklenemedi.</div>';return}let n=$('ath').value,c=$('course').value,e=$('event').value,d=new Date($('date').value+'T12:00:00'),ph=phase(d),css=KSData.css(n,c),spr=KSData.latest(n,'sprint',c),eff=KSData.latest(n,'eff',c),well=KSData.latest(n,'wellness'),skill=KSData.latest(n,'skills',c),ready=well&&well.derived&&Number(well.derived.readiness),flag=!well?'VERİ YOK':ready>=6.5?'HAZIR':ready>=5?'ORTA':'DİKKAT',decision=flag==='DİKKAT'?'YÜKÜ AZALT / TOPARLANMA':flag==='ORTA'?'KALİTEYİ KORU • HACMİ TEMKİNLİ':'NORMAL YÜK';let dist=e==='50/100'?100:e==='100/200'?200:e==='200/400'?200:e==='400/800'?400:800,p=KSData.pb(n,'Serbest',c,dist),rp50=p&&p.verified?p.time/(dist/50):null,s25=spr&&spr.data&&Number(spr.data.v25),personal=e==='50/100'?(s25?'Sprint kalite 25m: '+(s25/.98).toFixed(2)+'–'+(s25/.95).toFixed(2)+' sn':'25m sprint testi gerekli'):(css?'END2 / eşik dayanıklılığı referansı ≈ '+KSData.fmt(css.sec100)+'/100m ('+css.source+')':'CSS / Kritik Yüzme Hızı için 200+400 verisi gerekli');let needs=[];if(e!=='50/100'&&(!css||(css.date&&KSData.ageDays({date:css.date},$('date').value)>42)))needs.push('CSS');if((e==='50/100'||e==='100/200')&&(!spr||KSData.ageDays(spr,$('date').value)>42))needs.push('SPRINT');if(!eff||KSData.ageDays(eff,$('date').value)>42)needs.push('VERİMLİLİK');if(!skill||KSData.ageDays(skill,$('date').value)>42)needs.push('YARIŞ BECERİLERİ');$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+ph[0]+'</b>SEZON FAZI</div><div class="kpi"><b>'+flag+'</b>ANTRENMANA HAZIRLIK</div><div class="kpi"><b>'+decision+'</b>YÜK KARARI</div><div class="kpi"><b>'+needs.length+'</b>TEST İHTİYACI</div></div><div class="card"><b>'+n+' • BUGÜNKÜ KİŞİSEL REFERANSLAR</b><div class="row"><b>'+e+'</b> • '+ph[1]+'</div><div class="row"><b>Antrenman hedefi:</b> '+personal+'</div><div class="row"><b>Yarış Temposu (Race Pace):</b> '+(rp50?'50m split ≈ '+KSData.fmt(rp50):p&&!p.verified?'PB var fakat havuz uzunluğu doğrulanmamış':'Doğrulanmış yarış PB’si gerekli')+'</div><div class="row"><b>Yüzme Verimliliği:</b> '+(eff?'DPS / kulaç başına mesafe '+((eff.derived&&eff.derived.distancePerStroke)?Number(eff.derived.distancePerStroke).toFixed(2):'—')+' • SR / kulaç hızı '+((eff.data&&eff.data.sr)||'—'):'Verimlilik testi gerekli')+'</div><div class="row"><b>Start / Çıkış:</b> '+(skill?'15m '+((skill.data&&skill.data.start15)||'—')+' • su üstüne çıkış '+((skill.data&&skill.data.bo)||'—')+'m':'Yarış becerileri testi gerekli')+'</div><div class="'+(flag==='DİKKAT'?'bad':flag==='ORTA'?'warn':'ok')+'"><b>Koç kararı:</b> '+decision+'. Nihai karar koçta.</div></div><div class="card"><b>VERİ KALİTESİ</b>'+[['CSS','CSS • Kritik Yüzme Hızı'],['SPRINT','Sprint / Saf Hız'],['VERİMLİLİK','Yüzme Verimliliği'],['YARIŞ BECERİLERİ','Yarış Becerileri']].map(x=>'<div class="row"><b>'+x[1]+'</b> '+(needs.includes(x[0])?'⚠️ Eksik veya 6 haftadan eski':'✓ Güncel / kullanılabilir')+'</div>').join('')+'<a class="cta" href="v17-test-entry.html">Eksik Testi Gir / Güncelle →</a></div><div class="card"><b>ORTAK VERİ DURUMU</b><div class="ok">Sporcu, PB ve test kayıtları ortak veri merkezinden okunuyor.</div><a class="cta" href="v18-system-check.html">Veri Bütünlüğünü Kontrol Et →</a></div>'}function init(){if(!window.KSData){render();return}$('ath').innerHTML=KSData.roster().map(x=>'<option>'+x.name+'</option>').join('');['date','ath','event','course'].forEach(x=>$(x).onchange=render);render()}init()})();</script></body></html>
