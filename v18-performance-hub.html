<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Performance Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.w{max-width:1180px;margin:auto}.hero,.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px}.hero,.card{padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{padding:10px}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{background:#0c1827;border:1px solid #294058;border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;color:#fde68a}.row{border-top:1px solid #294058;padding:10px 0;line-height:1.5}.row b{color:#fde68a}.ok,.warn,.bad{background:#0b1625;padding:10px;border-left:3px solid #22c55e;margin-top:8px}.warn{border-left-color:#facc15}.bad{border-left-color:#ef4444}.tag,.nav a{display:inline-block;background:#17283b;color:#fff;text-decoration:none;border-radius:8px;padding:5px 8px;margin:2px}.cta{display:block;background:#f97316;color:#fff;text-decoration:none;padding:11px;border-radius:10px;text-align:center;font-weight:900;margin-top:8px}@media(max-width:800px){.grid,.kpis{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.kpis{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="hero"><b><span class="orange">KUMSAL SPOR</span> • V18 ATHLETE INTELLIGENCE HUB</b><div class="muted">Sezon + test + PB + readiness + kişisel tempo tek karar ekranında.</div><div class="nav"><a href="v17-season-engine.html">Season Engine</a><a href="v17-test-entry.html">Test Girişi</a><a href="v17-test-guide.html">Nasıl Ölçerim?</a><a href="v17-coach-dashboard.html">Dashboard</a></div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date"></div><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>EVENT</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50">50m LCM</option></select></div></div><div id="out"></div></div><script>(function(){const $=x=>document.getElementById(x);$('date').value=new Date().toISOString().slice(0,10);function get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function latest(n,t,c){return get('v17Tests').filter(x=>x.athlete===n&&x.type===t&&(!c||x.course===c)).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}function age(r){return r?Math.floor((Date.now()-new Date(r.date))/86400000):9999}function fmt(s){if(!s||!isFinite(s))return'—';let m=Math.floor(s/60),x=(s-m*60).toFixed(2).padStart(5,'0');return m?m+':'+x:x}function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON','Teknik + başlangıç kapasitesi'];if(m===10)return['GENEL HAZIRLIK','Kapasite + teknik'];if(m===11)return['ÖZEL HAZIRLIK','Threshold + power + race pace'];if(m===12&&n<8)return['RACE SPECIFIC I','Yarış modeli'];if(m===12&&n<15)return['TAPER I','Hacim ↓, kalite korunur'];if(m===12)return['PEAK I','İlk zirve'];if(m===1)return['REBUILD','Yenilenme + yeniden yükleme'];if(m===2)return['GENEL HAZIRLIK II','Kapasite + kuvvet'];if(m===3)return['ÖZEL HAZIRLIK II','Threshold + power + race pace'];if(m===4)return['RACE SPECIFIC II','Ana yarış modeli'];if(m===5&&n<5)return['TAPER II','Ana taper'];if(m===5&&n<16)return['PEAK II','Ana yarış'];return['GEÇİŞ/GELİŞİM','Teknik + kapasite']}function pb(a,c,d){return a&&a.pb&&a.pb[c]&&a.pb[c][d]||null}function render(){let n=$('ath').value,c=$('course').value,e=$('event').value,a=get('ybAth13').find(x=>x.name===n),d=new Date($('date').value+'T12:00:00'),ph=phase(d),css=latest(n,'css',c),spr=latest(n,'sprint',c),eff=latest(n,'eff',c),well=latest(n,'wellness'),skill=latest(n,'skills',c),ready=well&&well.derived&&well.derived.readiness;let flag=!well?'VERİ YOK':ready>=6.5?'HAZIR':ready>=5?'ORTA':'DİKKAT',decision=flag==='DİKKAT'?'YÜKÜ AZALT / RECOVERY':flag==='ORTA'?'KALİTEYİ KORU • HACMİ TEMKİNLİ':'NORMAL YÜK';let css100=css&&css.derived&&css.derived.css100,s25=spr&&spr.data&&+spr.data.v25;let dist=e==='50/100'?100:e==='100/200'?200:e==='200/400'?200:e==='400/800'?400:800,p=pb(a,c,dist),rp50=p?p/(dist/50):null;let personal=e==='50/100'?(s25?'SPR kalite 25m: '+(s25/.98).toFixed(2)+'–'+(s25/.95).toFixed(2)+' sn':'25m sprint testi gerekli'):(css100?'END2 ≈ '+fmt(css100)+'/100m':'CSS 200+400 testi gerekli');let needs=[];if(e!=='50/100'&&(!css||age(css)>42))needs.push('CSS');if((e==='50/100'||e==='100/200')&&(!spr||age(spr)>42))needs.push('SPRINT');if(!eff||age(eff)>42)needs.push('EFFICIENCY');if(!skill||age(skill)>42)needs.push('RACE SKILLS');$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+ph[0]+'</b>SEZON FAZI</div><div class="kpi"><b>'+flag+'</b>READINESS</div><div class="kpi"><b>'+decision+'</b>YÜK KARARI</div><div class="kpi"><b>'+needs.length+'</b>TEST İHTİYACI</div></div><div class="card"><b>BUGÜNKÜ KİŞİSEL REFERANSLAR</b><div class="row"><b>'+e+'</b> • '+ph[1]+'</div><div class="row"><b>Antrenman hedefi:</b> '+personal+'</div><div class="row"><b>Race Pace:</b> '+(rp50?'50 split ≈ '+fmt(rp50):'Event PB gerekli')+'</div><div class="row"><b>Teknik ekonomi:</b> '+(eff?'DPS '+((eff.derived&&eff.derived.distancePerStroke)?eff.derived.distancePerStroke.toFixed(2):'—')+' • SR '+(eff.data.sr||'—'):'Efficiency testi gerekli')+'</div><div class="row"><b>Start/Breakout:</b> '+(skill?'15m '+(skill.data.start15||'—')+' • breakout '+(skill.data.bo||'—')+'m':'Race skills testi gerekli')+'</div><div class="'+(flag==='DİKKAT'?'bad':flag==='ORTA'?'warn':'ok')+'"><b>Koç kararı:</b> '+decision+'. Nihai karar koçta; sistem öneri üretir.</div></div><div class="card"><b>VERİ KALİTESİ / NE ZAMAN YENİDEN ÖLÇ?</b>'+(['CSS','SPRINT','EFFICIENCY','RACE SKILLS'].map(x=>'<div class="row"><b>'+x+'</b> '+(needs.includes(x)?'⚠️ Eksik veya 6 haftadan eski — mevcut fazın uygun test penceresinde yenile.':'✓ Güncel')+'</div>').join(''))+'<a class="cta" href="v17-test-entry.html">Eksik Testi Gir / Güncelle →</a></div><div class="card"><b>SEASON ENGINE'E AKTARILACAK KARAR PAKETİ</b><div class="row"><span class="tag">'+ph[0]+'</span><span class="tag">'+e+'</span><span class="tag">'+c+'m</span><span class="tag">'+flag+'</span></div><div class="row"><b>Tempo:</b> '+personal+'</div><div class="row"><b>Race pace:</b> '+(rp50?fmt(rp50)+'/50':'PB gerekli')+'</div><div class="row"><b>Yük:</b> '+decision+'</div><div class="ok">Bu ekran test kaynağını görünür tutar; eski veya eksik veriyi kesin hedef gibi kullanmaz.</div><a class="cta" href="v17-season-engine.html">Bu Paketle Antrenman Motoruna Geç →</a></div>'}function init(){let a=get('ybAth13');$('ath').innerHTML='<option value="">Sporcu seç</option>'+a.map(x=>'<option>'+x.name+'</option>').join('');['date','ath','event','course'].forEach(x=>$(x).onchange=render);render()}init()})();</script></body></html>
