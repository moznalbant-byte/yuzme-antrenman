<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Sezon ve Antrenman Planı</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1180px;margin:auto}.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px;padding:13px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid,.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpis{grid-template-columns:repeat(5,1fr)}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpi{text-align:center;background:#0c1827;border:1px solid #294058;border-radius:10px;padding:9px}.kpi b,.set b{display:block;color:#fde68a}.set{padding:10px 0;border-top:1px solid #294058}.why{background:#0b1625;border-left:3px solid #f97316;padding:10px;margin-top:8px}.nav a{display:inline-block;background:#17283b;color:white;text-decoration:none;padding:7px 9px;border-radius:8px;margin:2px}@media(max-width:700px){.grid,.kpis{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid,.kpis{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="card"><b><span class="orange">KUMSAL SPOR</span> • SEZON VE ANTRENMAN PLANI</b><div class="muted">Sporcu + kişisel en iyi derece (PB) + testler + CSS + antrenmana hazırlık + sezon fazı.</div><div class="nav"><a href="v18-performance-hub.html">Sporcu Performans Merkezi</a><a href="v18-exact-event-engine.html">Branş ve Yarış Planı</a><a href="v17-test-entry.html">Test ve Ölçüm Girişi</a><a href="v18-system-check.html">Sistem Kontrolü</a></div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date"></div><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>YARIŞ MESAFE PROFİLİ</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m Kısa Kulvar (SCM)</option><option value="50" selected>50m Uzun Kulvar (LCM)</option></select></div></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>(function(){const $=x=>document.getElementById(x),base={'50/100':3400,'100/200':4300,'200/400':5400,'400/800':6400,'800/1500':7400};function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON',.78,'Teknik + aerobik taban'];if(m===10)return['GENEL HAZIRLIK',.94,'Kapasite + teknik'];if(m===11)return['ÖZEL HAZIRLIK',1,'Eşik + güç + yarış temposu'];if(m===12&&n<8)return['YARIŞA ÖZGÜ I',.88,'Yarış modeli'];if(m===12&&n<15)return['YARIŞ ÖNCESİ AZALTMA I',.66,'Hacmi azalt, kaliteyi koru'];if(m===12)return['ZİRVE I',.52,'Zirve + toparlanma'];if(m===1)return['YENİDEN YÜKLEME',.72,'Yenilenme + yeniden yükleme'];if(m===2)return['GENEL HAZIRLIK II',.92,'Kapasite + kuvvet'];if(m===3)return['ÖZEL HAZIRLIK II',1,'Eşik + yarış temposu'];if(m===4)return['YARIŞA ÖZGÜ II',.9,'Ana yarış modeli'];if(m===5&&n<5)return['YARIŞ ÖNCESİ AZALTMA II',.64,'Ana taper'];if(m===5&&n<16)return['ZİRVE II',.48,'Ana yarış'];return['GELİŞİM / GEÇİŞ',.7,'Teknik + kapasite']}function micro(d){let s=new Date(2026,8,21,12),w=Math.floor((d-s)/604800000),i=((w%4)+4)%4;return[w+1,['YÜKLENME 1','YÜKLENME 2','YÜKLENME 3','HAFİFLETME'][i],[.94,1,1.06,.84][i]]}function goal(d){let day=d.getDay();if(day===2)return'Aerobik Ekonomi';if(day===3)return'Eşik / END2';if(day===4)return'Aerobik Güç / END3';if(day===5)return'Toparlanma / Teknik';if(day===6)return'Hız Dayanıklılığı';if(day===0)return'Yarış Temposu';return'DİNLENME'}function render(){if(!window.KSData){$('out').innerHTML='<div class="card">Ortak veri merkezi yüklenemedi.</div>';return}let d=new Date($('date').value+'T12:00:00'),n=$('ath').value,e=$('event').value,c=$('course').value,p=phase(d),m=micro(d),g=goal(d),well=KSData.latest(n,'wellness'),r=well&&well.derived?Number(well.derived.readiness):null,rf=r&&r<5?.82:r&&r<6.5?.92:1,vol=Math.round(base[e]*p[1]*m[2]*rf/50)*50,css=KSData.css(n,c),spr=KSData.latest(n,'sprint',c),ref=g==='Eşik / END2'?(css?KSData.fmt(css.sec100)+'/100m • CSS / Kritik Yüzme Hızı':'CSS testi gerekli'):g==='Hız Dayanıklılığı'?(spr&&spr.data&&spr.data.v25?'25m test '+spr.data.v25+' sn':'15/25/50m sprint testi gerekli'):'RPE / Algılanan Zorluk + teknik kalite + yarış PB’si';let sets=g==='DİNLENME'?[]:g==='Hız Dayanıklılığı'?[['4×(3×75)','SPR1 • hız dayanıklılığı • uzun dinlenme'],['8×50','A1 • kolay teknik toparlanma']]:g==='Eşik / END2'?[['3×(4×200)','END2 • eşik dayanıklılığı • 20sn • blok 2dk'],['6×300','Eşik; teknik sabit']]:g==='Yarış Temposu'?[['4×(4×50)','Yarış temposu (RP) • 20–30sn'],['8×100','Kolay toparlanma + dönüş çalışması']]:g==='Toparlanma / Teknik'?[['12×100','A1 • kolay yüzme / drill'],['8×50','Branş tekniği']]:g==='Aerobik Güç / END3'?[['4×(4×150)','END3 • aerobik güç'],['8×100','A3 → END3 kademeli']]:[['4×600','A2/A3 • aerobik ekonomi • 20sn'],['10×100','DPS / kulaç başına mesafe + tempo kontrol']];$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+p[0]+'</b>SEZON FAZI</div><div class="kpi"><b>HAFTA '+m[0]+'</b>'+m[1]+'</div><div class="kpi"><b>'+g+'</b>ANA AMAÇ</div><div class="kpi"><b>'+vol+'m</b>HEDEF HACİM</div><div class="kpi"><b>'+(r?r.toFixed(1):'—')+'</b>ANTRENMANA HAZIRLIK</div></div><div class="card"><b>'+n+' • '+e+'</b><div class="set"><b>Kişisel referans</b>'+ref+'</div>'+sets.map(x=>'<div class="set"><b>'+x[0]+'</b>'+x[1]+'</div>').join('')+'<div class="why">'+p[2]+' • '+m[1]+' • '+e+' profiline göre üretildi. '+(rf<1?'Antrenmana hazırlık verisi nedeniyle hacim %'+Math.round((1-rf)*100)+' azaltıldı.':'Hazırlık verisine bağlı hacim azaltması yok.')+' Nihai karar koçta.</div></div>'}function init(){if(!window.KSData){render();return}$('date').value=new Date().toISOString().slice(0,10);$('ath').innerHTML=KSData.roster().map(a=>'<option>'+a.name+'</option>').join('');['date','ath','event','course'].forEach(x=>$(x).onchange=render);render()}init()})();</script></body></html>
