<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Season Engine</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1180px;margin:auto}.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px;padding:13px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid,.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpis{grid-template-columns:repeat(5,1fr)}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpi{text-align:center;background:#0c1827;border:1px solid #294058;border-radius:10px;padding:9px}.kpi b,.set b{display:block;color:#fde68a}.set{padding:10px 0;border-top:1px solid #294058}.why{background:#0b1625;border-left:3px solid #f97316;padding:10px;margin-top:8px}.warn{border-left-color:#facc15}.nav a{display:inline-block;background:#17283b;color:white;text-decoration:none;padding:6px 8px;border-radius:8px;margin:2px}@media(max-width:700px){.grid,.kpis{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid,.kpis{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="card"><b><span class="orange">KUMSAL SPOR</span> • V18 UNIFIED SEASON ENGINE</b><div class="muted">Tek çekirdek: sporcu + PB + test + CSS + readiness + sezon fazı.</div><div class="nav"><a href="v18-performance-hub.html">Performance Hub</a><a href="v18-event-engine.html">Exact Event</a><a href="v17-test-entry.html">Test Girişi</a><a href="v18-system-check.html">Sistem Kontrol</a></div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date"></div><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>EVENT</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m SCM</option><option value="50" selected>50m LCM</option></select></div></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>(function(){const $=x=>document.getElementById(x),base={'50/100':3400,'100/200':4300,'200/400':5400,'400/800':6400,'800/1500':7400};function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON',.78,'Teknik + aerobik taban'];if(m===10)return['GENEL HAZIRLIK',.94,'Kapasite + teknik'];if(m===11)return['ÖZEL HAZIRLIK',1,'Threshold + power + race pace'];if(m===12&&n<8)return['RACE SPECIFIC I',.88,'Yarış modeli'];if(m===12&&n<15)return['TAPER I',.66,'Hacim azalt, kalite koru'];if(m===12)return['PEAK I',.52,'Zirve + toparlanma'];if(m===1)return['REBUILD',.72,'Yeniden yükleme'];if(m===2)return['GENEL HAZIRLIK II',.92,'Kapasite + kuvvet'];if(m===3)return['ÖZEL HAZIRLIK II',1,'Threshold + RP'];if(m===4)return['RACE SPECIFIC II',.9,'Ana yarış modeli'];if(m===5&&n<5)return['TAPER II',.64,'Ana taper'];if(m===5&&n<16)return['PEAK II',.48,'Ana yarış'];return['GELİŞİM/GEÇİŞ',.7,'Teknik + kapasite']}function micro(d){let s=new Date(2026,8,21,12),w=Math.floor((d-s)/604800000),i=((w%4)+4)%4;return[w+1,['BUILD 1','BUILD 2','BUILD 3','DELOAD'][i],[.94,1,1.06,.84][i]]}function goal(e,d){let day=d.getDay(),pm=d.getHours()>14;if(day===2)return pm?'Saf Hız':'Aerobik Ekonomi';if(day===3)return'Threshold / END2';if(day===4)return pm?'Race Pace':'Aerobik Güç / END3';if(day===5)return'Recovery / Teknik';if(day===6)return pm?'Speed Endurance':'Threshold / END2';if(day===0)return pm?'Race Pace':'Aerobik Ekonomi';return'OFF'}function render(){if(!window.KSData){$('out').innerHTML='<div class="card">DATA CORE yüklenemedi.</div>';return}let d=new Date($('date').value+'T12:00:00'),n=$('ath').value,e=$('event').value,c=$('course').value,p=phase(d),m=micro(d),g=goal(e,d),well=KSData.latest(n,'wellness'),r=well&&well.derived?Number(well.derived.readiness):null,rf=r&&r<5?.82:r&&r<6.5?.92:1,vol=Math.round(base[e]*p[1]*m[2]*rf/50)*50,css=KSData.css(n,c),spr=KSData.latest(n,'sprint',c),ref=g==='Threshold / END2'?(css?KSData.fmt(css.sec100)+'/100m':'CSS testi gerekli'):g==='Saf Hız'?(spr&&spr.data&&spr.data.v25?'25m test '+spr.data.v25+' sn':'15/25/50 sprint testi gerekli'):'RPE + teknik kalite + event PB';let sets=g==='OFF'?[]:g==='Saf Hız'?[['4×(6×25)','SPR2/3 • tam kalite • 90–120sn'],['8×50','A1 teknik reset']]:g==='Threshold / END2'?[['3×(4×200)','END2 • 20sn • blok 2dk'],['6×300','threshold, teknik sabit']]:g==='Race Pace'?[['4×(4×50)','RP split • 20–30sn'],['8×100','easy reset + dönüş']]:g==='Speed Endurance'?[['4×(3×75)','SPR1 • 90sn • blok 5dk'],['8×50','A1 reset']]:g==='Recovery / Teknik'?[['12×100','A1 drill/mixed'],['8×50','stroke skill']]:[['4×600','A2/A3 ekonomi • 20sn'],['10×100','DPS + tempo kontrol']];$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+p[0]+'</b>FAZ</div><div class="kpi"><b>W'+m[0]+'</b>'+m[1]+'</div><div class="kpi"><b>'+g+'</b>AMAÇ</div><div class="kpi"><b>'+vol+'m</b>HEDEF</div><div class="kpi"><b>'+(r?r.toFixed(1):'—')+'</b>READINESS</div></div><div class="card"><b>'+n+' • '+e+'</b><div class="set"><b>Kişisel referans</b>'+ref+'</div>'+sets.map(x=>'<div class="set"><b>'+x[0]+'</b>'+x[1]+'</div>').join('')+'<div class="why">'+p[2]+' • '+m[1]+' • '+e+' profiline göre üretildi. '+(rf<1?'Readiness nedeniyle hacim %'+Math.round((1-rf)*100)+' azaltıldı.':'Readiness azaltması yok.')+' Nihai karar koçta.</div></div>'}function init(){if(!window.KSData){render();return}$('date').value=new Date().toISOString().slice(0,10);$('ath').innerHTML=KSData.roster().map(a=>'<option>'+a.name+'</option>').join('');['date','ath','event','course'].forEach(x=>$(x).onchange=render);render()}init()})();</script></body></html>
