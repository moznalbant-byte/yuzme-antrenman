<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Sezon ve Birim Antrenman Planı</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1280px;margin:auto}.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px;padding:13px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid,.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpis{grid-template-columns:repeat(5,1fr)}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpi{text-align:center;background:#0c1827;border:1px solid #294058;border-radius:10px;padding:9px}.kpi b,.set b{display:block;color:#fde68a}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,.8fr);gap:10px}.set{padding:12px 0;border-top:1px solid #294058;line-height:1.5}.meter{float:right;background:#07111f;color:#fde68a;padding:4px 8px;border-radius:8px}.why{background:#0b1625;border-left:3px solid #f97316;padding:10px;margin-top:8px}.ok{border-left-color:#22c55e}.nav a{display:inline-block;background:#17283b;color:white;text-decoration:none;padding:7px 9px;border-radius:8px;margin:2px}.section{color:#fde68a;margin:0 0 8px}.tag{display:inline-block;background:#17283b;padding:4px 7px;border-radius:7px;margin:3px 2px;font-size:11px}.sum{font-size:26px;color:#fde68a;font-weight:900}.mini{padding:8px 0;border-top:1px solid #294058}.pres{font-weight:800;color:#fff}.target{color:#fbbf24}@media(max-width:850px){.layout{grid-template-columns:1fr}.grid,.kpis{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid,.kpis{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="card"><b><span class="orange">KUMSAL SPOR</span> • SEZON VE BİRİM ANTRENMAN PLANI</b><div class="muted">Hedef metraj önce belirlenir; tüm yüzme blokları bu metraja göre oluşturulur ve toplam otomatik doğrulanır.</div><div class="nav"><a href="v18-performance-hub.html">Sporcu Performans Merkezi</a><a href="v18-exact-event-engine.html">Branş ve Yarış Planı</a><a href="v17-test-entry.html">Test ve Ölçüm Girişi</a><a href="v18-system-check.html">Sistem Kontrolü</a></div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date"></div><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>YARIŞ MESAFE PROFİLİ</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m Kısa Kulvar (SCM)</option><option value="50" selected>50m Uzun Kulvar (LCM)</option></select></div><div class="box"><label>SEANS</label><select id="session"></select></div></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>(function(){const $=x=>document.getElementById(x),D=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],BASE={'50/100':3200,'100/200':4000,'200/400':4800,'400/800':5500,'800/1500':6200},W={Salı:{Sabah:'Aerobik Ekonomi',Akşam:'Saf Hız'},Çarşamba:{Tek:'Eşik / END2'},Perşembe:{Sabah:'Aerobik Güç / END3',Akşam:'Yarış Temposu'},Cuma:{Tek:'Toparlanma / Teknik'},Cumartesi:{Sabah:'Eşik / END2',Akşam:'Hız Dayanıklılığı'},Pazar:{Sabah:'Aerobik Ekonomi',Akşam:'Yarış Temposu'}};function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON',.78];if(m===10)return['GENEL HAZIRLIK',.94];if(m===11)return['ÖZEL HAZIRLIK',1];if(m===12&&n<8)return['YARIŞA ÖZGÜ I',.88];if(m===12&&n<15)return['YARIŞ ÖNCESİ AZALTMA I',.66];if(m===12)return['ZİRVE I',.52];if(m===1)return['YENİDEN YÜKLEME',.72];if(m===2)return['GENEL HAZIRLIK II',.92];if(m===3)return['ÖZEL HAZIRLIK II',1];if(m===4)return['YARIŞA ÖZGÜ II',.9];if(m===5&&n<5)return['YARIŞ ÖNCESİ AZALTMA II',.64];if(m===5&&n<16)return['ZİRVE II',.48];return['GELİŞİM / GEÇİŞ',.7]}function micro(d){let s=new Date(2026,8,21,12),w=Math.floor((d-s)/604800000),i=((w%4)+4)%4;return[w+1,['YÜKLENME 1','YÜKLENME 2','YÜKLENME 3','HAFİFLETME'][i],[.94,1,1.06,.84][i]]}function sessions(){let d=new Date($('date').value+'T12:00:00'),day=D[d.getDay()],x=W[day]?Object.keys(W[day]):[];$('session').innerHTML=x.length?x.map(v=>'<option>'+v+'</option>').join(''):'<option>DİNLENME</option>'}function rnd50(x){return Math.max(50,Math.round(x/50)*50)}function allocate(target,goal){let pct=goal==='Saf Hız'||goal==='Hız Dayanıklılığı'?[.18,.14,.25,.18,.15,.10]:goal==='Yarış Temposu'?[.16,.12,.30,.17,.15,.10]:goal==='Toparlanma / Teknik'?[.22,.24,.20,.12,.10,.12]:[.15,.12,.42,.13,.10,.08],a=pct.map(v=>rnd50(target*v)),sum=a.reduce((s,v)=>s+v,0);a[2]+=target-sum;return a}function exactSet(m,kind,event){let unit=kind==='warm'?100:kind==='tech'?50:kind==='skill'?25:kind==='main'?(event==='50/100'?50:event==='100/200'?100:event==='200/400'?100:200):100;if(m%unit!==0)unit=50;let reps=Math.max(1,Math.round(m/unit));return reps+'×'+unit}function strokeTech(st){return st==='Kurbağalama'?'pullout, dar kick, kayma-zamanlama':st==='Kelebek'?'undulation, ikinci kick, nefes ritmi':st==='Sırtüstü'?'streamline, rotasyon, sualtı çıkışı':st==='Bireysel Karışık'?'geçişler, yasal dönüşler, zayıf branş': 'streamline, catch, yüksek dirsek, DPS ve dönüş'}function paceData(n,st,c,e,goal){let css=KSData.css(n,c),dist=e==='50/100'?100:e==='100/200'?200:e==='200/400'?200:e==='400/800'?400:800,pb=KSData.pb(n,st,c,dist),p50=KSData.pb(n,st,c,50);if(goal==='Eşik / END2'&&css)return{main:KSData.fmt(css.sec100)+'/100m',sub:'CSS • Kritik Yüzme Hızı'};if(goal==='Yarış Temposu'&&pb&&pb.verified)return{main:KSData.fmt(pb.time/(dist/50))+'/50m',sub:'Doğrulanmış '+dist+'m PB üzerinden'};if((goal==='Saf Hız'||goal==='Hız Dayanıklılığı')&&p50&&p50.verified)return{main:KSData.fmt(p50.time/2)+' civarı /25m',sub:'50m PB başlangıç referansı; sprint testiyle güncellenmeli'};return{main:'RPE + teknik kalite',sub:'Güncel kişisel test verisi eksik'}}function make(target,goal,st,e,n,c){let a=allocate(target,goal),p=paceData(n,st,c,e,goal),tech=strokeTech(st),mainText=goal==='Eşik / END2'?'END2 • kontrollü eşik; son tekrara kadar tempo sabit':goal==='Aerobik Güç / END3'?'END3 • güçlü aerobik; teknik bozulmadan':goal==='Saf Hız'?'SPR2/SPR3 • %95+ kalite; hız düşerse set kesilir':goal==='Hız Dayanıklılığı'?'SPR1 • yarış hızını tekrarlar boyunca koru':goal==='Yarış Temposu'?'RP • hedef yarış splitlerini prova et':goal==='Toparlanma / Teknik'?'A1 • çok rahat; teknik yeniden düzenleme':'A2/A3 • aerobik ekonomi; negatif split';let blocks=[{name:'SU ISINMASI',m:a[0],rx:exactSet(a[0],'warm',e),txt:'A1 kolay + karışık stil + son tekrarlar kademeli.',rest:'10–15sn',rpe:'2–3',pace:'Rahat / konuşabilir tempo'},{name:'TEKNİK + HAZIRLIK',m:a[1],rx:exactSet(a[1],'tech',e),txt:tech+'. Drill/swim dönüşümlü.',rest:'15–20sn',rpe:'3–4',pace:'Teknik kalite öncelikli'},{name:'ANA SET',m:a[2],rx:exactSet(a[2],'main',e),txt:mainText,rest:goal==='Saf Hız'?'75–120sn':goal==='Hız Dayanıklılığı'?'45–75sn':goal==='Yarış Temposu'?'30–60sn':'15–25sn',rpe:goal==='Saf Hız'||goal==='Hız Dayanıklılığı'?'8–9':goal==='Yarış Temposu'?'7–9':goal==='Toparlanma / Teknik'?'2–4':'6–7',pace:p.main},{name:'İKİNCİL SET • KICK/PULL',m:a[3],rx:exactSet(a[3],'secondary',e),txt:(goal==='Saf Hız'||goal==='Hız Dayanıklılığı'?'Kolay yüzme + kaliteli kick; hız blokları arasında toparlanma.':'Pull/swim + kick dönüşümlü; branşa özel kuvvet ve ekonomi.'),rest:'15–25sn',rpe:'4–6',pace:'Ana amaca destek'},{name:'YARIŞ BECERİSİ / TEKNİK KALİTE',m:a[4],rx:exactSet(a[4],'skill',e),txt:st==='Kurbağalama'?'Start + pullout + dönüş çıkışı + finish':st==='Kelebek'?'Start + sualtı dolphin + breakout + dönüş':st==='Sırtüstü'?'Sırt startı + sualtı + breakout + dönüş':st==='Bireysel Karışık'?'Start + branş geçişleri + dönüşler + finish':'Start + streamline + breakout + dönüş + finish',rest:'30–60sn / kaliteye göre',rpe:'5–8',pace:'Her tekrar teknik olarak temiz'},{name:'SOĞUMA',m:a[5],rx:exactSet(a[5],'cool',e),txt:'A1 çok kolay + uzun kulaç + nefes kontrolü.',rest:'çok kısa / serbest',rpe:'1–2',pace:'Çok rahat'}];return{blocks,p}}function render(){if(!window.KSData){$('out').innerHTML='<div class="card">Ortak veri merkezi yüklenemedi.</div>';return}let d=new Date($('date').value+'T12:00:00'),day=D[d.getDay()],ses=$('session').value,n=$('ath').value,e=$('event').value,st=$('stroke').value,c=$('course').value,p=phase(d),m=micro(d),goal=W[day]&&W[day][ses];if(!goal){$('out').innerHTML='<div class="card"><h3 class="section">'+day+' • DİNLENME</h3><div class="why">Planlı toparlanma günü. Birim antrenman yok.</div></div>';return}let well=KSData.latest(n,'wellness'),r=well&&well.derived?Number(well.derived.readiness):null,rf=r&&r<5?.82:r&&r<6.5?.92:1,target=rnd50(BASE[e]*p[1]*m[2]*rf),plan=make(target,goal,st,e,n,c),actual=plan.blocks.reduce((s,b)=>s+b.m,0),valid=actual===target;let html=plan.blocks.map((b,i)=>'<div class="set"><b>'+(i+2)+'. '+b.name+' • '+b.rx+' <span class="meter">'+b.m+'m</span></b><div class="pres">'+b.txt+'</div><span class="tag">Dinlenme: '+b.rest+'</span><span class="tag">RPE: '+b.rpe+'</span><span class="tag target">Hedef: '+b.pace+'</span></div>').join('');$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+p[0]+'</b>SEZON FAZI</div><div class="kpi"><b>HAFTA '+m[0]+'</b>'+m[1]+'</div><div class="kpi"><b>'+day+' '+ses+'</b>SEANS</div><div class="kpi"><b>'+goal+'</b>ANA AMAÇ</div><div class="kpi"><b>'+target+'m</b>HEDEF = GERÇEK</div></div><div class="layout"><div class="card"><h3 class="section">TAM BİRİM ANTRENMAN • '+n+'</h3><div class="muted">'+st+' • '+e+' • '+c+'m havuz • kişisel ana referans: '+plan.p.main+'</div><div class="set"><b>1. KARA ISINMASI • 15–20 dk</b>Omuz aktivasyonu + core + lastik rotator cuff + mobilite. Bu bölüm havuz metresine dahil değildir.</div>'+html+'<div class="why '+(valid?'ok':'')+'"><b>Metraj kontrolü:</b> Planlanan '+target+'m • blok toplamı '+actual+'m • '+(valid?'✓ TAM EŞLEŞTİ':'⚠ HATA')+'.</div></div><div class="card"><h3 class="section">ANTRENMAN ÖZETİ</h3><div class="sum">'+actual+'m</div><div class="mini"><b>Ana amaç:</b><br>'+goal+'</div><div class="mini"><b>Kişisel tempo:</b><br>'+plan.p.main+'<br><span class="muted">'+plan.p.sub+'</span></div><div class="mini"><b>Branş:</b><br>'+st+' • '+e+'</div><div class="mini"><b>Antrenmana hazırlık:</b><br>'+(r?r.toFixed(1):'Veri yok')+(rf<1?' • hacim %'+Math.round((1-rf)*100)+' azaltıldı':'')+'</div><div class="mini"><b>Kullanılan kavramlar:</b><br><span class="tag">A1/A2/A3</span><span class="tag">END2/END3</span><span class="tag">SPR</span><span class="tag">RP</span><span class="tag">RPE</span></div><div class="why"><b>Koç notu:</b> Ana sette iki ardışık tekrarda belirgin tempo kaybı veya teknik bozulma varsa dinlenmeyi artır ya da kalite bloğunu kısalt. Nihai karar koçta.</div></div></div>'}function init(){if(!window.KSData){render();return}$('date').value=new Date().toISOString().slice(0,10);$('ath').innerHTML=KSData.roster().map(a=>'<option>'+a.name+'</option>').join('');$('date').onchange=()=>{sessions();render()};['ath','event','stroke','course','session'].forEach(x=>$(x).onchange=render);sessions();render()}init()})();</script></body></html>
