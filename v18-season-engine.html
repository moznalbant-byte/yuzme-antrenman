<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V18 Sezon ve Birim Antrenman Planı</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#07111f;color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1180px;margin:auto}.card,.box{background:#101d2d;border:1px solid #294058;border-radius:14px;padding:13px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid,.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpis{grid-template-columns:repeat(5,1fr)}label{display:block;font-size:10px;color:#9fb0c2;font-weight:900;margin-bottom:5px}select,input{width:100%;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:800}.kpi{text-align:center;background:#0c1827;border:1px solid #294058;border-radius:10px;padding:9px}.kpi b,.set b{display:block;color:#fde68a}.set{padding:11px 0;border-top:1px solid #294058;line-height:1.5}.meter{float:right;background:#07111f;color:#fde68a;padding:4px 8px;border-radius:8px}.why{background:#0b1625;border-left:3px solid #f97316;padding:10px;margin-top:8px}.nav a{display:inline-block;background:#17283b;color:white;text-decoration:none;padding:7px 9px;border-radius:8px;margin:2px}.section{color:#fde68a;margin:0 0 8px}.tag{display:inline-block;background:#17283b;padding:4px 7px;border-radius:7px;margin:2px;font-size:11px}@media(max-width:700px){.grid,.kpis{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid,.kpis{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="card"><b><span class="orange">KUMSAL SPOR</span> • SEZON VE BİRİM ANTRENMAN PLANI</b><div class="muted">Tarihi ve seansı seç: o güne ait tam birim antrenmanı ısınmadan soğumaya kadar gör.</div><div class="nav"><a href="v18-performance-hub.html">Sporcu Performans Merkezi</a><a href="v18-exact-event-engine.html">Branş ve Yarış Planı</a><a href="v17-test-entry.html">Test ve Ölçüm Girişi</a><a href="v18-system-check.html">Sistem Kontrolü</a></div></div><div class="grid"><div class="box"><label>TARİH</label><input id="date" type="date"></div><div class="box"><label>SPORCU</label><select id="ath"></select></div><div class="box"><label>YARIŞ MESAFE PROFİLİ</label><select id="event"><option>50/100</option><option>100/200</option><option selected>200/400</option><option>400/800</option><option>800/1500</option></select></div><div class="box"><label>BRANŞ</label><select id="stroke"><option>Serbest</option><option>Sırtüstü</option><option>Kurbağalama</option><option>Kelebek</option><option>Bireysel Karışık</option></select></div><div class="box"><label>HAVUZ</label><select id="course"><option value="25">25m Kısa Kulvar (SCM)</option><option value="50" selected>50m Uzun Kulvar (LCM)</option></select></div><div class="box"><label>SEANS</label><select id="session"></select></div></div><div id="out"></div></div><script src="v18-data-core.js"></script><script>(function(){const $=x=>document.getElementById(x),D=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],BASE={'50/100':3200,'100/200':4000,'200/400':4800,'400/800':5500,'800/1500':6200},W={Salı:{Sabah:'Aerobik Ekonomi',Akşam:'Saf Hız'},Çarşamba:{Tek:'Eşik / END2'},Perşembe:{Sabah:'Aerobik Güç / END3',Akşam:'Yarış Temposu'},Cuma:{Tek:'Toparlanma / Teknik'},Cumartesi:{Sabah:'Eşik / END2',Akşam:'Hız Dayanıklılığı'},Pazar:{Sabah:'Aerobik Ekonomi',Akşam:'Yarış Temposu'}};function phase(d){let m=d.getMonth()+1,n=d.getDate();if(m===9)return['ADAPTASYON',.78];if(m===10)return['GENEL HAZIRLIK',.94];if(m===11)return['ÖZEL HAZIRLIK',1];if(m===12&&n<8)return['YARIŞA ÖZGÜ I',.88];if(m===12&&n<15)return['YARIŞ ÖNCESİ AZALTMA I',.66];if(m===12)return['ZİRVE I',.52];if(m===1)return['YENİDEN YÜKLEME',.72];if(m===2)return['GENEL HAZIRLIK II',.92];if(m===3)return['ÖZEL HAZIRLIK II',1];if(m===4)return['YARIŞA ÖZGÜ II',.9];if(m===5&&n<5)return['YARIŞ ÖNCESİ AZALTMA II',.64];if(m===5&&n<16)return['ZİRVE II',.48];return['GELİŞİM / GEÇİŞ',.7]}function micro(d){let s=new Date(2026,8,21,12),w=Math.floor((d-s)/604800000),i=((w%4)+4)%4;return[w+1,['YÜKLENME 1','YÜKLENME 2','YÜKLENME 3','HAFİFLETME'][i],[.94,1,1.06,.84][i]]}function sessions(){let d=new Date($('date').value+'T12:00:00'),day=D[d.getDay()],x=W[day]?Object.keys(W[day]):[];$('session').innerHTML=x.length?x.map(v=>'<option>'+v+'</option>').join(''):'<option>DİNLENME</option>'}function blocks(goal,st,e){let tech=st==='Kurbağalama'?'pullout + zamanlama + dar kick':st==='Kelebek'?'undulation + ikinci kick + nefes ritmi':st==='Sırtüstü'?'streamline + rotasyon + sualtı':st==='Bireysel Karışık'?'geçişler + yasal dönüşler + zayıf branş':'streamline + catch + DPS + dönüş';let main=goal==='Saf Hız'?[['4×(6×25)','SPR2/SPR3 • %95+ hız • tam teknik kalite','90–120sn',600],['6×15m','Start + breakout / su üstüne çıkış','tam dinlenme',90]]:goal==='Hız Dayanıklılığı'?[['4×(3×75)','SPR1 • yarış hızını koru','90sn • blok 5dk',900],['6×50','Son 15m finish kalitesi','60sn',300]]:goal==='Eşik / END2'?[['3×(4×200)','END2 • eşik dayanıklılığı • tempo sabit','20sn • blok 2dk',2400],['4×200','Negatif split','25sn',800]]:goal==='Aerobik Güç / END3'?[['4×(4×150)','END3 • güçlü ama kontrollü','30sn • blok 3dk',2400],['8×100','A3→END3 kademeli','20sn',800]]:goal==='Yarış Temposu'?[['4×(4×50)','RP / Yarış Temposu • hedef split','30sn • blok 3dk',800],['4×100','Broken yarış modeli','2dk',400],['6×15m','Start/dönüş/breakout','tam dinlenme',90]]:goal==='Toparlanma / Teknik'?[['12×100','A1 • kolay • drill/swim','15sn',1200],['8×50',tech,'20sn',400]]:[['4×600','A2 • aerobik ekonomi • negatif split','20sn',2400],['10×100','DPS + kulaç ritmi','15sn',1000]];return{tech,main}}function render(){if(!window.KSData){$('out').innerHTML='<div class="card">Ortak veri merkezi yüklenemedi.</div>';return}let d=new Date($('date').value+'T12:00:00'),day=D[d.getDay()],ses=$('session').value,n=$('ath').value,e=$('event').value,st=$('stroke').value,c=$('course').value,p=phase(d),m=micro(d),goal=W[day]&&W[day][ses];if(!goal){$('out').innerHTML='<div class="card"><h3 class="section">'+day+' • DİNLENME</h3><div class="why">Planlı toparlanma günü. Birim antrenman yok.</div></div>';return}let well=KSData.latest(n,'wellness'),r=well&&well.derived?Number(well.derived.readiness):null,rf=r&&r<5?.82:r&&r<6.5?.92:1,target=Math.round(BASE[e]*p[1]*m[2]*rf/50)*50,b=blocks(goal,st,e),css=KSData.css(n,c),dist=e==='50/100'?100:e==='100/200'?200:e==='200/400'?200:e==='400/800'?400:800,pb=KSData.pb(n,st,c,dist),pace=goal==='Eşik / END2'&&css?KSData.fmt(css.sec100)+'/100m':goal==='Yarış Temposu'&&pb&&pb.verified?KSData.fmt(pb.time/(dist/50))+'/50m':'RPE ve teknik kalite ile kontrol',warm=Math.round(target*.15/50)*50,tech=Math.round(target*.12/50)*50,cool=Math.max(200,Math.round(target*.08/50)*50),mainMeters=b.main.reduce((s,x)=>s+x[3],0),used=warm+tech+cool+mainMeters,extra=Math.max(0,target-used);$('out').innerHTML='<div class="kpis"><div class="kpi"><b>'+p[0]+'</b>SEZON FAZI</div><div class="kpi"><b>HAFTA '+m[0]+'</b>'+m[1]+'</div><div class="kpi"><b>'+day+' '+ses+'</b>SEANS</div><div class="kpi"><b>'+goal+'</b>ANA AMAÇ</div><div class="kpi"><b>'+target+'m</b>HEDEF HACİM</div></div><div class="card"><h3 class="section">TAM BİRİM ANTRENMAN • '+n+'</h3><div class="muted">'+st+' • '+e+' • '+c+'m havuz • Hedef tempo: '+pace+'</div><div class="set"><b>1. KARA ISINMASI • 15–20 dk</b>Omuz aktivasyonu + core + lastik rotator cuff + mobilite. Ağrı varsa yükleme yapılmaz.</div><div class="set"><b>2. SU ISINMASI <span class="meter">'+warm+'m</span></b>A1 kolay yüzme + karışık stil + kademeli hızlanma. RPE 2–3.</div><div class="set"><b>3. TEKNİK / HAZIRLIK <span class="meter">'+tech+'m</span></b>'+b.tech+'. Teknik kalite bozulmadan ana sete hazırlan.</div>'+b.main.map((x,i)=>'<div class="set"><b>'+(i===0?'4. ANA SET':'EK KALİTE BLOĞU')+' • '+x[0]+' <span class="meter">'+x[3]+'m</span></b>'+x[1]+'<br><span class="tag">Dinlenme: '+x[2]+'</span></div>').join('')+(extra?'<div class="set"><b>5. DESTEK SETİ <span class="meter">'+extra+'m</span></b>'+(goal==='Saf Hız'||goal==='Hız Dayanıklılığı'?'A1/A2 kolay yüzme + teknik reset. Yüksek kalite blokları arasındaki toparlanmayı destekler.':'A2 pull/swim + kick dönüşümlü. Teknik ve aerobik hacmi tamamlar.')+'</div>':'')+'<div class="set"><b>6. SOĞUMA <span class="meter">'+cool+'m</span></b>A1 çok kolay + uzun kulaç + nefes kontrolü. RPE 1–2.</div><div class="why"><b>Koç notu:</b> Bu seansın ana amacı '+goal+'. '+(r?'Antrenmana hazırlık skoru '+r.toFixed(1)+'. ':'Hazırlık verisi girilmemiş. ')+(rf<1?'Bu nedenle hedef hacim %'+Math.round((1-rf)*100)+' azaltıldı. ':'Otomatik hacim azaltması yok. ')+'Ana sette 2 ardışık tekrarda belirgin tempo/teknik kaybı görülürse dinlenmeyi artır veya seti kısalt.</div></div>'}function init(){if(!window.KSData){render();return}$('date').value=new Date().toISOString().slice(0,10);$('ath').innerHTML=KSData.roster().map(a=>'<option>'+a.name+'</option>').join('');$('date').onchange=()=>{sessions();render()};['ath','event','stroke','course','session'].forEach(x=>$(x).onchange=render);sessions();render()}init()})();</script></body></html>
