<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V21 Günün Antrenmanı</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1150px;margin:auto;padding:12px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:9px 0}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.setup{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.setup select{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:900}.btn{border:0;border-radius:12px;padding:13px;color:#fff;background:#17283b;font-weight:950}.primary{background:#f97316}.green{background:#16a34a}.hero{border:2px solid #f97316}.badge{display:inline-block;background:#17283b;border-radius:999px;padding:7px 10px;margin:3px;font-weight:900}.period{background:#12351e;border:1px solid #22c55e}.courseInfo{background:#0d2b45;border:1px solid #38bdf8}.groupInfo{background:#312e81;border:1px solid #818cf8}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:90px 1.2fr .8fr .8fr;gap:8px;align-items:center;background:#081421;border-radius:13px;padding:10px}.set .big{font-size:22px;font-weight:950;color:#fde68a}.athletes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.ath{background:#081421;border-radius:11px;padding:10px}.target{background:#081421;border-radius:12px;padding:10px;margin:6px 0}.targetgrid{display:grid;grid-template-columns:1.1fr 1fr .8fr .8fr;gap:6px;margin-top:6px}.yellow{color:#fde68a;font-weight:950}.cyan{color:#7dd3fc;font-weight:900}.footerbar{position:sticky;bottom:8px;background:#101d2d;border:1px solid #294058;border-radius:15px;padding:9px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:760px){.setup{grid-template-columns:1fr 1fr}.set{grid-template-columns:70px 1fr}.set>:nth-child(3),.set>:nth-child(4){grid-column:2}.targetgrid{grid-template-columns:1fr 1fr}.athletes{grid-template-columns:1fr}.footerbar{grid-template-columns:1fr}}</style></head><body><div class="app"><b><span class="orange">KUMSAL SPOR</span> • V21 GÜNÜN ANTRENMANI</b><div id="periodCard" class="card period" style="display:none"></div><div id="groupCard" class="card groupInfo" style="display:none"></div><div id="courseCard" class="card courseInfo"></div><div class="card hero"><h1>Bugünün Birim Antrenmanını Oluştur</h1><div class="setup"><label>Yaş Grubu<select id="age"><option>8–10 Yaş</option><option selected>13–16 Yaş</option><option>Yetişkin</option></select></label><label>Profil<select id="profile"><option>Kısa Mesafe</option><option selected>Orta Mesafe</option><option>Uzun Mesafe</option><option>Branşçı</option></select></label><label>Havuz<select id="pool"><option>25 m</option><option selected>50 m</option></select></label><label>Seans<select id="session"><option>Salı Sabah</option><option selected>Salı Akşam</option><option>Çarşamba</option><option>Perşembe Sabah</option><option>Perşembe Akşam</option><option>Cuma</option><option>Cumartesi Sabah</option><option>Cumartesi Akşam</option><option>Pazar Sabah</option><option>Pazar Akşam</option></select></label></div><button id="generate" class="btn primary" style="width:100%;margin-top:9px">⚡ GÜNÜN ANTRENMANINI OLUŞTUR</button></div><div class="card"><b>Seans Özeti</b><div id="badges" style="margin-top:8px"></div><div id="purpose" style="margin-top:10px"></div></div><div class="card"><b>Grup Sporcuları</b><div class="muted">Kalıcı gruptan otomatik gelebilir; gerekirse bu seans için kişi ekleyip çıkarabilirsin.</div><div id="athletes" class="athletes" style="margin-top:8px"></div></div><div class="card"><b>Birim Antrenman</b><div id="sets" class="sets" style="margin-top:8px"></div></div><div class="card"><b>Kişisel Hedef Önizleme</b><select id="previewSet" style="margin:8px 0;padding:10px;border:0;border-radius:9px;background:#fff4bf;font-weight:900"></select><div id="targets"></div></div><div class="footerbar"><button class="btn" onclick="location.href='v23-periodization-engine.html'">← PERİYOTLAMA</button><button class="btn" onclick="location.href='v24-group-manager.html'">GRUPLAR</button><button id="startLive" class="btn green">▶ CANLI BAŞLAT</button></div></div><script src="v18-data-core.js"></script><script>const $=x=>document.getElementById(x);let selected=[],workout=[],period=null,activeGroup=null,sessionContext=null;const zoneInfo={A1:'Kolay aerobik / teknik kalite',A2:'Aerobik kapasite',A3:'Üst aerobik',END2:'Eşik / CSS odaklı',END3:'Yüksek aerobik güç',SPR1:'Hız',SPR2:'Maksimum hız / tam kalite',SPR3:'Sprint dayanıklılığı',RP:'Yarış temposu',Teknik:'Teknik beceri'};try{period=JSON.parse(localStorage.getItem('ks_periodization')||'null')}catch(e){}try{activeGroup=JSON.parse(localStorage.getItem('ks_active_group')||'null')}catch(e){}const plans={sprint:[{r:8,d:50,z:'A1',s:'Serbest',send:70,p:'Teknik ısınma'},{r:8,d:25,z:'SPR2',s:'Serbest',send:75,p:'Maksimum kalite'},{r:6,d:50,z:'RP',s:'Yarış temposu',send:120,p:'Hedef split'},{r:6,d:100,z:'A1',s:'Karışık',send:120,p:'Toparlanma'}],middle:[{r:8,d:100,z:'A1',s:'Serbest',send:105,p:'Teknik + aerobik'},{r:8,d:50,z:'Teknik',s:'Drill/Swim',send:75,p:'DPS / çizgi'},{r:10,d:150,z:'END2',s:'Serbest',send:150,p:'CSS / eşik'},{r:6,d:50,z:'RP',s:'Yarış temposu',send:120,p:'Hedef split'},{r:4,d:100,z:'A1',s:'Karışık',send:120,p:'Toparlanma'}],distance:[{r:10,d:100,z:'A1',s:'Serbest',send:105,p:'Ekonomik yüzüş'},{r:6,d:200,z:'A2',s:'Serbest',send:210,p:'Aerobik dayanıklılık'},{r:4,d:400,z:'END2',s:'Serbest',send:390,p:'Eşik kontrolü'},{r:6,d:100,z:'A1',s:'Karışık',send:120,p:'Toparlanma'}],stroke:[{r:8,d:50,z:'Teknik',s:'Branş',send:80,p:'Teknik kalite'},{r:8,d:100,z:'A2',s:'Branş',send:130,p:'Branş dayanıklılığı'},{r:8,d:50,z:'RP',s:'Branş',send:120,p:'Yarış ritmi'},{r:6,d:100,z:'A1',s:'Serbest',send:120,p:'Toparlanma'}]};function key(){let p=$('profile').value;return p.includes('Kısa')?'sprint':p.includes('Orta')?'middle':p.includes('Uzun')?'distance':'stroke'}function course(){return $('pool').value.includes('25')?'25':'50'}function fmt(s){if(!isFinite(s))return'—';let m=Math.floor(s/60),x=s-m*60;return m+':'+x.toFixed(1).padStart(4,'0')}function generate(){let load=period?.load||1;workout=plans[key()].map(x=>({...x,r:Math.max(2,Math.round(x.r*load))}));if($('age').value.includes('8–10'))workout=workout.map(x=>({...x,r:Math.max(4,Math.round(x.r*.7)),d:Math.min(x.d,200)}));if(period?.phase?.includes('Taper'))workout=workout.map(x=>({...x,r:Math.max(2,Math.round(x.r*.75))}));render()}function roster(){let r=window.KSData?KSData.roster():[];$('athletes').innerHTML=r.map(a=>'<label class="ath"><input type="checkbox" value="'+a.name+'" '+(selected.includes(a.name)?'checked':'')+'> <b>'+a.name+'</b></label>').join('');document.querySelectorAll('#athletes input').forEach(x=>x.onchange=()=>{if(x.checked&&!selected.includes(x.value))selected.push(x.value);if(!x.checked)selected=selected.filter(n=>n!==x.value);renderTargets()})}function targetFor(n,q){let c=course(),stroke=(q.s==='Yarış temposu'||q.s==='Drill/Swim'||q.s==='Karışık')?'Serbest':q.s,b=window.KSData?.targetBase?KSData.targetBase(n,stroke,c,q.d):null;if(!b)return null;let m={A1:1.24,A2:1.17,A3:1.10,END2:1.06,END3:1.03,SPR1:.99,SPR2:.96,SPR3:.94,RP:1,Teknik:1.30}[q.z]||1.12,t=b.time*m;return{lo:t*.985,hi:t*1.015,t,restLo:Math.max(0,q.send-t*1.015),restHi:Math.max(0,q.send-t*.985),source:b.source,unverified:b.unverified}}function buildTargets(){let out={};workout.forEach((q,i)=>{out[i]={};selected.forEach(n=>{let t=targetFor(n,q);if(t)out[i][n]=t})});return out}function validateWorkout(){return workout.map((q,i)=>{let issues=[];if(q.z==='SPR2'&&q.send<60)issues.push('Sprint kalitesi için dinlenme kısa olabilir');if(q.z==='RP'&&q.send<=q.d)issues.push('Yarış temposunda çıkış süresini kontrol et');if(q.z==='END2'&&q.d<100)issues.push('Eşik seti için tekrar mesafesi kısa');if(q.z==='A1'&&q.send<60&&q.d>=100)issues.push('A1 için çıkış agresif olabilir');return{set:i+1,issues}}).filter(x=>x.issues.length)}function render(){let total=workout.reduce((a,x)=>a+x.r*x.d,0),c=course();$('courseCard').innerHTML='<b>🏊 '+c+' m HAVUZ HEDEF MOTORU AKTİF</b><br><span class="muted">PB ve CSS seçilen havuzdan aranır.</span>';$('badges').innerHTML=['Yaş: '+$('age').value,'Profil: '+$('profile').value,'Havuz: '+c+' m','Seans: '+$('session').value,'Toplam: '+total+' m','Sporcu: '+selected.length].map(x=>'<span class="badge">'+x+'</span>').join('');let checks=validateWorkout();$('purpose').innerHTML='<b>Ana amaç:</b> '+(period?period.focus:'Profil bazlı antrenman')+(period?' • <span class="yellow">'+period.phase+'</span>':'')+'<br><span class="muted">Bölge açıklaması: '+[...new Set(workout.map(q=>q.z))].map(z=>z+' = '+(zoneInfo[z]||'Özel set')).join(' • ')+'</span>'+(checks.length?'<br><span style="color:#fca5a5"><b>Koç kontrolü:</b> '+checks.map(x=>'Set '+x.set+': '+x.issues.join(', ')).join(' • ')+'</span>':'<br><span style="color:#86efac"><b>Koç kontrolü:</b> belirgin yapısal uyarı yok.</span>');$('sets').innerHTML=workout.map((q,i)=>'<div class="set"><div class="big">SET '+(i+1)+'</div><div><b>'+q.r+' × '+q.d+' m • '+q.z+' • '+q.s+'</b><br><span class="muted">'+q.p+'</span></div><div><span class="muted">ÇIKIŞ</span><br><b>'+fmt(q.send)+'</b></div><div><span class="muted">METRAJ</span><br><b>'+q.r*q.d+' m</b></div></div>').join('');$('previewSet').innerHTML=workout.map((q,i)=>'<option value="'+i+'">Set '+(i+1)+' • '+q.r+'×'+q.d+' '+q.z+'</option>').join('');renderTargets()}function renderTargets(){if(!workout.length)return;let q=workout[+$('previewSet').value||0];$('targets').innerHTML=selected.length?selected.map(n=>{let t=targetFor(n,q);return'<div class="target"><b>'+n+'</b><div class="targetgrid"><div>'+q.r+'×'+q.d+' '+q.z+'</div><div class="yellow">'+(t?fmt(t.lo)+'–'+fmt(t.hi):'Bu havuzda veri yok')+'</div><div>Dinl. '+(t?fmt(Math.max(0,q.send-t.t)):'—')+'</div><div class="cyan">'+(t?t.source:'Test gerekli')+'</div></div></div>'}).join(''):'<span class="muted">Sporcu seçince kişisel hedefler görünür.</span>'}if(period){$('periodCard').style.display='block';$('periodCard').innerHTML='<b>✓ V23 PERİYOTLAMA AKTİF</b><br><span class="muted">'+period.phase+' • '+period.focus+' • Yarışa '+period.weeksToRace+' hf • Yük '+period.load.toFixed(2)+'</span>';$('age').value=period.age;$('profile').value=period.profile}if(activeGroup){$('groupCard').style.display='block';$('groupCard').innerHTML='<b>👥 AKTİF GRUP: '+activeGroup.name+'</b><br><span class="muted">'+activeGroup.members.length+' sporcu • '+activeGroup.age+' • '+activeGroup.profile+' • '+activeGroup.pool+'</span>';selected=[...activeGroup.members];$('age').value=activeGroup.age;$('profile').value=activeGroup.profile;$('pool').value=activeGroup.pool}$('generate').onclick=generate;$('previewSet').onchange=renderTargets;$('startLive').onclick=()=>{localStorage.setItem('ks_v21_workout',JSON.stringify({schemaVersion:2,created:Date.now(),group:activeGroup?{id:activeGroup.id,name:activeGroup.name}:null,age:$('age').value,profile:$('profile').value,pool:$('pool').value,course:course(),session:$('session').value,periodization:period,athletes:selected,sets:workout,targets:buildTargets()}));location.href='v34-device-home.html'};['age','profile','pool','session'].forEach(id=>$(id).onchange=generate);roster();generate();</script></body></html>
