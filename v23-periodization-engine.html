<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V23 Periyotlama Motoru</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1150px;margin:auto;padding:12px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:9px 0}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.hero{border:2px solid #f97316}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid input,.grid select{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:900}.badge{display:inline-block;background:#17283b;border-radius:999px;padding:7px 10px;margin:3px;font-weight:900}.phase{display:grid;grid-template-columns:140px 1fr 120px;gap:8px;background:#081421;border-radius:12px;padding:11px;margin:7px 0;align-items:center}.phase.active{border:2px solid #f97316}.yellow{color:#fde68a}.btn{border:0;border-radius:12px;padding:13px;color:#fff;background:#17283b;font-weight:950}.primary{background:#f97316}.green{background:#16a34a}.note{border-left:4px solid #22c55e;padding-left:10px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#081421;border-radius:10px;padding:8px;min-height:85px}.day b{color:#fde68a}.off{opacity:.55}.sticky{position:sticky;bottom:8px;display:flex;gap:8px;background:#101d2d;border:1px solid #294058;border-radius:14px;padding:9px}.sticky .btn{flex:1}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.phase{grid-template-columns:100px 1fr}.phase>:last-child{grid-column:2}.week{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid,.week{grid-template-columns:1fr}}</style></head><body><div class="app"><b><span class="orange">KUMSAL SPOR</span> • V23 YILLIK / MAKRO PERİYOTLAMA</b><div class="card hero"><h1>Bugün hangi dönemdeyiz?</h1><div class="muted">Yarış tarihine göre makro dönem, haftalık odak ve günlük yük bilgisi üretir. Bu veri V21 Günün Antrenmanı'na aktarılır.</div><div class="grid" style="margin-top:10px"><label>Sezon Başlangıcı<input id="season" type="date"></label><label>Ana Yarış<input id="race" type="date"></label><label>Yaş Grubu<select id="age"><option>8–10 Yaş</option><option selected>13–16 Yaş</option><option>Yetişkin</option></select></label><label>Profil<select id="profile"><option>Kısa Mesafe</option><option selected>Orta Mesafe</option><option>Uzun Mesafe</option><option>Branşçı</option></select></label></div><button id="build" class="btn primary" style="width:100%;margin-top:9px">PERİYOTLAMAYI HESAPLA</button></div><div class="card"><b>Bugünün Durumu</b><div id="today" style="margin-top:8px"></div></div><div class="card"><b>Makro Dönemler</b><div id="phases"></div></div><div class="card"><b>Bu Haftanın Mikro Döngüsü</b><div id="week" class="week" style="margin-top:8px"></div></div><div class="card note"><b>Motorun V21'e göndereceği bilgiler</b><div id="payload" class="muted" style="margin-top:6px"></div></div><div class="sticky"><button class="btn" onclick="location.href='v22-test-center.html'">← TEST MERKEZİ</button><button id="send" class="btn green">V21'E AKTAR →</button></div></div><script>const $=x=>document.getElementById(x),DAY=86400000;let plan=null;function iso(d){return d.toISOString().slice(0,10)}function add(d,n){return new Date(d.getTime()+n*DAY)}function days(a,b){return Math.round((b-a)/DAY)}function init(){let now=new Date(),s=new Date(now);s.setMonth(s.getMonth()-1);let r=new Date(now);r.setMonth(r.getMonth()+3);$('season').value=iso(s);$('race').value=iso(r)}function build(){let now=new Date(),season=new Date($('season').value+'T12:00:00'),race=new Date($('race').value+'T12:00:00');if(!isFinite(season)||!isFinite(race)||race<=season)return;let total=days(season,race),bounds=[0,.32,.62,.82,.94,1],names=['Genel Hazırlık','Özel Hazırlık','Yarışa Hazırlık','Taper / Form','Ana Yarış'],focus=['Teknik + aerobik taban','Eşik + branşa özel dayanıklılık','Yarış temposu + hız dayanıklılığı','Hacim azalt / kaliteyi koru','Yarış ve toparlanma'],loads=[1,1.05,.92,.62,.35],ph=[];for(let i=0;i<5;i++){let st=add(season,Math.round(total*bounds[i])),en=add(season,Math.round(total*bounds[i+1]));ph.push({name:names[i],focus:focus[i],load:loads[i],start:st,end:en})}let cur=ph.find(x=>now>=x.start&&now<=x.end)|| (now<season?ph[0]:ph[4]),toRace=days(now,race),weekNo=Math.max(1,Math.floor(days(season,now)/7)+1);plan={created:Date.now(),season:iso(season),race:iso(race),age:$('age').value,profile:$('profile').value,phase:cur.name,focus:cur.focus,load:cur.load,weeksToRace:Math.ceil(toRace/7),weekNo};render(ph,cur)}function render(ph,cur){$('today').innerHTML='<span class="badge">Dönem: '+cur.name+'</span><span class="badge">Sezon Haftası: '+plan.weekNo+'</span><span class="badge">Yarışa: '+plan.weeksToRace+' hf</span><span class="badge">Yük Katsayısı: '+plan.load.toFixed(2)+'</span><div class="note" style="margin-top:9px"><b>Ana odak:</b> '+cur.focus+'</div>';$('phases').innerHTML=ph.map(x=>'<div class="phase '+(x===cur?'active':'')+'"><b class="yellow">'+x.name+'</b><span>'+x.focus+'</span><span class="muted">'+x.start.toLocaleDateString('tr-TR')+'<br>'+x.end.toLocaleDateString('tr-TR')+'</span></div>').join('');let phase=plan.phase,daysDef=[['Pzt','OFF','Toparlanma'],['Sal AM','Aerobik/teknik','Orta'],['Sal PM','Ana kalite','Yüksek'],['Çar','Teknik + dayanıklılık','Orta'],['Per','Ana kalite','Yüksek'],['Cum','Aerobik/teknik','Orta'],['Cts/Paz','Çift seans / yarış özel','Değişken']];if(phase.includes('Taper'))daysDef=daysDef.map(x=>[x[0],x[1],x[2]==='Yüksek'?'Kalite / düşük hacim':x[2]]);$('week').innerHTML=daysDef.map(x=>'<div class="day '+(x[1]==='OFF'?'off':'')+'"><b>'+x[0]+'</b><br>'+x[1]+'<br><span class="muted">'+x[2]+'</span></div>').join('');$('payload').innerHTML='Dönem: <b>'+plan.phase+'</b> • Odak: <b>'+plan.focus+'</b> • Yük: <b>'+plan.load.toFixed(2)+'</b> • Profil: <b>'+plan.profile+'</b>. V21 bu katsayıyı tekrar/hacim seçiminde kullanacak.'}function send(){if(!plan)build();localStorage.setItem('ks_periodization',JSON.stringify(plan));location.href='v21-daily-workout.html'}$('build').onclick=build;$('send').onclick=send;init();build();</script></body></html>
