<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V24 Grup Yönetimi</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding:12px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:9px 0}.hero{border:2px solid #f97316}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid input,.grid select{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:900}.athletes{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.ath{background:#081421;border-radius:11px;padding:10px}.btn{border:0;border-radius:11px;padding:12px;color:#fff;background:#17283b;font-weight:950}.primary{background:#f97316}.green{background:#16a34a}.red{background:#991b1b}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.group{background:#081421;border-radius:14px;padding:12px}.badge{display:inline-block;background:#17283b;border-radius:999px;padding:6px 9px;margin:3px;font-size:12px}.members{margin-top:8px;line-height:1.7}.actions{display:flex;gap:6px;margin-top:8px}.actions .btn{flex:1}.sticky{position:sticky;bottom:8px;background:#101d2d;border:1px solid #294058;border-radius:14px;padding:9px;display:flex;gap:8px}.sticky .btn{flex:1}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.groups,.athletes{grid-template-columns:1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><b><span class="orange">KUMSAL SPOR</span> • V24 GRUP YÖNETİMİ</b><div class="card hero"><h1>Kalıcı Antrenman Grubu Oluştur</h1><div class="muted">Grubu bir kez oluştur. V21'de seçtiğinde sporcular otomatik gelir.</div><div class="grid" style="margin-top:10px"><label>Grup Adı<input id="name" placeholder="13–16 Orta Mesafe"></label><label>Yaş Grubu<select id="age"><option>8–10 Yaş</option><option selected>13–16 Yaş</option><option>Yetişkin</option></select></label><label>Profil<select id="profile"><option>Kısa Mesafe</option><option selected>Orta Mesafe</option><option>Uzun Mesafe</option><option>Branşçı</option></select></label><label>Varsayılan Havuz<select id="pool"><option>25 m</option><option selected>50 m</option></select></label></div></div><div class="card"><b>Gruba Eklenecek Sporcular</b><div id="athletes" class="athletes" style="margin-top:8px"></div><button id="save" class="btn green" style="width:100%;margin-top:9px">✓ GRUBU KAYDET</button></div><div class="card"><b>Kayıtlı Gruplar</b><div id="groups" class="groups" style="margin-top:8px"></div></div><div class="sticky"><button class="btn" onclick="location.href='v23-periodization-engine.html'">← PERİYOTLAMA</button><button class="btn primary" onclick="location.href='v21-daily-workout.html'">GÜNÜN ANTRENMANI →</button></div></div><script src="v18-data-core.js"></script><script>const $=x=>document.getElementById(x);let groups=[];try{groups=JSON.parse(localStorage.getItem('ks_training_groups')||'[]')}catch(e){}let editing=null;function roster(){let r=window.KSData?KSData.roster():[];$('athletes').innerHTML=r.map(a=>'<label class="ath"><input type="checkbox" value="'+a.name+'"> <b>'+a.name+'</b><br><span class="muted">'+(a.group||'Henüz kalıcı grup ataması yok')+'</span></label>').join('')}function checked(){return[...document.querySelectorAll('#athletes input:checked')].map(x=>x.value)}function save(){let name=$('name').value.trim(),members=checked();if(!name){$('name').focus();return}let g={id:editing||('grp_'+Date.now()),name,age:$('age').value,profile:$('profile').value,pool:$('pool').value,members,updatedAt:new Date().toISOString()};let i=groups.findIndex(x=>x.id===g.id);if(i>=0)groups[i]=g;else groups.push(g);localStorage.setItem('ks_training_groups',JSON.stringify(groups));editing=null;$('name').value='';document.querySelectorAll('#athletes input').forEach(x=>x.checked=false);render()}function edit(id){let g=groups.find(x=>x.id===id);if(!g)return;editing=id;$('name').value=g.name;$('age').value=g.age;$('profile').value=g.profile;$('pool').value=g.pool;document.querySelectorAll('#athletes input').forEach(x=>x.checked=g.members.includes(x.value));scrollTo({top:0,behavior:'smooth'})}function del(id){if(!confirm('Bu grubu silmek istiyor musun?'))return;groups=groups.filter(x=>x.id!==id);localStorage.setItem('ks_training_groups',JSON.stringify(groups));render()}function use(id){let g=groups.find(x=>x.id===id);if(!g)return;localStorage.setItem('ks_active_group',JSON.stringify(g));location.href='v21-daily-workout.html'}function render(){$('groups').innerHTML=groups.length?groups.map(g=>'<div class="group"><h3 style="margin:0">'+g.name+'</h3><span class="badge">'+g.age+'</span><span class="badge">'+g.profile+'</span><span class="badge">'+g.pool+'</span><div class="members"><b>'+g.members.length+' sporcu</b><br>'+g.members.map(n=>'• '+n).join('<br>')+'</div><div class="actions"><button class="btn" onclick="edit(\''+g.id+'\')">DÜZENLE</button><button class="btn red" onclick="del(\''+g.id+'\')">SİL</button><button class="btn green" onclick="use(\''+g.id+'\')">ANTRENMANA AL</button></div></div>').join(''):'<span class="muted">Henüz grup oluşturulmadı.</span>'}window.edit=edit;window.del=del;window.use=use;$('save').onclick=save;roster();render();</script></body></html>
