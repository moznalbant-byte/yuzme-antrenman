){return f}}function fmt(s){return window.KSData?KSData.fmt(Number(s)):String(s||'—')}function roster(){$('athlete').innerHTML=KSData.roster().map(a=>'<option>'+a.name+'</option>').join('')}function tests(n,c){return KSData.tests().filter(x=>x&&x.athlete===n&&(!x.course||KSData.courseKey(x.course)===c)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}function trainings(n,c){let all=[...j('ks_workout_history',[]),...j('ks_training_history',[]),...j('ks_completed_workouts',[]),...j('ks_performance_events',[]).filter(x=>x.kind==='training')];let seen={};return all.filter(x=>{if(!x)return false;let names=x.athletes||x.members||x.results&&Object.keys(x.results)||[];let hit=x.athlete===n||names.includes&&names.includes(n);let course=!x.course&&!x.pool||KSData.courseKey(x.course||x.pool)===c;let id=x.id||x.created||x.date||JSON.stringify(x).slice(0,80);if(hit&&course&&!seen[id]){seen[id]=1;return true}return false}).sort((a,b)=>String(b.date||b.created||'').localeCompare(String(a.date||a.created||'')))}function pbs(n,c){let strokes=['Serbest','Sırtüstü','Kurbağalama','Kelebek','Bireysel Karışık'],dist=[50,100,200,400,800];let out=[];strokes.forEach(s=>dist.forEach(d=>{let p=KSData.pb(n,s,c,d);if(p&&p.verified)out.push({s,d,...p})}));return out}function quality(n,c){let cloud=live.filter(x=>x.athlete_name===n&&(!x.course||KSData.courseKey(x.course)===c)&&x.target_ms>0).map(x=>({actual:x.elapsed_ms/1000,target:x.target_ms/1000,date:x.workout_date||x.created_at,delta:Number(x.delta_pct),zone:x.energy_zone,distance:x.set_distance,repeat:x.repeat_no,source:'Canlı Havuz'}));let ev=j('ks_performance_events',[]).filter(x=>x&&x.athlete===n&&x.kind!=='test'&&(!x.course||KSData.courseKey(x.course)===c));let vals=[];ev.forEach(x=>{if(Number(x.actual)>0&&Number(x.target)>0)vals.push({actual:+x.actual,target:+x.target,date:x.date,delta:(+x.actual-+x.target)/+x.target*100})});return cloud.concat(vals)}function coachAnalysis(n,c){let q=quality(n,c).filter(x=>Number.isFinite(x.delta)),wh=j('ks_workout_history',[]).filter(x=>(x.athletes||[]).includes(n)&&(!x.course||KSData.courseKey(x.course)===c)).slice(-8),rpes=wh.map(x=>Number(x.rpe)).filter(x=>x>0),avgRpe=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null,techBad=wh.filter(x=>x.tech==='Bozuldu').length,extra=(avgRpe?' • son '+rpes.length+' seans RPE ort. '+avgRpe.toFixed(1):'')+(techBad?' • teknik bozulma '+techBad+' seans':'');if(!q.length)return{status:'Veri yok',cls:'warn',text:'Canlı tekrar dereceleri geldikçe sistem tempo davranışını analiz edecek.'+extra,zones:[]};let recent=q.slice(0,30),abs=recent.reduce((a,x)=>a+Math.abs(x.delta),0)/recent.length,hit=recent.filter(x=>Math.abs(x.delta)<=1.5).length/recent.length*100,fast=recent.filter(x=>x.delta<-1.5).length/recent.length*100,slow=recent.filter(x=>x.delta>1.5).length/recent.length*100;let by={};recent.forEach(x=>{let z=x.zone||'Diğer';(by[z]??=[]).push(x.delta)});let zones=Object.entries(by).map(([z,v])=>({z,avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length}));let status=hit>=70?'Hedef kontrolü iyi':slow>=45?'Hedefe göre yavaşlama var':fast>=45?'Hedefe göre fazla hızlı yüzülüyor':'Dalgalı tempo',cls=hit>=70?'good':(slow>=45?'bad':'warn');return{status,cls,text:'Son '+recent.length+' kayıt • hedef içinde %'+hit.toFixed(0)+' • ort. mutlak sapma %'+abs.toFixed(1)+' • hızlı %'+fast.toFixed(0)+' • yavaş %'+slow.toFixed(0)+extra,zones}}function summary(n,c,ts,tr,ps){let css=KSData.css(n,c),last=ts[0],missing=[];if(!ps.some(x=>x.s==='Serbest'&&x.d===50))missing.push('50 m serbest PB');if(!ps.some(x=>x.s==='Serbest'&&x.d===100))missing.push('100 m serbest PB');if(!css)missing.push('CSS / 200+400 testi');let q=quality(n,c),hit=q.length?q.filter(x=>Math.abs(x.delta)<=1.5).length/q.length*100:null,ca=coachAnalysis(n,c);$('content').innerHTML='<div class="grid"><div class="metric"><span class="muted">CSS /100</span><div class="v">'+(css?fmt(css.sec100):'—')+'</div><span class="muted">'+(css?css.source:'Test gerekli')+'</span></div>< l||x.type)+'</b><br>'+(x.display||'Kayıt mevcut')+'<br><span class="muted">'+(x.phase||'Dönem bilgisi yok')+'</span></div>').join(''):'<div class="row">Bu havuz için test kaydı yok.</div>';return}if(tab==='training'){$('content').innerHTML=tr.length?tr.map(x=>'<div class="row"><b>'+new Date(x.date||x.created||Date.now()).toLocaleString('tr-TR')+'</b><br>'+(x.session||x.title||x.group?.name||'Antrenman kaydı')+'<br><span class="muted">'+(x.phase||x.periodization?.phase||'')+'</span></div>').join(''):'<div class="row">Henüz bu sporcu için okunabilir antrenman kaydı yok. Canlı havuz bitiş kayıtları burada birikecek.</div>';return}let q=quality(n,c),ca=coachAnalysis(n,c);if(!q.length){$('content').innerHTML='<div class="row warn"><b>Hedef kalite verisi henüz oluşmadı.</b><br>Canlı havuz ekranında tekrar dereceleri hedef süreyle birlikte kaydedildikçe burada hedef tutturma ve tempo bozulması hesaplanacak.</div>';return}let avg=q.reduce((a,x)=>a+Math.abs(x.delta),0)/q.length,hit=q.filter(x=>Math.abs(x.delta)<=1.5).length/q.length*100;$('content').innerHTML='<div class="row '+ca.cls+'"><b>'+ca.status+'</b><br>'+ca.text+'<br>'+ca.zones.map(z=>'<span class="pill">'+z+' '+(z.avg>0?'+':'')+z.avg.toFixed(1)+'%</span>').join('')+'</div><div class="grid"><div class="metric"><span class="muted">HEDEF İÇİ</span><div class="v">'+hit.toFixed(0)+'%</div></div><div class="metric"><span class="muted">ORT. SAPMA</span><div class="v">'+avg.toFixed(1)+'%</div></div></div>'+q.slice(-20).reverse().map(x=>'<div class="row"><b>'+new Date(x.date).toLocaleDateString('tr-TR')+'</b> • Hedef '+fmt(x.target)+' • Gerçek '+fmt(x.actual)+' • Sapma '+(x.delta>0?'+':'')+x.delta.toFixed(1)+'% • <span class="pill">'+(Math.abs(x.delta)<=1.5?'HEDEF İÇİ':x.delta>1.5?'YAVAŞ':'HIZLI')+'</span></div>').join('')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;render()});$('athlete').onchange=render;$('course').onchange=render;async function boot(){roster();let {data}=await db.from('live_arrivals').select('athlete_name,repeat_no,elapsed_ms,created_at,set_index,set_distance,energy_zone,course,workout_date,target_ms,delta_ms,delta_pct').order('created_at',{ascending:false}).limit(1000);live=data||[];render()}boot();</script></body></html>
