<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V28 Havuz Canlı Merkezi</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1250px;margin:auto;padding:12px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:9px 0}.hero{border:2px solid #f97316}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.btn{border:0;border-radius:11px;padding:12px;color:#fff;background:#17283b;font-weight:950}.primary{background:#f97316}.green{background:#16a34a}.blue{background:#2563eb}.red{background:#991b1b}.setup{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}.field{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:900}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.group{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:13px}.group.running{border:2px solid #22c55e}.top{display:flex;justify-content:space-between;gap:8px}.set{background:#081421;border-radius:13px;padding:12px;margin-top:8px}.settitle{font-size:25px;font-weight:950;color:#fde68a}.clocks{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:7px;margin-top:8px}.clock{background:#081421;border-radius:12px;padding:10px;text-align:center}.clock .v{font-size:30px;font-weight:950;color:#fde68a}.clock.main .v{font-size:44px}.ath{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{background:#17283b;border-radius:999px;padding:6px 9px;font-size:12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#17283b;font-size:12px;font-weight:900}.live{background:#14532d}.empty{text-align:center;padding:30px;color:#9fb0c2}.sticky{position:sticky;bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#101d2d;border:1px solid #294058;border-radius:14px;padding:9px}@media(max-width:800px){.groups{grid-template-columns:1fr}.setup{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}}@media(max-width:450px){.setup,.clocks,.sticky{grid-template-columns:1fr}.clock.main .v{font-size:38px}}</style></head><body><div class="app"><b><span class="orange">KUMSAL SPOR</span> • V28 HAVUZ CANLI MERKEZİ</b><div class="card hero"><h1>Aynı havuzda farklı gruplar, farklı antrenmanlar</h1><div class="muted">Her grubun seti, tekrar kronometresi ve genel süresi birbirinden bağımsız çalışır.</div><div class="setup" style="margin-top:10px"><select id="group" class="field"></select><select id="coach" class="field"><option>Antrenör 1</option><option>Antrenör 2</option><option>Antrenör 3</option><option>Yardımcı</option></select><select id="lane" class="field"><option>1–2. Kulvar</option><option>3–4. Kulvar</option><option>5–6. Kulvar</option><option>7–8. Kulvar</option></select><button id="add" class="btn green">+ HAVUZA EKLE</button></div></div><div id="groups" class="groups"></div><div class="sticky"><button class="btn" onclick="location.href='v24-group-manager.html'">← GRUPLAR</button><button class="btn blue" onclick="location.href='v27-multi-coach-live.html'">ANTRENÖRLER</button><button class="btn primary" onclick="location.href='v21-daily-workout.html'">ANTRENMAN HAZIRLA →</button></div></div><script>const $=x=>document.getElementById(x);let saved=[];try{saved=JSON.parse(localStorage.getItem('ks_training_groups')||'[]')}catch(e){}let pool=[];try{pool=JSON.parse(localStorage.getItem('ks_pool_groups')||'[]')}catch(e){}const templates={sprint:[{r:8,d:50,z:'A1',send:70},{r:12,d:25,z:'SPR2',send:60},{r:6,d:50,z:'RP',send:120}],middle:[{r:8,d:100,z:'A1',send:105},{r:10,d:150,z:'END2',send:150},{r:6,d:50,z:'RP',send:120}],distance:[{r:10,d:100,z:'A1',send:105},{r:6,d:200,z:'A2',send:210},{r:4,d:400,z:'END2',send:390}],stroke:[{r:8,d:50,z:'Teknik',send:80},{r:8,d:100,z:'A2',send:130},{r:8,d:50,z:'RP',send:120}]};function key(p){return p?.includes('Kısa')?'sprint':p?.includes('Uzun')?'distance':p?.includes('Branş')?'stroke':'middle'}function fmt(s){s=Math.max(0,s||0);let m=Math.floor(s/60),x=s-m*60;return m+':'+x.toFixed(1).padStart(4,'0')}function save(){localStorage.setItem('ks_pool_groups',JSON.stringify(pool.map(x=>({...x,running:false,t0:null,totalBase:x.totalNow||x.totalBase||0,repBase:x.repNow||x.repBase||0}))));render()}function loadSelect(){$('group').innerHTML=saved.length?saved.map(g=>'<option value="'+g.id+'">'+g.name+'</option>').join(''):'<option value="">Önce V24’te grup oluştur</option>'}function add(){let g=saved.find(x=>x.id===$('group').value);if(!g||pool.some(x=>x.groupId===g.id))return;pool.push({id:'pg_'+Date.now(),groupId:g.id,name:g.name,profile:g.profile,pool:g.pool,members:g.members,coach:$('coach').value,lane:$('lane').value,sets:templates[key(g.profile)],setIndex:0,rep:1,running:false,totalBase:0,repBase:0,totalNow:0,repNow:0});save()}function start(id){let x=pool.find(y=>y.id===id);if(!x)return;if(x.running){x.totalBase=x.totalNow;x.repBase=x.repNow;x.running=false;x.t0=null}else{x.running=true;x.t0=performance.now()}render()}function resetRep(id){let x=pool.find(y=>y.id===id);if(!x)return;x.repBase=0;x.repNow=0;if(x.running)x.t0=performance.now();render()}function next(id){let x=pool.find(y=>y.id===id);if(!x)return;x.setIndex=Math.min(x.sets.length-1,x.setIndex+1);x.rep=1;x.repBase=0;x.repNow=0;if(x.running)x.t0=performance.now();render()}function prev(id){let x=pool.find(y=>y.id===id);if(!x)return;x.setIndex=Math.max(0,x.setIndex-1);x.rep=1;x.repBase=0;x.repNow=0;if(x.running)x.t0=performance.now();render()}function removeG(id){pool=pool.filter(x=>x.id!==id);save()}function tick(){let now=performance.now(),dirty=false;pool.forEach(x=>{if(x.running&&x.t0){let e=(now-x.t0)/1000;x.repNow=x.repBase+e;x.totalNow=x.totalBase+e;let q=x.sets[x.setIndex],r=Math.floor(x.repNow/q.send)+1;x.rep=Math.min(q.r,r);dirty=true}});if(dirty)render(false);requestAnimationFrame(tick)}function render(full=true){$('groups').innerHTML=pool.length?pool.map(x=>{let q=x.sets[x.setIndex];return'<div class="group '+(x.running?'running':'')+'"><div class="top"><div><h2 style="margin:0">'+x.name+'</h2><span class="muted">'+x.coach+' • '+x.lane+' • '+x.pool+'</span></div><span class="status '+(x.running?'live':'')+'">'+(x.running?'CANLI':'BEKLİYOR')+'</span></div><div class="set"><span class="muted">SET '+(x.setIndex+1)+' / '+x.sets.length+'</span><div class="settitle">'+q.r+' × '+q.d+' m • '+q.z+'</div><div class="muted">Çıkış '+fmt(q.send)+' • '+(q.r*q.d)+' m</div></div><div class="clocks"><div class="clock main"><span class="muted">TEKRAR SAYACI</span><div class="v">'+fmt(x.repNow)+'</div></div><div class="clock"><span class="muted">TEKRAR</span><div class="v">'+x.rep+'/'+q.r+'</div></div><div class="clock"><span class="muted">GENEL</span><div class="v">'+fmt(x.totalNow)+'</div></div></div><div class="ath">'+x.members.map(n=>'<span class="chip">'+n+'</span>').join('')+'</div><div class="actions"><button class="btn '+(x.running?'red':'green')+'" onclick="start(\''+x.id+'\')">'+(x.running?'DURDUR':'▶ BAŞLAT')+'</button><button class="btn" onclick="resetRep(\''+x.id+'\')">↺ TEKRAR</button><button class="btn" onclick="prev(\''+x.id+'\')">← SET</button><button class="btn primary" onclick="next(\''+x.id+'\')">SET →</button></div><button class="btn red" style="width:100%;margin-top:6px" onclick="removeG(\''+x.id+'\')">HAVUZDAN ÇIKAR</button></div>'}).join(''):'<div class="card empty">Henüz aktif grup yok.<br>Üstten bir grup seçip <b>HAVUZA EKLE</b>.</div>'}window.start=start;window.resetRep=resetRep;window.next=next;window.prev=prev;window.removeG=removeG;$('add').onclick=add;loadSelect();render();requestAnimationFrame(tick);</script></body></html>
