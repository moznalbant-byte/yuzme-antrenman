<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V29 Basit Havuz</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding:14px}.orange{color:#f97316}.muted{color:#9fb0c2}.card{background:#101d2d;border:1px solid #294058;border-radius:20px;padding:16px;margin:10px 0}.hero{border:2px solid #f97316}.groups,.livegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.g,.live{background:#0b1726;border:2px solid #294058;border-radius:18px;padding:16px}.g{cursor:pointer}.g.selected,.live.running{border-color:#22c55e}.g h2{margin:0}.check{float:right;font-size:28px}.btn{border:0;border-radius:14px;padding:15px;color:#fff;background:#17283b;font-weight:950;font-size:16px}.green{background:#16a34a}.primary{background:#f97316}.red{background:#991b1b}.blue{background:#2563eb}.create{display:none}.create.on{display:block}.form,.actions,.topactions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.field{width:100%;padding:12px;border:0;border-radius:11px;background:#fff4bf;font-weight:900}.athletes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.athletes label,.set,.clock{background:#081421;border-radius:12px;padding:10px}.set{margin-top:9px}.setbig{font-size:28px;font-weight:950;color:#fde68a}.clocks{display:grid;grid-template-columns:1.4fr .8fr;gap:8px;margin-top:8px}.clock{text-align:center}.clock .v{font-size:27px;font-weight:950;color:#fde68a}.clock.main .v{font-size:48px}.focus{display:none}.focus.on{display:block}.focus .clock.main .v{font-size:clamp(75px,18vw,150px)}.ath{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{background:#17283b;border-radius:999px;padding:6px 9px;font-size:12px}.bottom{position:sticky;bottom:8px;background:#101d2d;border:1px solid #294058;border-radius:15px;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:720px){.groups,.livegrid{grid-template-columns:1fr}}@media(max-width:450px){.form,.athletes,.bottom{grid-template-columns:1fr}.clock.main .v{font-size:42px}}</style></head><body><div class="app"><div id="choose"><b><span class="orange">KUMSAL SPOR</span> • BASİT HAVUZ</b><div class="card hero"><h1>Bugün hangi gruplar çalışıyor?</h1><div class="muted">Birden fazla grup seçebilirsin. Hepsi aynı havuz ekranına gelir.</div><button id="newGroup" class="btn primary" style="width:100%;margin-top:12px">+ YENİ GRUP OLUŞTUR</button></div><div id="create" class="card create"><h2>Yeni Grup</h2><div class="form"><input id="gname" class="field" placeholder="Grup adı"><select id="gage" class="field"><option>8–10 Yaş</option><option selected>13–16 Yaş</option><option>Yetişkin</option></select><select id="gprofile" class="field"><option>Kısa Mesafe</option><option selected>Orta Mesafe</option><option>Uzun Mesafe</option><option>Branşçı</option></select><select id="gpool" class="field"><option>25 m</option><option selected>50 m</option></select></div><b>Sporcuları seç</b><div id="athletes" class="athletes"></div><div class="actions"><button id="cancelGroup" class="btn">VAZGEÇ</button><button id="saveGroup" class="btn green">GRUBU KAYDET</button></div></div><div id="groups" class="groups"></div><button id="go" class="btn green" style="width:100%;margin-top:12px;font-size:20px">SEÇİLİ GRUPLARLA HAVUZA BAŞLA →</button></div><div id="dashboard" style="display:none"><b><span class="orange">KUMSAL SPOR</span> • BUGÜN HAVUZDA</b><div class="card hero"><h2 style="margin-top:0">Canlı Havuz Kontrolü</h2><div class="muted">Grupları ayrı ayrı veya aynı anda başlatabilirsin.</div><div class="topactions" style="margin-top:10px"><button id="startAll" class="btn green">▶ TÜM GRUPLARI BAŞLAT</button><button id="stopAll" class="btn red">■ TÜMÜNÜ DURDUR</button></div></div><div id="livegrid" class="livegrid"></div><div class="bottom"><button class="btn" onclick="showChoose()">← GRUP DEĞİŞTİR</button><button class="btn primary" onclick="location.href='v21-daily-workout.html'">ANTRENMAN HAZIRLA</button></div></div><div id="focus" class="focus"></div></div><script src="v18-data-core.js"></script><script>const $=x=>document.getElementById(x);let saved=[];try{saved=JSON.parse(localStorage.getItem('ks_training_groups')||'[]')}catch(e){}let picked=[],live=[];const tpl={sprint:[{r:8,d:50,z:'A1',send:70},{r:12,d:25,z:'SPR2',send:60}],middle:[{r:8,d:100,z:'A1',send:105},{r:10,d:150,z:'END2',send:150}],distance:[{r:10,d:100,z:'A1',send:105},{r:6,d:200,z:'A2',send:210}],stroke:[{r:8,d:50,z:'Teknik',send:80},{r:8,d:100,z:'A2',send:130}]};function key(p){return p?.includes('Kısa')?'sprint':p?.includes('Uzun')?'distance':p?.includes('Branş')?'stroke':'middle'}function fmt(s){s=Math.max(0,s||0);let m=Math.floor(s/60),x=s-m*60;return m+':'+x.toFixed(1).padStart(4,'0')}function roster(){let r=window.KSData?KSData.roster():[];$('athletes').innerHTML=r.map(a=>'<label><input type="checkbox" value="'+a.name+'"> '+a.name+'</label>').join('')}function renderGroups(){$('groups').innerHTML=saved.length?saved.map(g=>'<div class="g '+(picked.includes(g.id)?'selected':'')+'" onclick="pick(\''+g.id+'\')"><span class="check">'+(picked.includes(g.id)?'✓':'')+'</span><h2>'+g.name+'</h2><div class="muted">'+g.age+' • '+g.profile+' • '+g.pool+' • '+g.members.length+' sporcu</div></div>').join(''):'<div class="card">Henüz grup yok. Yeni Grup Oluştur’a bas.</div>'}window.pick=id=>{picked=picked.includes(id)?picked.filter(x=>x!==id):[...picked,id];renderGroups()};function saveGroup(){let name=$('gname').value.trim();if(!name)return;let members=[...document.querySelectorAll('#athletes input:checked')].map(x=>x.value),g={id:'grp_'+Date.now(),name,age:$('gage').value,profile:$('gprofile').value,pool:$('gpool').value,members};saved.push(g);localStorage.setItem('ks_training_groups',JSON.stringify(saved));picked=[...new Set([...picked,g.id])];$('create').className='card create';$('gname').value='';renderGroups()}function startPool(){if(!picked.length)return;live=picked.map(id=>{let g=saved.find(x=>x.id===id);return{id:'live_'+g.id,name:g.name,members:g.members,pool:g.pool,sets:tpl[key(g.profile)],si:0,running:false,repElapsed:0,totalElapsed:0,startedAt:0}});$('choose').style.display='none';$('dashboard').style.display='block';renderLive()}function elapsed(x,now){if(!x.running)return{xrep:x.repElapsed,xtotal:x.totalElapsed};let d=(now-x.startedAt)/1000;return{xrep:x.repElapsed+d,xtotal:x.totalElapsed+d}}function toggle(id){let x=live.find(y=>y.id===id),now=performance.now();if(x.running){let e=elapsed(x,now);x.repElapsed=e.xrep;x.totalElapsed=e.xtotal;x.running=false}else{x.running=true;x.startedAt=now}renderLive()}function startAll(){let now=performance.now();live.forEach(x=>{if(!x.running){x.running=true;x.startedAt=now}});renderLive()}function stopAll(){let now=performance.now();live.forEach(x=>{if(x.running){let e=elapsed(x,now);x.repElapsed=e.xrep;x.totalElapsed=e.xtotal;x.running=false}});renderLive()}function nextSet(id){let x=live.find(y=>y.id===id),now=performance.now();if(x.running){let e=elapsed(x,now);x.totalElapsed=e.xtotal;x.startedAt=now}x.repElapsed=0;x.si=Math.min(x.sets.length-1,x.si+1);renderLive()}function renderLive(){let now=performance.now();$('livegrid').innerHTML=live.map(x=>{let q=x.sets[x.si],e=elapsed(x,now);return'<div class="live '+(x.running?'running':'')+'"><h2 style="margin:0">'+x.name+'</h2><div class="muted">'+x.pool+' • '+x.members.length+' sporcu • '+(x.running?'CANLI':'DURDU')+'</div><div class="set" onclick="focusGroup(\''+x.id+'\')"><div class="setbig">'+q.r+' × '+q.d+' m • '+q.z+'</div><div>Çıkış '+fmt(q.send)+' • Set '+(x.si+1)+'/'+x.sets.length+'</div></div><div class="clocks"><div class="clock main"><span class="muted">TEKRAR</span><div class="v">'+fmt(e.xrep)+'</div></div><div class="clock"><span class="muted">GENEL</span><div class="v">'+fmt(e.xtotal)+'</div></div></div><div class="actions"><button class="btn '+(x.running?'red':'green')+'" onclick="toggle(\''+x.id+'\')">'+(x.running?'DURDUR':'▶ BAŞLAT')+'</button><button class="btn primary" onclick="nextSet(\''+x.id+'\')">SONRAKİ SET →</button></div></div>'}).join('')}function focusGroup(id){let x=live.find(y=>y.id===id),q=x.sets[x.si],e=elapsed(x,performance.now());$('dashboard').style.display='none';$('focus').className='focus on';$('focus').dataset.id=id;$('focus').innerHTML='<button class="btn" onclick="closeFocus()">← TÜM GRUPLAR</button><div class="card hero"><h1>'+x.name+'</h1><div class="setbig">'+q.r+' × '+q.d+' m • '+q.z+'</div><div>Çıkış '+fmt(q.send)+'</div><div class="clock main" style="margin-top:10px"><span class="muted">TEKRAR SAYACI</span><div class="v">'+fmt(e.xrep)+'</div></div><div class="clock" style="margin-top:8px"><span class="muted">GENEL ANTRENMAN</span><div class="v">'+fmt(e.xtotal)+'</div></div><div class="actions"><button class="btn '+(x.running?'red':'green')+'" onclick="toggle(\''+id+'\')">'+(x.running?'DURDUR':'▶ BAŞLAT')+'</button><button class="btn primary" onclick="nextSet(\''+id+'\')">SONRAKİ SET →</button></div></div>'}function closeFocus(){$('focus').className='focus';$('focus').dataset.id='';$('dashboard').style.display='block';renderLive()}function showChoose(){stopAll();$('dashboard').style.display='none';$('focus').className='focus';$('choose').style.display='block'}function tick(){if(live.some(x=>x.running)){renderLive();let id=$('focus').dataset.id;if($('focus').classList.contains('on')&&id)focusGroup(id)}requestAnimationFrame(tick)}window.toggle=toggle;window.nextSet=nextSet;window.focusGroup=focusGroup;window.closeFocus=closeFocus;window.showChoose=showChoose;$('newGroup').onclick=()=>{$('create').className='card create on'};$('cancelGroup').onclick=()=>{$('create').className='card create'};$('saveGroup').onclick=saveGroup;$('go').onclick=startPool;$('startAll').onclick=startAll;$('stopAll').onclick=stopAll;roster();renderGroups();requestAnimationFrame(tick);</script></body></html>
