<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V29 Basit Havuz</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding:14px}.orange{color:#f97316}.muted{color:#9fb0c2}.card{background:#101d2d;border:1px solid #294058;border-radius:20px;padding:16px;margin:10px 0}.hero{border:2px solid #f97316}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.g{background:#0b1726;border:2px solid #294058;border-radius:18px;padding:16px;cursor:pointer}.g.selected{border-color:#22c55e;background:#10291d}.g h2{margin:0 0 5px}.check{float:right;font-size:28px}.btn{border:0;border-radius:14px;padding:15px;color:#fff;background:#17283b;font-weight:950;font-size:16px}.green{background:#16a34a}.primary{background:#f97316}.red{background:#991b1b}.startall{width:100%;font-size:20px}.create{display:none}.create.on{display:block}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.field{width:100%;padding:12px;border:0;border-radius:11px;background:#fff4bf;font-weight:900}.athletes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.athletes label{background:#081421;border-radius:10px;padding:10px}.livegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.live{background:#101d2d;border:2px solid #294058;border-radius:20px;padding:14px}.live.running{border-color:#22c55e}.set{background:#081421;border-radius:15px;padding:13px}.setbig{font-size:28px;font-weight:950;color:#fde68a}.clocks{display:grid;grid-template-columns:1.4fr .8fr;gap:8px;margin-top:8px}.clock{background:#081421;border-radius:14px;padding:10px;text-align:center}.clock .v{font-size:26px;font-weight:950;color:#fde68a}.clock.main .v{font-size:48px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.ath{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{background:#17283b;border-radius:999px;padding:6px 9px;font-size:12px}.focus{display:none}.focus.on{display:block}.focus .clock.main .v{font-size:clamp(75px,18vw,150px)}.bottom{position:sticky;bottom:8px;background:#101d2d;border:1px solid #294058;border-radius:15px;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:720px){.groups,.livegrid{grid-template-columns:1fr}}@media(max-width:450px){.bottom,.form,.athletes{grid-template-columns:1fr}.clock.main .v{font-size:42px}}</style></head><body><div class="app"><div id="choose"><b><span class="orange">KUMSAL SPOR</span> • BASİT HAVUZ</b><div class="card hero"><h1>Bugün hangi gruplar çalışıyor?</h1><div class="muted">Grubu seç veya buradan yeni grup oluştur.</div><button id="newGroup" class="btn primary" style="width:100%;margin-top:12px">+ YENİ GRUP OLUŞTUR</button></div><div id="create" class="card create"><h2 style="margin-top:0">Yeni Grup</h2><div class="form"><label>Grup Adı<input id="gname" class="field" placeholder="Örn. 13–16 Orta Mesafe"></label><label>Yaş Grubu<select id="gage" class="field"><option>8–10 Yaş</option><option selected>13–16 Yaş</option><option>Yetişkin</option></select></label><label>Profil<select id="gprofile" class="field"><option>Kısa Mesafe</option><option selected>Orta Mesafe</option><option>Uzun Mesafe</option><option>Branşçı</option></select></label><label>Havuz<select id="gpool" class="field"><option>25 m</option><option selected>50 m</option></select></label></div><b style="display:block;margin-top:12px">Sporcuları seç</b><div id="athletes" class="athletes"></div><div class="actions"><button id="cancelGroup" class="btn">VAZGEÇ</button><button id="saveGroup" class="btn green">✓ GRUBU KAYDET</button></div></div><div id="groups" class="groups"></div><button id="go" class="btn green startall" style="margin-top:12px">▶ SEÇİLİ GRUPLARLA HAVUZA BAŞLA</button></div><div id="dashboard" style="display:none"><b><span class="orange">KUMSAL SPOR</span> • BUGÜN HAVUZDA</b><div class="card"><h2 style="margin:0">Grup kartına dokun → büyük canlı ekranı aç</h2><div class="muted">Her grubun kronometresi birbirinden bağımsızdır.</div></div><div id="livegrid" class="livegrid"></div><div class="bottom"><button class="btn" onclick="showChoose()">← GRUP DEĞİŞTİR</button><button class="btn primary" onclick="location.href='v21-daily-workout.html'">ANTRENMAN HAZIRLA</button></div></div><div id="focus" class="focus"></div></div><script src="v18-data-core.js"></script><script>const $=x=>document.getElementById(x);let saved=[];try{saved=JSON.parse(localStorage.getItem('ks_training_groups')||'[]')}catch(e){}let picked=[],live=[];const tpl={sprint:[{r:8,d:50,z:'A1',send:70},{r:12,d:25,z:'SPR2',send:60},{r:6,d:50,z:'RP',send:120}],middle:[{r:8,d:100,z:'A1',send:105},{r:10,d:150,z:'END2',send:150},{r:6,d:50,z:'RP',send:120}],distance:[{r:10,d:100,z:'A1',send:105},{r:6,d:200,z:'A2',send:210},{r:4,d:400,z:'END2',send:390}],stroke:[{r:8,d:50,z:'Teknik',send:80},{r:8,d:100,z:'A2',send:130},{r:8,d:50,z:'RP',send:120}]};function key(p){return p?.includes('Kısa')?'sprint':p?.includes('Uzun')?'distance':p?.includes('Branş')?'stroke':'middle'}function fmt(s){s=Math.max(0,s||0);let m=Math.floor(s/60),x=s-m*60;return m+':'+x.toFixed(1).padStart(4,'0')}function athleteUI(){let r=window.KSData?KSData.roster():[];$('athletes').innerHTML=r.length?r.map(a=>'<label><input type="checkbox" value="'+a.name+'"> <b>'+a.name+'</b></label>').join(''):'<span class="muted">Kayıtlı sporcu yok. Grubu sporcusuz da oluşturabilirsin; sporcuları daha sonra ekleyebiliriz.</span>'}function renderGroups(){$('groups').innerHTML=saved.length?saved.map(g=>'<div class="g '+(picked.includes(g.id)?'selected':'')+'" onclick="pick(\''+g.id+'\')"><span class="check">'+(picked.includes(g.id)?'✓':'')+'</span><h2>'+g.name+'</h2><div class="muted">'+g.age+' • '+g.profile+' • '+g.pool+'</div><div style="margin-top:8px"><b>'+g.members.length+' sporcu</b></div></div>').join(''):'<div class="card"><b>Henüz grup yok.</b><br><span class="muted">Yukarıdaki “Yeni Grup Oluştur” butonuna bas.</span></div>'}window.pick=id=>{picked=picked.includes(id)?picked.filter(x=>x!==id):[...picked,id];renderGroups()};function openCreate(){$('create').className='card create on';$('gname').focus()}function closeCreate(){$('create').className='card create';$('gname').value='';document.querySelectorAll('#athletes input').forEach(x=>x.checked=false)}function saveGroup(){let name=$('gname').value.trim();if(!name){$('gname').focus();return}let members=[...document.querySelectorAll('#athletes input:checked')].map(x=>x.value),g={id:'grp_'+Date.now(),name,age:$('gage').value,profile:$('gprofile').value,pool:$('gpool').value,members,updatedAt:new Date().toISOString()};saved.push(g);localStorage.setItem('ks_training_groups',JSON.stringify(saved));picked=[...new Set([...picked,g.id])];closeCreate();renderGroups()}function startPool(){if(!picked.length)return;live=picked.map(id=>{let g=saved.find(x=>x.id===id),imported=null;try{imported=JSON.parse(localStorage.getItem('ks_v21_workout')||'null')}catch(e){}let same=imported?.group?.id===g.id&&imported.sets?.length;return{id:'l_'+g.id,name:g.name,members:g.members,pool:g.pool,sets:same?imported.sets:tpl[key(g.profile)],si:0,running:false,repNow:0,totalNow:0,totalBase:0,t0:null}});$('choose').style.display='none';$('dashboard').style.display='block';renderLive()}function renderLive(){$('livegrid').innerHTML=live.map(x=>{let q=x.sets[x.si];return'<div class="live '+(x.running?'running':'')+'" onclick="focus(\''+x.id+'\')"><h2 style="margin:0">'+x.name+'</h2><div class="muted">'+x.pool+' • '+x.members.length+' sporcu</div><div class="set"><div class="muted">ŞİMDİ</div><div class="setbig">'+q.r+' × '+q.d+' m • '+q.z+'</div><div>Çıkış '+fmt(q.send)+'</div></div><div class="clocks"><div class="clock main"><span class="muted">TEKRAR</span><div class="v">'+fmt(x.repNow)+'</div></div><div class="clock"><span class="muted">GENEL</span><div class="v">'+fmt(x.totalNow)+'</div></div></div><div class="actions"><button class="btn '+(x.running?'red':'green')+'" onclick="event.stopPropagation();toggle(\''+x.id+'\')">'+(x.running?'DURDUR':'▶ BAŞLAT')+'</button><button class="btn primary" onclick="event.stopPropagation();next(\''+x.id+'\')">SONRAKİ SET →</button></div></div>'}).join('')}window.toggle=id=>{let x=live.find(y=>y.id===id);if(x.running){let e=(performance.now()-x.t0)/1000;x.totalBase=x.totalNow=x.totalBase+e;x.repNow=e;x.running=false}else{x.running=true;x.t0=performance.now();x.repNow=0}renderLive();renderFocus(id)};window.next=id=>{let x=live.find(y=>y.id===id);x.si=Math.min(x.sets.length-1,x.si+1);x.repNow=0;if(x.running)x.t0=performance.now();renderLive();renderFocus(id)};window.focus=id=>{let x=live.find(y=>y.id===id),q=x.sets[x.si];$('choose').style.display='none';$('dashboard').style.display='none';$('focus').className='focus on';$('focus').dataset.id=id;$('focus').innerHTML='<button class="btn" onclick="closeFocus()">← TÜM GRUPLAR</button><div class="card hero"><h1 style="margin:0">'+x.name+'</h1><div class="muted">'+x.pool+' • '+x.members.length+' sporcu</div></div><div class="card"><div class="setbig">'+q.r+' × '+q.d+' m • '+q.z+'</div><div>Çıkış '+fmt(q.send)+' • Set '+(x.si+1)+'/'+x.sets.length+'</div><div class="clock main" style="margin-top:10px"><span class="muted">TEKRAR SAYACI</span><div class="v">'+fmt(x.repNow)+'</div></div><div class="clock" style="margin-top:8px"><span class="muted">GENEL ANTRENMAN</span><div class="v">'+fmt(x.totalNow)+'</div></div><div class="ath">'+x.members.map(n=>'<span class="chip">'+n+'</span>').join('')+'</div><div class="actions"><button class="btn '+(x.running?'red':'green')+'" onclick="toggle(\''+id+'\')">'+(x.running?'DURDUR':'▶ BAŞLAT')+'</button><button class="btn primary" onclick="next(\''+id+'\')">SONRAKİ SET →</button></div></div>'};window.closeFocus=()=>{$('focus').className='focus';$('dashboard').style.display='block';renderLive()};window.showChoose=()=>{$('dashboard').style.display='none';$('focus').className='focus';$('choose').style.display='block'};function tick(){let now=performance.now(),changed=false;live.forEach(x=>{if(x.running){let e=(now-x.t0)/1000;x.repNow=e;x.totalNow=x.totalBase+e;changed=true}});if(changed){renderLive();let id=$('focus').dataset.id;if($('focus').classList.contains('on')&&id)renderFocus(id)}requestAnimationFrame(tick)}function renderFocus(id){if($('focus').classList.contains('on'))window.focus(id)}$('newGroup').onclick=openCreate;$('cancelGroup').onclick=closeCreate;$('saveGroup').onclick=saveGroup;$('go').onclick=startPool;athleteUI();renderGroups();requestAnimationFrame(tick);</script></body></html>
