<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canlı Havuz</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;touch-action:manipulation}.app{max-width:1150px;margin:auto;padding:14px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:10px 0}.hero{border:2px solid #f97316}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.group{background:#0b1726;border:2px solid #294058;border-radius:16px;padding:14px;cursor:pointer}.group.sel,.run{border-color:#22c55e}.btn{border:0;border-radius:12px;padding:13px;background:#17283b;color:#fff;font-weight:900;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.btn:active,.group:active{transform:scale(.985)}.green{background:#16a34a}.red{background:#991b1b}.primary{background:#f97316}.blue{background:#2563eb}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.set{background:#081421;border-radius:12px;padding:11px;margin:8px 0}.set b{font-size:25px;color:#fde68a}.clocks{display:grid;grid-template-columns:1.5fr 1fr;gap:7px}.clock{background:#081421;border-radius:12px;padding:10px;text-align:center}.clock strong{display:block;font-size:38px;color:#fde68a;font-variant-numeric:tabular-nums}.clock.small strong{font-size:26px}.progress{height:7px;background:#17283b;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:#f97316;width:0}.badge{display:inline-block;background:#17283b;border-radius:999px;padding:5px 8px;font-size:12px}.hidden{display:none}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.field{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:800}.ath{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#17283b;border-radius:999px;padding:6px 8px;font-size:12px}.statusline{display:flex;justify-content:space-between;gap:8px;align-items:center}.gapbox{display:flex;gap:6px;align-items:center}.gapbox input{width:65px;padding:7px;border:0;border-radius:8px;background:#fff4bf;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media(max-width:450px){.form,.actions{grid-template-columns:1fr}.clock strong{font-size:34px}}</style></head><body><div class="app"><section id="selectView"><b><span class="orange">KUMSAL SPOR</span> • HAVUZ</b><div class="card hero"><h1>Bugünkü grupları seç</h1><p class="muted">Birden fazla grup seçilebilir. Her grup kendi antrenmanını bağımsız yürütür.</p><button class="btn primary" id="newBtn">+ YENİ GRUP</button></div><div id="newBox" class="card hidden"><div class="form"><input id="name" class="field" placeholder="Grup adı"><select id="profile" class="field"><option>Teknik</option><option>A1</option><option>Orta Mesafe</option><option>Sprint</option></select><select id="pool" class="field"><option>25 m</option><option>50 m</option></select><input id="members" class="field" placeholder="Sporcular: Elif, Mine, ..."></div><div class="actions" style="margin-top:8px"><button class="btn" id="cancel">VAZGEÇ</button><button class="btn green" id="save">KAYDET</button></div></div><div id="groups" class="grid"></div><button class="btn green" id="enter" style="width:100%;margin-top:10px;font-size:19px">HAVUZ EKRANINI AÇ →</button></section><section id="liveView" class="hidden"><b><span class="orange">KUMSAL SPOR</span> • CANLI HAVUZ</b><div class="card hero"><div class="statusline"><div><h2 style="margin:0">Canlı Antrenman</h2><span class="muted">Büyük sayaç tekrar • küçük sayaç toplam antrenman süresi</span></div><span class="badge" id="liveCount">0 grup canlı</span></div><div class="actions" style="margin-top:10px"><button class="btn green" id="allStart">▶ TÜMÜNÜ BAŞLAT</button><button class="btn red" id="allStop">■ TÜMÜNÜ DURDUR</button></div></div><div id="live" class="grid"></div><button class="btn" id="back" style="width:100%;margin-top:8px">← GRUP SEÇİMİNE DÖN</button></section></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);let groups=[];try{groups=JSON.parse(localStorage.getItem('ks_training_groups')||'[]');if(!Array.isArray(groups))groups=[]}catch(e){groups=[]}let selected=new Set(),sessions=[],raf=0,lastPersist=0;const setsFor=p=>p==='Sprint'?[{r:12,d:25,z:'SPR',send:45},{r:8,d:50,z:'RP',send:90}]:p==='Teknik'?[{r:8,d:50,z:'Teknik',send:75},{r:6,d:100,z:'A1',send:120}]:p==='A1'?[{r:10,d:100,z:'A1',send:110},{r:8,d:50,z:'Teknik',send:75}]:[{r:8,d:100,z:'A1',send:105},{r:10,d:150,z:'END2',send:150}];const fmt=s=>{s=Math.max(0,s||0);let m=Math.floor(s/60),sec=s%60;return m+':'+sec.toFixed(1).padStart(4,'0')};function norm(g){return{id:g.id||('g'+Date.now()+Math.random()),name:g.name||'Grup',profile:g.profile||'Orta Mesafe',pool:g.pool||'25 m',members:Array.isArray(g.members)?g.members:[]}}groups=groups.map(norm);function renderGroups(){$('groups').innerHTML=groups.map(g=>`<div class="group ${selected.has(g.id)?'sel':''}" data-id="${g.id}"><b>${g.name}</b><br><span class="muted">${g.profile} • ${g.pool} • ${g.members.length} sporcu</span><span style="float:right;font-size:24px">${selected.has(g.id)?'✓':''}</span></div>`).join('')||'<div class="card">Henüz grup yok. “Yeni Grup” ile oluştur.</div>'}function current(s,now=performance.now()){let add=s.running?(now-s.started)/1000:0;return{rep:s.repBase+add,total:s.totalBase+add}}function repInfo(s,t){let q=s.sets[s.si],cycle=q.send||60,n=Math.min(q.r,Math.floor(t.rep/cycle)+1),within=t.rep%cycle;return{q,n,within,pct:Math.min(100,within/cycle*100)}}function renderLive(){let now=performance.now();$('live').innerHTML=sessions.map(s=>{let t=current(s,now),ri=repInfo(s,t),q=ri.q;return`<div class="card ${s.running?'run':''}" id="card-${s.id}"><div class="statusline"><h2 style="margin:0">${s.name}</h2><span class="badge" id="badge-${s.id}">${s.running?'CANLI':'DURDU'}</span></div><span class="muted">${s.pool} • ${s.members.length} sporcu</span><div class="set"><small>ŞİMDİ YÜZÜLECEK</small><br><b>${q.r} × ${q.d} m • ${q.z}</b><br>Çıkış: ${fmt(q.send)} • Set ${s.si+1}/${s.sets.length} • <strong id="repno-${s.id}">Tekrar ${ri.n}/${q.r}</strong><div class="progress"><i id="bar-${s.id}" style="width:${ri.pct}%"></i></div></div><div class="clocks"><div class="clock"><small>TEKRAR SAYACI</small><strong id="rep-${s.id}">${fmt(ri.within)}</strong></div><div class="clock small"><small>GENEL SÜRE</small><strong id="total-${s.id}">${fmt(t.total)}</strong></div></div><div class="ath">${s.members.map(n=>`<span class="chip">${n}</span>`).join('')}</div><div class="gapbox" style="margin-top:8px"><span class="muted">Sporcu çıkış aralığı</span><input data-gap="${s.id}" type="number" min="1" step="0.5" value="${s.gap}"><b>sn</b></div><div class="actions" style="margin-top:8px"><button class="btn ${s.running?'red':'green'}" data-act="toggle" data-id="${s.id}">${s.running?'DURDUR':'▶ BAŞLAT'}</button><button class="btn blue" data-act="reset" data-id="${s.id}">↺ TEKRARI BAŞLAT</button><button class="btn primary" data-act="next" data-id="${s.id}">SONRAKİ SET →</button><button class="btn" data-act="prev" data-id="${s.id}">← ÖNCEKİ SET</button></div></div>`}).join('');updateLiveCount();ensureLoop()}function updateLiveCount(){$('liveCount').textContent=sessions.filter(s=>s.running).length+' grup canlı'}function updateClocks(ts){let now=performance.now(),running=false;sessions.forEach(s=>{if(!s.running)return;running=true;let t=current(s,now),ri=repInfo(s,t),q=ri.q;if(t.rep>=q.send*q.r){let total=t.total;s.running=false;s.totalBase=total;s.repBase=q.send*q.r;s.started=0;renderLive();return}let r=$('rep-'+s.id),tot=$('total-'+s.id),rn=$('repno-'+s.id),bar=$('bar-'+s.id);if(r)r.textContent=fmt(ri.within);if(tot)tot.textContent=fmt(t.total);if(rn)rn.textContent='Tekrar '+ri.n+'/'+q.r;if(bar)bar.style.width=ri.pct+'%'});updateLiveCount();if(now-lastPersist>5000){persist();lastPersist=now}if(running)raf=requestAnimationFrame(updateClocks);else raf=0}function ensureLoop(){if(!raf&&sessions.some(s=>s.running))raf=requestAnimationFrame(updateClocks)}function freeze(s,now=performance.now()){if(!s.running)return;let t=current(s,now);s.repBase=t.rep;s.totalBase=t.total;s.running=false;s.started=0}function start(s,now=performance.now()){if(s.running)return;s.running=true;s.started=now}function persist(){try{localStorage.setItem('ks_live_pool_session',JSON.stringify(sessions.map(s=>({...s,running:false,started:0}))))}catch(e){}}function toggle(id){let s=sessions.find(x=>x.id===id);if(!s)return;s.running?freeze(s):start(s);persist();renderLive()}function reset(id){let s=sessions.find(x=>x.id===id);if(!s)return;if(s.running){let now=performance.now(),t=current(s,now);s.totalBase=t.total;s.repBase=0;s.started=now}else s.repBase=0;persist();renderLive()}function changeSet(id,dir){let s=sessions.find(x=>x.id===id);if(!s)return;let next=Math.max(0,Math.min(s.sets.length-1,s.si+dir));if(next===s.si)return;let now=performance.now();if(s.running){let t=current(s,now);s.totalBase=t.total;s.started=now}s.repBase=0;s.si=next;persist();renderLive()}$('groups').onclick=e=>{let el=e.target.closest('[data-id]');if(!el)return;selected.has(el.dataset.id)?selected.delete(el.dataset.id):selected.add(el.dataset.id);renderGroups()};$('newBtn').onclick=()=>$('newBox').classList.remove('hidden');$('cancel').onclick=()=>$('newBox').classList.add('hidden');$('save').onclick=()=>{let name=$('name').value.trim();if(!name)return;let g=norm({id:'g'+Date.now(),name,profile:$('profile').value,pool:$('pool').value,members:$('members').value.split(',').map(x=>x.trim()).filter(Boolean)});groups.push(g);localStorage.setItem('ks_training_groups',JSON.stringify(groups));selected.add(g.id);$('name').value='';$('members').value='';$('newBox').classList.add('hidden');renderGroups()};$('enter').onclick=()=>{if(!selected.size)return;sessions=groups.filter(g=>selected.has(g.id)).map(g=>({id:g.id,name:g.name,pool:g.pool,members:g.members,sets:setsFor(g.profile),si:0,gap:3,running:false,started:0,repBase:0,totalBase:0}));$('selectView').classList.add('hidden');$('liveView').classList.remove('hidden');persist();renderLive()};$('live').onclick=e=>{let b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();let a=b.dataset.act,id=b.dataset.id;if(a==='toggle')toggle(id);else if(a==='reset')reset(id);else if(a==='next')changeSet(id,1);else if(a==='prev')changeSet(id,-1)};$('live').onchange=e=>{let i=e.target.closest('[data-gap]');if(!i)return;let s=sessions.find(x=>x.id===i.dataset.gap);if(s){s.gap=Math.max(1,Number(i.value)||3);i.value=s.gap;persist()}};$('allStart').onclick=()=>{let now=performance.now();sessions.forEach(s=>start(s,now));persist();renderLive()};$('allStop').onclick=()=>{let now=performance.now();sessions.forEach(s=>freeze(s,now));persist();renderLive()};$('back').onclick=()=>{let now=performance.now();sessions.forEach(s=>freeze(s,now));persist();if(raf){cancelAnimationFrame(raf);raf=0}$('liveView').classList.add('hidden');$('selectView').classList.remove('hidden')};window.addEventListener('beforeunload',persist);renderGroups()})();</script></body></html>
