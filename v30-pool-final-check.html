<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V30 Havuz Kontrol</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui}.app{max-width:1100px;margin:auto;padding:14px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:10px 0}.hero{border:2px solid #f97316}.orange{color:#f97316}.muted{color:#9fb0c2}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.group{background:#0b1726;border:2px solid #294058;border-radius:16px;padding:14px;cursor:pointer}.group.sel,.run{border-color:#22c55e}.btn{border:0;border-radius:12px;padding:13px;background:#17283b;color:#fff;font-weight:900}.green{background:#16a34a}.red{background:#991b1b}.primary{background:#f97316}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.set{background:#081421;border-radius:12px;padding:11px;margin:8px 0}.set b{font-size:25px;color:#fde68a}.clocks{display:grid;grid-template-columns:1.5fr 1fr;gap:7px}.clock{background:#081421;border-radius:12px;padding:10px;text-align:center}.clock strong{display:block;font-size:38px;color:#fde68a}.clock.small strong{font-size:26px}.badge{display:inline-block;background:#17283b;border-radius:999px;padding:5px 8px;font-size:12px}.hidden{display:none}.form{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:800}.ath{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#17283b;border-radius:999px;padding:6px 8px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media(max-width:450px){.form,.actions{grid-template-columns:1fr}}</style></head><body><div class="app"><section id="selectView"><b><span class="orange">KUMSAL SPOR</span> • HAVUZ</b><div class="card hero"><h1>Bugünkü grupları seç</h1><p class="muted">Bir veya birden fazla gruba dokun.</p><button class="btn primary" id="newBtn">+ YENİ GRUP</button></div><div id="newBox" class="card hidden"><div class="form"><input id="name" class="field" placeholder="Grup adı"><select id="profile" class="field"><option>Teknik</option><option>A1</option><option>Orta Mesafe</option><option>Sprint</option></select><select id="pool" class="field"><option>25 m</option><option>50 m</option></select><input id="members" class="field" placeholder="Sporcular: Elif, Mine, ..."></div><div class="actions" style="margin-top:8px"><button class="btn" id="cancel">VAZGEÇ</button><button class="btn green" id="save">KAYDET</button></div></div><div id="groups" class="grid"></div><button class="btn green" id="enter" style="width:100%;margin-top:10px;font-size:19px">HAVUZ EKRANINI AÇ →</button></section><section id="liveView" class="hidden"><b><span class="orange">KUMSAL SPOR</span> • CANLI HAVUZ</b><div class="card hero"><h2>Gruplar birbirinden bağımsız</h2><div class="actions"><button class="btn green" id="allStart">▶ TÜMÜNÜ BAŞLAT</button><button class="btn red" id="allStop">■ TÜMÜNÜ DURDUR</button></div></div><div id="live" class="grid"></div><button class="btn" id="back" style="width:100%;margin-top:8px">← GRUP SEÇİMİNE DÖN</button></section></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);let groups=[];try{groups=JSON.parse(localStorage.getItem('ks_training_groups')||'[]');if(!Array.isArray(groups))groups=[]}catch(e){groups=[]}let selected=new Set(),sessions=[];const setsFor=p=>p==='Sprint'?[{r:12,d:25,z:'SPR',send:45},{r:8,d:50,z:'RP',send:90}]:p==='Teknik'?[{r:8,d:50,z:'Teknik',send:75},{r:6,d:100,z:'A1',send:120}]:p==='A1'?[{r:10,d:100,z:'A1',send:110},{r:8,d:50,z:'Teknik',send:75}]:[{r:8,d:100,z:'A1',send:105},{r:10,d:150,z:'END2',send:150}];const fmt=s=>{s=Math.max(0,s);let m=Math.floor(s/60),sec=s%60;return m+':'+sec.toFixed(1).padStart(4,'0')};function norm(g){return{id:g.id||('g'+Date.now()+Math.random()),name:g.name||'Grup',profile:g.profile||'Orta Mesafe',pool:g.pool||'25 m',members:Array.isArray(g.members)?g.members:[]}}groups=groups.map(norm);function renderGroups(){$('groups').innerHTML=groups.map(g=>`<div class="group ${selected.has(g.id)?'sel':''}" data-id="${g.id}"><b>${g.name}</b><br><span class="muted">${g.profile} • ${g.pool} • ${g.members.length} sporcu</span><span style="float:right;font-size:24px">${selected.has(g.id)?'✓':''}</span></div>`).join('')||'<div class="card">Henüz grup yok. “Yeni Grup” ile oluştur.</div>'}function current(s,now=performance.now()){let add=s.running?(now-s.started)/1000:0;return{rep:s.repBase+add,total:s.totalBase+add}}function renderLive(){let now=performance.now();$('live').innerHTML=sessions.map(s=>{let q=s.sets[s.si],t=current(s,now);return`<div class="card ${s.running?'run':''}"><h2 style="margin:0">${s.name}</h2><span class="badge">${s.running?'CANLI':'DURDU'}</span> <span class="muted">${s.pool}</span><div class="set"><small>ŞİMDİ YÜZÜLECEK</small><br><b>${q.r} × ${q.d} m • ${q.z}</b><br>Çıkış: ${fmt(q.send)} • Set ${s.si+1}/${s.sets.length}</div><div class="clocks"><div class="clock"><small>TEKRAR SAYACI</small><strong>${fmt(t.rep)}</strong></div><div class="clock small"><small>GENEL SÜRE</small><strong>${fmt(t.total)}</strong></div></div><div class="ath">${s.members.map(n=>`<span class="chip">${n}</span>`).join('')}</div><div class="actions" style="margin-top:8px"><button class="btn ${s.running?'red':'green'}" data-act="toggle" data-id="${s.id}">${s.running?'DURDUR':'▶ BAŞLAT'}</button><button class="btn" data-act="reset" data-id="${s.id}">↺ TEKRAR SIFIRLA</button><button class="btn primary" data-act="next" data-id="${s.id}">SONRAKİ SET →</button><button class="btn" data-act="prev" data-id="${s.id}">← ÖNCEKİ SET</button></div></div>`}).join('')}function freeze(s,now=performance.now()){if(!s.running)return;let t=current(s,now);s.repBase=t.rep;s.totalBase=t.total;s.running=false;s.started=0}function start(s,now=performance.now()){if(s.running)return;s.running=true;s.started=now}function toggle(id){let s=sessions.find(x=>x.id===id);if(!s)return;s.running?freeze(s):start(s);renderLive()}function reset(id){let s=sessions.find(x=>x.id===id);if(!s)return;if(s.running){let now=performance.now(),t=current(s,now);s.totalBase=t.total;s.repBase=0;s.started=now}else s.repBase=0;renderLive()}function changeSet(id,dir){let s=sessions.find(x=>x.id===id);if(!s)return;let now=performance.now();if(s.running){let t=current(s,now);s.totalBase=t.total;s.started=now}s.repBase=0;s.si=Math.max(0,Math.min(s.sets.length-1,s.si+dir));renderLive()}$('groups').onclick=e=>{let el=e.target.closest('[data-id]');if(!el)return;selected.has(el.dataset.id)?selected.delete(el.dataset.id):selected.add(el.dataset.id);renderGroups()};$('newBtn').onclick=()=>$('newBox').classList.remove('hidden');$('cancel').onclick=()=>$('newBox').classList.add('hidden');$('save').onclick=()=>{let name=$('name').value.trim();if(!name)return;let g=norm({id:'g'+Date.now(),name,profile:$('profile').value,pool:$('pool').value,members:$('members').value.split(',').map(x=>x.trim()).filter(Boolean)});groups.push(g);localStorage.setItem('ks_training_groups',JSON.stringify(groups));selected.add(g.id);$('name').value='';$('members').value='';$('newBox').classList.add('hidden');renderGroups()};$('enter').onclick=()=>{if(!selected.size)return;sessions=groups.filter(g=>selected.has(g.id)).map(g=>({id:g.id,name:g.name,pool:g.pool,members:g.members,sets:setsFor(g.profile),si:0,running:false,started:0,repBase:0,totalBase:0}));$('selectView').classList.add('hidden');$('liveView').classList.remove('hidden');renderLive()};$('live').onclick=e=>{let b=e.target.closest('[data-act]');if(!b)return;({toggle,reset,next:id=>changeSet(id,1),prev:id=>changeSet(id,-1)})[b.dataset.act](b.dataset.id)};$('allStart').onclick=()=>{let now=performance.now();sessions.forEach(s=>start(s,now));renderLive()};$('allStop').onclick=()=>{let now=performance.now();sessions.forEach(s=>freeze(s,now));renderLive()};$('back').onclick=()=>{let now=performance.now();sessions.forEach(s=>freeze(s,now));$('liveView').classList.add('hidden');$('selectView').classList.remove('hidden')};setInterval(()=>{if(sessions.some(s=>s.running))renderLive()},100);renderGroups()})();</script></body></html>
