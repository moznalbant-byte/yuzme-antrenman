<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V31 Tablet</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui}.app{max-width:1100px;margin:auto;padding:14px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:10px 0}.hero{border:2px solid #f97316}.orange{color:#f97316}.muted{color:#9fb0c2}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.code{font-size:34px;letter-spacing:6px;color:#fde68a;font-weight:950}.set{font-size:38px;color:#fde68a;font-weight:950}.clock{text-align:center;font-size:110px;color:#fde68a;font-weight:950;font-variant-numeric:tabular-nums}.ath{display:grid;grid-template-columns:1.3fr .8fr .8fr .7fr;gap:7px;background:#081421;border-radius:12px;padding:10px;margin:6px 0}.ath.ok{border:2px solid #22c55e}.btn{width:100%;border:0;border-radius:13px;padding:15px;background:#f97316;color:white;font-weight:950;font-size:18px}.badge{background:#14532d;padding:6px 9px;border-radius:99px}@media(max-width:760px){.layout{grid-template-columns:1fr}.clock{font-size:76px}.set{font-size:29px}.ath{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><b><span class="orange">KUMSAL SPOR</span> • TABLET ANA EKRAN</b><div class="card hero"><div class="muted">TELEFONLAR BU 6 HANELİ KODLA BAĞLANIR</div><div id="code" class="code">------</div><span class="badge">CANLI BULUT BAĞLANTISI</span></div><div class="layout"><div class="card"><div class="muted">ŞİMDİ YÜZÜLÜYOR</div><div class="set">8 × 100 m • A1 Serbest</div><p>Tekrar 1/8 • Çıkış 1:45 • Sporcular 3 sn arayla</p><h3>GELMESİ GEREKEN DERECELER</h3><div id="aths"></div></div><div class="card"><div class="muted" style="text-align:center">TEKRAR KRONOMETRESİ</div><div id="clock" class="clock">0:00.0</div><div id="msg" style="text-align:center;font-weight:900;margin:8px">Telefon bağlanabilir</div><button id="start" class="btn">▶ TEKRARI BAŞLAT</button></div></div></div><script>const API='https://npsnbbrskgxuyossjvnc.supabase.co/functions/v1/swim-live';async function call(action,body={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...body})});return r.json()};const A=[['Elif Gönül Acar','1:10–1:13','25–28 sn'],['Mine Filiz','1:14–1:17','25–30 sn'],['Hasan Ege Ceylan','1:08–1:12','25–28 sn']];let code=localStorage.ks_live_code||String(Math.floor(100000+Math.random()*900000)),s=null,arr={},raf=0,lastPoll=0;localStorage.ks_live_code=code;document.getElementById('code').textContent=code;const fmt=x=>Math.floor(x/60)+':'+(x%60).toFixed(1).padStart(4,'0');function draw(){aths.innerHTML=A.map(a=>{let x=arr[a[0]];return '<div class="ath '+(x?'ok':'')+'"><b>'+a[0]+'</b><strong>'+a[1]+'</strong><span>Dinlenme '+a[2]+'</span><span>'+(x?fmt(x.elapsed_ms/1000)+' ✓':'Yüzüyor')+'</span></div>'}).join('')}async function boot(){let x=await call('create',{code,group_name:'Aktif Grup',workout:{title:'8 × 100 m • A1 Serbest',repeat:1,repeats:8,send:105,gap:3,athletes:A}});s=x.session;draw();animate();poll()}function animate(){let st=s?.state||{},e=st.running&&st.started_at?(Date.now()-new Date(st.started_at).getTime())/1000:0;clock.textContent=fmt(Math.max(0,e%105));start.textContent=st.running?'■ DURDUR':'▶ TEKRARI BAŞLAT';raf=requestAnimationFrame(animate)}async function poll(){try{let x=await call('get',{code});if(x.session)s=x.session;(x.arrivals||[]).forEach(v=>arr[v.athlete_name]=v);draw()}catch(e){}setTimeout(poll,500)}start.onclick=async()=>{let run=!(s?.state||{}).running,state={running:run,started_at:run?new Date().toISOString():null,repeat:1};let x=await call('state',{code,state});s=x.session;if(run){arr={};draw()}};boot();</script></body></html>
