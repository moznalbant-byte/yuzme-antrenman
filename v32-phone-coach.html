<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Antrenör Telefonu Canlı</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;touch-action:manipulation}.app{max-width:520px;margin:auto;padding:12px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:9px 0}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.field{width:100%;padding:15px;border:0;border-radius:12px;background:#fff4bf;font-size:22px;font-weight:950;text-transform:uppercase;letter-spacing:3px}.btn{width:100%;border:0;border-radius:14px;padding:18px;color:white;font-size:19px;font-weight:950;background:#16a34a;margin-top:8px}.ath{background:#081421;border-radius:16px;padding:13px;margin:8px 0}.target{font-size:21px;font-weight:950;color:#fde68a}.timer{text-align:center;font-size:58px;font-weight:950;color:#fde68a;font-variant-numeric:tabular-nums}.status{padding:6px 9px;border-radius:99px;background:#7f1d1d}.on{background:#14532d}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}</style></head><body><div class="app"><b><span class="orange">ANTRENÖR TELEFONU</span></b><div id="joinBox" class="card"><div class="muted">TABLETTEKİ 6 HANELİ SEANS KODU</div><input id="code" class="field" maxlength="6" placeholder="ABC123"><button id="join" class="btn">SEANSA BAĞLAN</button></div><div id="live" style="display:none"><div class="card"><div class="row"><div><b id="title">Canlı Antrenman</b><div class="muted" id="rep">Tekrar 1/8</div></div><span id="conn" class="status on">BAĞLI</span></div><div id="timer" class="timer">0:00.0</div></div><div id="athletes"></div></div></div><script>const URL='https://npsnbbrskgxuyossjvnc.supabase.co',KEY='sb_publishable_jtLARIT9HuqTCmbIMxCNQQ_XQLwEyjj',db=supabase.createClient(URL,KEY);const $=x=>document.getElementById(x),fmt=s=>Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');let code='',state={},athletes=[],done={};function draw(){ $('athletes').innerHTML=athletes.map((a,i)=>'<div class="ath"><b>'+a.n+'</b><div class="muted">HEDEF • DİNLENME</div><div class="target">'+a.t+'</div><div>'+a.r+'</div><button class="btn" '+(done[a.n]?'disabled':'')+' onclick="arrive('+i+')">'+(done[a.n]?done[a.n]+' ✓':'GELDİ')+'</button></div>').join('')}async function join(){code=$('code').value.trim().toUpperCase();let {data,error}=await db.from('live_sessions').select('*').eq('code',code).single();if(error||!data){alert('Seans bulunamadı. Kodu kontrol et.');return}athletes=data.workout?.athletes||[];$('title').textContent=data.workout?.title||data.group_name;apply(data.state);$('joinBox').style.display='none';$('live').style.display='block';draw();db.channel('phone-'+code).on('postgres_changes',{event:'UPDATE',schema:'public',table:'live_sessions',filter:'code=eq.'+code},p=>{done={};apply(p.new.state);draw()}).subscribe()}function apply(s){state=s||{};$('rep').textContent='Tekrar '+(state.rep||1)+'/8'}window.arrive=async i=>{if(!state.running||!state.started_at){alert('Tablet henüz tekrarı başlatmadı.');return}let a=athletes[i],ms=Math.max(0,Date.now()-Date.parse(state.started_at)-i*3000);let val=fmt(ms/1000);let {error}=await db.from('live_arrivals').insert({session_code:code,athlete_name:a.n,repeat_no:state.rep||1,elapsed_ms:Math.round(ms),target_text:a.t,rest_text:a.r});if(!error){done[a.n]=val;draw()}};function tick(){if(state.running&&state.started_at)$('timer').textContent=fmt((Date.now()-Date.parse(state.started_at))/1000);requestAnimationFrame(tick)}$('join').onclick=join;tick();</script></body></html>
