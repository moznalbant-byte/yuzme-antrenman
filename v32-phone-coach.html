<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Antrenör Telefonu</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;touch-action:manipulation}.app{max-width:520px;margin:auto;padding:12px}.top,.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.set{font-size:25px;font-weight:950;color:#fde68a}.ath{background:#0b1726;border:2px solid #294058;border-radius:18px;padding:13px;margin:9px 0}.ath.next{border-color:#f97316}.row{display:flex;justify-content:space-between;gap:8px}.target{font-size:22px;font-weight:900}.btn{width:100%;border:0;border-radius:14px;padding:18px;color:white;font-weight:950;font-size:20px;background:#16a34a;margin-top:9px}.btn:active{transform:scale(.985)}.timer{text-align:center;font-size:54px;font-weight:950;font-variant-numeric:tabular-nums;color:#fde68a}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px}.nav a{padding:12px;border-radius:12px;background:#17283b;color:white;text-decoration:none;text-align:center;font-weight:800}</style></head><body><div class="app"><div class="top"><b><span class="orange">ANTRENÖR TELEFONU</span></b><div class="muted">Canlı derece kumandası</div></div><div class="card"><div class="muted">ŞİMDİ YÜZÜLÜYOR</div><div class="set">8 × 100 m • A1 Serbest</div><div class="muted">Tekrar 1/8 • Sporcular 3 sn arayla çıkıyor</div><div id="timer" class="timer">0:00.0</div><button id="start" class="btn">▶ TEKRARI BAŞLAT</button></div><div id="athletes"></div><div class="nav"><a href="v31-live-coach.html">📲 Tablet</a><a href="v34-device-home.html">⌂ Cihaz Seç</a></div></div><script>const names=[['Elif Gönül Acar','1:10–1:13','25–28 sn'],['Mine Filiz','1:14–1:17','25–30 sn'],['Hasan Ege Ceylan','1:08–1:12','25–28 sn']];let start=0,run=false,raf=0,done={};const fmt=s=>Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');function draw(){document.getElementById('athletes').innerHTML=names.map((a,i)=>'<div class="ath '+(!done[i]?'next':'')+'"><div class="row"><div><b>'+a[0]+'</b><div class="muted">Hedef • Dinlenme</div></div><div class="target">'+a[1]+'</div></div><div class="muted">Planlanan dinlenme: '+a[2]+'</div><button class="btn" onclick="arrive('+i+')">'+(done[i]?done[i]+' ✓':'GELDİ')+'</button></div>').join('')}function tick(){if(!run)return;document.getElementById('timer').textContent=fmt((performance.now()-start)/1000);raf=requestAnimationFrame(tick)}document.getElementById('start').onclick=()=>{start=performance.now();run=true;done={};draw();tick()};window.arrive=i=>{if(!run)return;done[i]=fmt(Math.max(0,(performance.now()-start)/1000-i*3));draw()};draw();</script></body></html>
