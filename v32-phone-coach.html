<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>V32 Telefon</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;touch-action:manipulation}.app{max-width:520px;margin:auto;padding:12px}.card,.ath{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin-bottom:10px}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.join{display:flex;gap:6px}.join input{min-width:0;flex:1;padding:14px;border:0;border-radius:12px;background:#fff4bf;font-size:23px;font-weight:950;letter-spacing:4px}.btn{border:0;border-radius:13px;padding:15px;background:#f97316;color:white;font-weight:950}.timer{text-align:center;font-size:58px;font-weight:950;color:#fde68a;font-variant-numeric:tabular-nums}.ath{background:#0b1726;border:2px solid #294058}.ath.ok{border-color:#22c55e}.row{display:flex;justify-content:space-between;gap:7px}.target{font-size:21px;font-weight:950}.arrive{width:100%;background:#16a34a;font-size:22px;margin-top:9px}</style></head><body><div class="app"><div class="card"><b><span class="orange">ANTRENÖR TELEFONU</span></b><div class="muted">Tabletteki kodu gir</div><div class="join"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button id="join" class="btn">BAĞLAN</button></div><div id="msg" class="muted"></div></div><div id="work" style="display:none"><div class="card"><div class="muted">ŞİMDİ YÜZÜLÜYOR</div><h2 style="color:#fde68a;margin:4px 0">8 × 100 m • A1 Serbest</h2><div id="timer" class="timer">0:00.0</div><div id="state" style="text-align:center;font-weight:900">Bekliyor</div></div><div id="aths"></div></div></div><script>const API='https://npsnbbrskgxuyossjvnc.supabase.co/functions/v1/swim-live';async function call(action,body={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...body})});return r.json()};let code='',s=null,arr={};const fmt=x=>Math.floor(x/60)+':'+(x%60).toFixed(1).padStart(4,'0');function A(){return s?.workout?.athletes||[]}function draw(){aths.innerHTML=A().map((a,i)=>{let x=arr[a[0]];return '<div class="ath '+(x?'ok':'')+'"><div class="row"><div><b>'+a[0]+'</b><div class="muted">Hedef • Dinlenme '+a[2]+'</div></div><div class="target">'+a[1]+'</div></div><button class="btn arrive" onclick="came('+i+')" '+(x?'disabled':'')+'>'+(x?fmt(x.elapsed_ms/1000)+' ✓':'GELDİ')+'</button></div>'}).join('')}async function connect(){code=document.getElementById('code').value.replace(/\D/g,'').slice(0,6);let x=await call('get',{code});if(!x.session){msg.textContent='Seans bulunamadı';return}s=x.session;work.style.display='block';msg.textContent='CANLI SEANSA BAĞLANDI';(x.arrivals||[]).forEach(v=>arr[v.athlete_name]=v);draw();poll()}async function poll(){let x=await call('get',{code});if(x.session)s=x.session;(x.arrivals||[]).forEach(v=>arr[v.athlete_name]=v);draw();let st=s?.state||{},e=st.running&&st.started_at?(Date.now()-new Date(st.started_at).getTime())/1000:0;timer.textContent=fmt(Math.max(0,e%105));state.textContent=st.running?'YÜZÜYOR • GELDİ AKTİF':'TABLET BAŞLATMAYI BEKLİYOR';setTimeout(poll,400)}window.came=async i=>{let st=s?.state||{};if(!st.running||!st.started_at)return;let a=A()[i],ms=Date.now()-new Date(st.started_at).getTime()-i*((s.workout?.gap||3)*1000);if(ms<0)return;let x=await call('arrive',{code,athlete_name:a[0],repeat_no:st.repeat||1,elapsed_ms:Math.round(ms),target_text:a[1],rest_text:a[2]});if(x.arrival){arr[a[0]]=x.arrival;draw();if(navigator.vibrate)navigator.vibrate(40)}};join.onclick=connect;</script></body></html>
