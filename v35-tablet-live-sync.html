<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablet Canlı Havuz</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui}.app{max-width:1050px;margin:auto;padding:14px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:10px 0}.hero{border:2px solid #f97316}.orange{color:#f97316}.muted{color:#9fb0c2}.code{font-size:38px;font-weight:950;letter-spacing:5px;color:#fde68a}.set{font-size:32px;font-weight:950}.timer{font-size:82px;font-weight:950;text-align:center;color:#fde68a;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ath{background:#081421;border-radius:14px;padding:12px}.ath b{font-size:20px}.target{font-size:22px;color:#fde68a;font-weight:900}.actual{font-size:27px;font-weight:950;color:#86efac}.btn{border:0;border-radius:12px;padding:14px;background:#17283b;color:#fff;font-weight:900}.green{background:#16a34a}.red{background:#991b1b}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.status{padding:5px 8px;border-radius:99px;background:#7f1d1d}.on{background:#14532d}@media(max-width:650px){.grid{grid-template-columns:1fr}.timer{font-size:58px}}</style></head><body><div class="app"><b><span class="orange">TABLET • ANA HAVUZ EKRANI</span></b><div class="card hero"><div class="row"><div><span class="muted">CANLI SEANS KODU</span><div id="code" class="code">------</div></div><span id="conn" class="status">BAĞLANIYOR</span></div><div class="muted">Telefon bu kodla bağlanacak.</div></div><div class="card"><div class="muted">ŞİMDİ YÜZÜLÜYOR</div><div class="set">8 × 100 m • A1 Serbest</div><div class="timer" id="timer">0:00.0</div><div class="row"><b id="rep">Tekrar 1/8</b><div><button id="start" class="btn green">▶ BAŞLAT</button> <button id="reset" class="btn">↺ TEKRAR</button></div></div></div><div id="athletes" class="grid"></div></div><script>const URL='https://npsnbbrskgxuyossjvnc.supabase.co',KEY='sb_publishable_jtLARIT9HuqTCmbIMxCNQQ_XQLwEyjj',db=supabase.createClient(URL,KEY);const athletes=[{n:'Elif Gönül Acar',t:'1:10–1:13',r:'25–28 sn'},{n:'Mine Filiz',t:'1:14–1:17',r:'25–30 sn'},{n:'Hasan Ege Ceylan',t:'1:08–1:12',r:'25–28 sn'}];let code='',started=0,running=false,rep=1,arrivals={};const $=x=>document.getElementById(x),fmt=s=>Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');function draw(){ $('athletes').innerHTML=athletes.map(a=>'<div class="ath"><b>'+a.n+'</b><div class="muted">HEDEF • DİNLENME</div><div class="target">'+a.t+'</div><div>'+a.r+'</div><div class="actual">'+(arrivals[a.n]||'—')+'</div></div>').join('')}async function make(){code=Math.random().toString(36).slice(2,8).toUpperCase();$('code').textContent=code;let state={running:false,rep:1,started_at:null};let {error}=await db.from('live_sessions').insert({code,group_name:'A1 Grup',workout:{title:'8 × 100 m • A1 Serbest',athletes},state});if(error){$('conn').textContent='HATA';console.error(error);return}$('conn').textContent='CANLI';$('conn').classList.add('on');subscribe()}function subscribe(){db.channel('tablet-'+code).on('postgres_changes',{event:'INSERT',schema:'public',table:'live_arrivals',filter:'session_code=eq.'+code},p=>{arrivals[p.new.athlete_name]=fmt(p.new.elapsed_ms/1000);draw()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'live_sessions',filter:'code=eq.'+code},p=>apply(p.new.state)).subscribe()}function apply(s){if(!s)return;rep=s.rep||rep;$('rep').textContent='Tekrar '+rep+'/8';if(s.running&&s.started_at){started=Date.parse(s.started_at);running=true}else running=false}async function push(){await db.from('live_sessions').update({state:{running,rep,started_at:running?new Date(started).toISOString():null},updated_at:new Date().toISOString()}).eq('code',code)}$('start').onclick=async()=>{running=!running;if(running){started=Date.now();arrivals={};draw();$('start').textContent='■ DURDUR';$('start').className='btn red'}else{$('start').textContent='▶ BAŞLAT';$('start').className='btn green'}await push()};$('reset').onclick=async()=>{rep=Math.min(8,rep+1);started=Date.now();running=true;arrivals={};draw();await push()};function tick(){if(running)$('timer').textContent=fmt((Date.now()-started)/1000);requestAnimationFrame(tick)}draw();make();tick();</script></body></html>
