<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canlı Tablet</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;touch-action:manipulation}.app{max-width:1100px;margin:auto;padding:12px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:14px;margin:9px 0}.hero{border:2px solid #f97316}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.code{font-size:34px;font-weight:950;letter-spacing:4px;color:#fde68a}.set{font-size:30px;font-weight:950;color:#fde68a}.timer{font-size:clamp(66px,10vw,110px);font-weight:950;text-align:center;color:#fde68a;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ath{background:#081421;border-radius:14px;padding:11px}.target{font-size:20px;font-weight:900;color:#fde68a}.actual{font-size:26px;font-weight:950;color:#86efac}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.btn{border:0;border-radius:12px;padding:13px;background:#17283b;color:#fff;font-weight:900}.green{background:#16a34a}.red{background:#991b1b}.primary{background:#f97316}.badge{padding:5px 8px;border-radius:99px;background:#7f1d1d}.on{background:#14532d}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}@media(max-width:650px){.grid{grid-template-columns:1fr}.nav{grid-template-columns:1fr}.set{font-size:25px}}</style></head><body><div class="app"><b><span class="orange">CANLI TABLET</span></b><div class="card hero"><div class="row"><div><span class="muted">SEANS KODU</span><div id="code" class="code">------</div></div><span id="conn" class="badge">BAĞLANIYOR</span></div><div class="muted">Antrenör telefonu bu kodla bağlanır.</div></div><div class="card"><div class="muted">ŞİMDİ YÜZÜLÜYOR</div><div id="set" class="set"></div><div id="meta" class="muted"></div><div id="timer" class="timer">0:00.0</div><div class="row"><b id="rep"></b><div><button id="start" class="btn green">▶ BAŞLAT</button> <button id="nextRep" class="btn">↺ TEKRAR</button></div></div></div><div id="athletes" class="grid"></div><div class="nav"><button id="prevSet" class="btn">← ÖNCEKİ SET</button><button id="nextSet" class="btn primary">SONRAKİ SET →</button><button class="btn" onclick="location.href='v34-device-home.html'">ANA MENÜ</button></div></div><script>const URL='https://npsnbbrskgxuyossjvnc.supabase.co',KEY='sb_publishable_jtLARIT9HuqTCmbIMxCNQQ_XQLwEyjj',db=supabase.createClient(URL,KEY),$=x=>document.getElementById(x),fmt=s=>Math.floor(Math.max(0,s)/60)+':'+(Math.max(0,s)%60).toFixed(1).padStart(4,'0');let w=JSON.parse(localStorage.getItem('ks_v21_workout')||'null'),code='',si=0,rep=1,running=false,started=0,arrivals={};if(!w||!w.sets?.length){w={group:{name:'Demo Grup'},pool:'50 m',athletes:['Elif Gönül Acar'],sets:[{r:8,d:100,z:'A1',s:'Serbest',send:105}],targets:{}}}function ath(){return w.athletes||[]}function target(n){return w.targets?.[si]?.[n]||null}function draw(){let q=w.sets[si],max=q.r||1;$('set').textContent=q.r+' × '+q.d+' m • '+q.z+' • '+q.s;$('meta').textContent='Set '+(si+1)+'/'+w.sets.length+' • Çıkış '+fmt(q.send)+' • '+(w.pool||'');$('rep').textContent='Tekrar '+rep+'/'+max;$('athletes').innerHTML=ath().map(n=>{let t=target(n),tar=t?fmt(t.lo)+'–'+fmt(t.hi):'Hedef veri yok',rest=t?fmt(t.restLo)+'–'+fmt(t.restHi):'—';return '<div class="ath"><b>'+n+'</b><div class="muted">HEDEF • DİNLENME</div><div class="target">'+tar+' • '+rest+'</div><div class="actual">'+(arrivals[n]||'—')+'</div></div>'}).join('')}async function make(){code=Math.random().toString(36).slice(2,8).toUpperCase();$('code').textContent=code;let state={running:false,set_index:si,rep,started_at:null};let {error}=await db.from('live_sessions').insert({code,group_name:w.group?.name||w.age+' '+w.profile,workout:w,state});if(error){$('conn').textContent='HATA';return}$('conn').textContent='CANLI';$('conn').classList.add('on');db.channel('tab-'+code).on('postgres_changes',{event:'INSERT',schema:'public',table:'live_arrivals',filter:'session_code=eq.'+code},p=>{if(p.new.repeat_no===rep){arrivals[p.new.athlete_name]=fmt(p.new.elapsed_ms/1000);draw()}}).subscribe()}async function push(){await db.from('live_sessions').update({state:{running,set_index:si,rep,started_at:running?new Date(started).toISOString():null},updated_at:new Date().toISOString()}).eq('code',code)}function begin(){running=!running;if(running){started=Date.now();arrivals={};$('start').textContent='■ DURDUR';$('start').className='btn red'}else{$('start').textContent='▶ DEVAM';$('start').className='btn green'}draw();push()}function newRep(){rep=Math.min(w.sets[si].r,rep+1);running=true;started=Date.now();arrivals={};draw();push()}function setMove(d){si=Math.max(0,Math.min(w.sets.length-1,si+d));rep=1;running=false;arrivals={};$('start').textContent='▶ BAŞLAT';$('start').className='btn green';draw();push()}function tick(){if(running)$('timer').textContent=fmt((Date.now()-started)/1000);requestAnimationFrame(tick)}$('start').onclick=begin;$('nextRep').onclick=newRep;$('prevSet').onclick=()=>setMove(-1);$('nextSet').onclick=()=>setMove(1);draw();make();tick();</script></body></html>
