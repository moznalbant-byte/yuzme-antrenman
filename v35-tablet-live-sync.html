<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Canlı Havuz</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;touch-action:manipulation}.app{max-width:1150px;margin:auto;padding:10px}.card{background:#101d2d;border:1px solid #294058;border-radius:17px;padding:12px;margin:8px 0}.hero{border:2px solid #f97316}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.code{font-size:30px;font-weight:950;letter-spacing:4px;color:#fde68a}.set{font-size:30px;font-weight:950;color:#fde68a}.clock{font-size:clamp(70px,11vw,125px);font-weight:950;text-align:center;color:#fde68a;line-height:1;font-variant-numeric:tabular-nums}.total{font-size:28px;font-weight:950;font-variant-numeric:tabular-nums}.signal{text-align:center;border-radius:14px;padding:10px;font-size:28px;font-weight:950;background:#17283b}.signal.go{background:#16a34a}.signal.ready{background:#d97706}.signal.rest{background:#2563eb}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:9px}.ath{background:#081421;border:2px solid #294058;border-radius:13px;padding:10px;margin:6px 0}.ath.next{border-color:#f59e0b}.ath.swim{border-color:#22c55e}.ath.done{opacity:.75}.name{font-size:18px;font-weight:950}.target{color:#fde68a;font-weight:900;font-size:19px}.actual{color:#86efac;font-weight:950;font-size:22px}.btn{border:0;border-radius:11px;padding:12px;background:#17283b;color:#fff;font-weight:900}.green{background:#16a34a}.red{background:#991b1b}.primary{background:#f97316}.blue{background:#2563eb}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.badge{padding:5px 8px;border-radius:99px;background:#7f1d1d}.on{background:#14532d}.plan{display:none}.plan.on{display:block}.setrow{padding:9px;background:#081421;border-radius:10px;margin:5px 0;border:1px solid #294058}.setrow.active{border-color:#f97316}.gap{width:75px;padding:8px;border:0;border-radius:8px;background:#fff4bf;font-weight:900}.finish{width:100%;margin-top:6px;background:#2563eb}@media(max-width:760px){.grid{grid-template-columns:1fr}.set{font-size:24px}.nav{grid-template-columns:1fr 1fr}.clock{font-size:76px}}</style></head><body><div class="app"><div class="row"><b><span class="orange">CANLI HAVUZ • TABLET</span></b><button class="btn" onclick="location.href='v34-device-home.html'">⌂</button></div><div class="card hero"><div class="row"><div><div class="muted">ANTRENÖR TELEFONU SEANS KODU</div><div id="code" class="code">------</div></div><span id="conn" class="badge">BAĞLANIYOR</span></div></div><div class="card"><div class="row"><div><div class="muted">ŞİMDİ YÜZÜLÜYOR</div><div id="set" class="set"></div><div id="meta" class="muted"></div></div><button id="planBtn" class="btn">☰ TÜM PLAN</button></div></div><div id="plan" class="card plan"></div><div class="grid"><div><div class="card"><div id="signal" class="signal">HAZIR</div><div id="who" style="text-align:center;font-size:21px;font-weight:950;margin:7px"></div><div class="muted" style="text-align:center">TEKRAR SAYACI</div><div id="clock" class="clock">0:00.0</div><div class="row"><div><span class="muted">GENEL ANTRENMAN</span><div id="total" class="total">0:00.0</div></div><b id="rep"></b></div><div class="actions" style="margin-top:8px"><button id="start" class="btn green">▶ BAŞLAT</button><button id="nextRep" class="btn blue">↺ SONRAKİ TEKRAR</button></div></div><div class="card"><div class="row"><b>Sporcular</b><label class="muted">Çıkış arası <input id="gap" class="gap" type="number" value="3" min="0" step=".5"> sn</label></div><div id="athletes"></div></div></div><div><div class="card"><b>Set Kontrolü</b><div class="nav" style="margin-top:8px"><button id="prevSet" class="b const URL='https://npsnbbrskgxuyossjvnc.supabase.co',KEY='sb_publishable_jtLARIT9HuqTCmbIMxCNQQ_XQLwEyjj',db=supabase.createClient(URL,KEY),$=x=>document.getElementById(x),fmt=s=>{s=Math.max(0,s||0);let m=Math.floor(s/60),x=s-m*60;return m+':'+x.toFixed(1).padStart(4,'0')};let w=JSON.parse(localStorage.getItem('ks_v21_workout')||'null'),code='',si=0,rep=1,running=false,repStart=0,totalStart=0,totalBase=0,arr={},statuses={};if(!w?.sets?.length){w={group:{name:'Demo'},pool:'50 m',athletes:['Elif Gönül Acar'],sets:[{r:8,d:100,z:'A1',s:'Serbest',send:105}],targets:{}}}const ath=()=>w.athletes||[],q=()=>w.sets[si],target=n=>w.targets?.[si]?.[n]||null;function plan(){ $('plan').innerHTML='<b>TÜM ANTRENMAN</b>'+w.sets.map((x,i)=>'<div class="setrow '+(i===si?'active':'')+'">'+(i+1)+'. <b>'+x.r+' × '+x.d+' m</b> • '+x.z+' • '+x.s+' • çıkış '+fmt(x.send)+'</div>').join('')}function draw(){let x=q();$('set').textContent=x.r+' × '+x.d+' m • '+x.z+' • '+x.s;$('meta').textContent='Set '+(si+1)+'/'+w.sets.length+' • Çıkış '+fmt(x.send)+' • '+(w.pool||'')+' • Sporcu arası '+$('gap').value+' sn';$('rep').textContent='Tekrar '+rep+'/'+x.r;$('athletes').innerHTML=ath().map((n,i)=>{let t=target(n),st=statuses[n]||'',tar=t?fmt(t.lo)+'–'+fmt(t.hi):'—',rest=t?fmt(t.restLo)+'–'+fmt(t.restHi):'—';return '<div class="ath '+st+'"><div class="row"><div><div class="name">'+(i+1)+'. '+n+'</div><div class="muted">HEDEF • DİNLENME</div><div class="target">'+tar+' • '+rest+'</div></div><div class="actual">'+(arr[n]||'—')+'</div></div></div>'}).join('');$('finishButtons').innerHTML=ath().map((n,i)=>'<button class="btn finish" data-i="'+i+'">'+n+' GELDİ</button>').join('');plan()}async function createSession(){code=Math.random().toString(36).slice(2,8).toUpperCase();$('code').textContent=code;let {error}=await db.from('live_sessions').insert({code,group_name:w.group?.name||w.age+' '+w.profile,workout:w,state:state()});if(error){$('conn').textContent='OFFLINE';return}$('conn').textContent='CANLI';$('conn').classList.add('on');db.channel('tablet-'+code).on('postgres_changes',{event:'INSERT',schema:'public',table:'live_arrivals',filter:'session_code=eq.'+code},p=>{if(p.new.repeat_no===rep){arr[p.new.athlete_name]=fmt(p.new.elapsed_ms/1000);statuses[p.new.athlete_name]='done';draw()}}).subscribe()}function state(){return{running,set_index:si,rep,started_at:running?new Date(repStart).toISOString():null,gap:Number($('gap').value)||0,total_elapsed_ms:Math.round((totalBase+(running?(Date.now()-totalStart):0)))}}async function push(){if(code)await db.from('live_sessions').update({state:state(),updated_at:new Date().toISOString()}).eq('code',code)}function start(){if(running){totalBase+=Date.now()-totalStart;running=false;$('start').textContent='▶ DEVAM';$('start').className='btn green';$('signal').textContent='DURDU';$('signal').className='signal'}else{running=true;repStart=Date.now();totalStart=Date.now();arr={};statuses={};$('start').textContent='■ DURDUR';$('start').className='btn red'}draw();push()}function nextRep(){if(running)totalBase+=Date.now()-totalStart;rep=Math.min(q().r,rep+1);running=true;repStart=Date.now();totalStart=Date.now();arr={};statuses={};draw();push()}function move(d){if(running)totalBase+=Date.now()-totalStart;si=Math.max(0,Math.min(w.sets.length-1,si+d));rep=1;running=false;arr={};statuses={};$('start').textContent='▶ BAŞLAT';$('start').className='btn green';$('signal').textContent='HAZIR';$('signal').className='signal';draw();push()}async function arrived(i){if(!running)return;let n=ath()[i],gap=Number($('gap').value)||0,ms=Math.max(0,Date.now()-repStart-i*gap*1000),t=target(n);arr[n]=fmt(ms/1000);statuses[n]='done';draw();if(code)await db.from('live_arrivals').insert({session_code:code,athlete_name:n,repeat_no:rep,elapsed_ms:Math.round(ms),target_text:t?fmt(t.lo)+'–'+fmt(t.hi):'',rest_text:t?fmt(t.restLo)+'–'+fmt(t.restHi):''})}function tick(){if(running){let e=(Date.now()-repStart)/1000,g=Number($('gap').value)||0,next=Math.floor(e/g);ath().forEach((n,i)=>{if(!arr[n])statuses[n]=i===next?'swim':i===next+1?'next':''});let current=ath()[Math.min(next,ath().length-1)],until=(next+1)*g-e;if(e<g*ath().length){$('signal').textContent=until<=1&&next+1<ath().length?'HAZIRLAN • '+ath()[next+1]:current+' • YÜZ';$('signal').className='signal '+(until<=1?'ready':'go');$('who').textContent='Sıralı çıkış • '+g+' sn'}else{$('signal').textContent='YÜZÜYOR';$('signal').className='signal go'}$('clock').textContent=fmt(e);$('total').textContent=fmt((totalBase+Date.now()-totalStart)/1000);draw()}requestAnimationFrame(tick)}$('start').onclick=start;$('nextRep').onclick=nextRep;$('prevSet').onclick=()=>move(-1);$('nextSet').onclick=()=>move(1);$('finishButtons').onclick=e=>{let b=e.target.closest('[data-i]');if(b)arrived(Number(b.dataset.i))};$('gap').onchange=()=>{draw();push()};$('planBtn').onclick=()=>{$('plan').classList.toggle('on');plan()};$('finishWorkout').onclick=()=>{if(running){totalBase+=Date.now()-totalStart;running=false}localStorage.setItem('ks_last_live_session',JSON.stringify({ended:new Date().toISOString(),workout:w,total_ms:totalBase,code}));push();alert('Antrenman kaydedildi.');location.href='v26-athlete-development.html'};draw();createSession();tick();
