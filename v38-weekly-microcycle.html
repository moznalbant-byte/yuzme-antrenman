<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Haftalık Mikro Döngü</title><style>body{margin:0;background:#07111f;color:#fff;font-family:system-ui}.app{max-width:1100px;margin:auto;padding:14px}.card{background:#101d2d;border:1px solid #294058;border-radius:16px;padding:14px;margin:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s{background:#081421;border-radius:12px;padding:11px;cursor:pointer}.s:hover{outline:2px solid #f97316}.s b{color:#fde68a}.muted{color:#9fb0c2;font-size:12px}.meter{height:7px;background:#17283b;border-radius:99px;overflow:hidden;margin:7px 0}.meter i{display:block;height:100%;background:#f97316}.tag{display:inline-block;background:#17283b;border-radius:99px;padding:5px 8px;margin:2px;font-size:12px}.orange{color:#f97316}button{padding:10px;border:0;border-radius:9px;background:#f97316;color:white;font-weight:900;cursor:pointer}select{padding:10px;border-radius:10px;background:#fff4bf;font-weight:bold}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div style="position:fixed;right:8px;top:8px;z-index:999"><button onclick="location.href='v33-desktop-manager.html'" style="border:0;border-radius:9px;padding:9px;background:#17283b;color:#fff;font-weight:800">⌂ YÖNETİM</button></div><div class='app'><div class='card'><div style='display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap'><b class='orange'>HAFTALIK MİKRO DÖNGÜ</b><div><button id='annualBtn'>← YILLIK PLAN</button> <button id='dailyBtn'>GÜNLÜK ANTRENMAN →</button></div></div><h1 id='title'></h1><select id='profile'><option>8–10 Yaş Gelişim</option><option selected>13–16 Orta Mesafe</option><option>13–16 Sprint</option><option>13–16 Uzun Mesafe</option><option>13–16 Branşçı</option></select><p id='phase' class='muted'></p></div><div id='sessions' class='grid'></div></div><script>const $=x=>document.getElementById(x),base=[['Pazartesi','OFF','Toparlanma'],['Salı Sabah','Aerobik taban + teknik','A1/A2 • Teknik'],['Salı Akşam','Ana kalite','END2/A3'],['Çarşamba','Teknik + toparlanma','A1 • Teknik'],['Perşembe Sabah','Aerobik güç','A2/A3'],['Perşembe Akşam','Yarışa özgü kalite','END3/RP'],['Cuma','Toparlanma + beceri','A1 • Teknik'],['Cumartesi Sabah','Kapasite','END2/A3'],['Cumartesi Akşam','Hız / yarış becerisi','SPR/RP'],['Pazar Sabah','Profil ana seti','Profil bazlı'],['Pazar Akşam','Aerobik toparlanma + teknik','A1/A2 • Teknik']],pm={'8–10 Yaş Gelişim':.62,'13–16 Orta Mesafe':1,'13–16 Sprint':.82,'13–16 Uzun Mesafe':1.12,'13–16 Branşçı':.92};function render(){let p;try{p=JSON.parse(localStorage.getItem('ks_periodization_v3')||localStorage.getItem('ks_periodization')||'null')}catch(e){}let prof=$('profile').value,a=p?.active||['','','Genel Hazırlık','Teknik taban + aerobik kapasite','A1/A2',75,60],rec=p?.recoveryWeek||false,week=p?.week||1,sel=p?.selectedDate||localStorage.getItem('ks_plan_date')||new Date().toISOString().slice(0,10),sd=new Date(sel+'T12:00:00'),dow=sd.getDay(),monday=new Date(sd);monday.setDate(sd.getDate()-((dow+6)%7));let weekStart=monday.toISOString().slice(0,10),weekEnd=new Date(monday);weekEnd.setDate(monday.getDate()+6);weekEnd=weekEnd.toISOString().slice(0,10),load=Math.round(a[5]*(rec?.78:1)*pm[prof]);$('title').textContent='Hafta '+week+' • '+prof+' • '+weekStart.slice(8)+'/'+weekStart.slice(5,7)+'–'+weekEnd.slice(8)+'/'+weekEnd.slice(5,7);$('phase').textContent=a[2]+' • '+a[3]+' • '+(rec?'Toparlanma':'Yüklenme')+' mikro döngüsü • Göreli hacim '+load+'%';let rendered=[],weights=[0,.95,1.12,.72,.98,1.12,.68,1.08,1.02,1.12,.78],phase=a[2].toUpperCase(),doublePM=new Set([2,5,8,10]);if(phase.includes('GENEL'))weights=[0,1.02,1.05,.78,1.02,1.04,.74,1.04,.86,1.08,.82];if(phase.includes('ÖZEL'))weights=[0,.94,1.10,.70,1.00,1.14,.66,1.10,1.04,1.14,.76];if(phase.includes('YARIŞ HAZIR'))weights=[0,.86,1.08,.66,.92,1.18,.62,1.02,1.16,1.12,.70];if(phase.includes('TAPER'))weights=[0,.66,.82,.55,.64,.90,.52,.68,.88,.76,.55];if(phase.includes('ANA YARIŞ'))weights=[0,.48,.68,.42,.48,.72,.40,.52,.70,.58,.44];if(phase.includes('GEÇİŞ'))weights=[0,.55,.58,.50,.58,.55,.50,.58,.52,.55,.50];let renderedLoads=[];$('sessions').innerHTML=base.map((s,i)=>{let e=s[2],g=s[1];if(a[2].includes('Taper')){e=(i===5||i===8)?'RP • SPR':'A1 • Teknik';g=(i===5||i===8)?'Kısa yarış kalitesi':'Hacim düşük, teknik kalite'}if(prof.includes('Sprint'))e=e.replace('END2/A3','SPR1/SPR3 • A2');if(prof.includes('Uzun'))e=e.replace('SPR/RP','A2/A3 • RP');if(prof.includes('Branşçı')){e=e.replace('END2/A3','END2/END3 • Teknik').replace('SPR/RP','RP • Branş tekniği');g=g==='Profil ana seti'?'Branşa özgü ana set':g;}if(prof.includes('8–10'))e=e.replace('END3/RP','Teknik • kısa RP').replace('END2/A3','A2 • Teknik').replace('END2','A2');let unitLoad=i?Math.max(25,Math.round(load*weights[i])):0;renderedLoads[i]=unitLoad;rendered[i]=[s[0],g,e,unitLoad];let d=new Date(monday);d.setDate(monday.getDate()+([0,1,1,2,3,3,4,5,5,6,6][i]||0));let ds=d.toISOString().slice(0,10);return '<div class=s data-i="'+i+'" data-date="'+ds+'"><b>'+s[0]+' • '+ds.slice(8)+'/'+ds.slice(5,7)+'</b><h3>'+g+'</h3><span class=tag>'+e+'</span><span class=tag>'+(i?'120 dk birim':'Dinlenme')+'</span><span class=tag>'+(i&&doublePM.has(i)?'Çift gün • 2. birim':i?'Günün birimi':'OFF')+'</span>'+(i?'<div class=meter><i style="width:'+Math.min(100,unitLoad)+'%"></i></div>':'')+'<p class=muted>'+(i?'Birim yük hedefi '+unitLoad+'% • Haftalık grup yükü '+load+'% • '+(doublePM.has(i)?'Önceki birimden sonra kalite/toparlanma dengesi korunur.':'Günlük birim bu amaçtan üretilecek.'):'Tam dinlenme / gerektiğinde mobilite.')+'</p></div>'}).join('');localStorage.setItem('ks_weekly_microcycle',JSON.stringify({version:1,week,profile:prof,phase:a[2],recovery:rec,relativeLoad:load,selectedDate:sel,weekStart,weekEnd,sessions:rendered,sessionLoads:renderedLoads,totalWaterSessions:10,doubleDays:['Salı','Perşembe','Cumartesi','Pazar'],singleDays:['Çarşamba','Cuma'],offDay:'Pazartesi'}))}function openSession(i,date){if(i===0)return;let p;try{p=JSON.parse(localStorage.getItem('ks_periodization_v3')||localStorage.getItem('ks_periodization')||'null')}catch(e){}let prof=$('profile').value,a=p?.active||['','','Genel Hazırlık','Teknik taban + aerobik kapasite','A1/A2',75,60],wm;try{wm=JSON.parse(localStorage.getItem('ks_weekly_microcycle')||'null')}catch(e){}let s=wm?.sessions?.[i]||base[i],rec=p?.recoveryWeek||false,chosen=date||p?.selectedDate||localStorage.getItem('ks_plan_date');if(chosen)localStorage.setItem('ks_plan_date',chosen);localStorage.setItem('ks_session_context',JSON.stringify({version:2,date:chosen,day:s[0],goal:s[1],energy:s[2],unitLoad:s[3]||load,profile:prof,phase:a[2],phaseGoal:a[3],week:p?.week||1,recovery:rec,durationMin:120,created:new Date().toISOString()}));location.href='v21-daily-workout.html'}$('sessions').onclick=e=>{let x=e.target.closest('[data-i]');if(x)openSession(Number(x.dataset.i),x.dataset.date)};$('annualBtn').onclick=()=>location.href='v37-annual-periodization.html';$('dailyBtn').onclick=()=>openSession(2);$('profile').onchange=render;render()</script></body></html>
