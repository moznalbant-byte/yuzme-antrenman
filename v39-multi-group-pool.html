<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çoklu Grup Havuz</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui}.app{max-width:1150px;margin:auto;padding:14px}.card{background:#101d2d;border:1px solid #294058;border-radius:17px;padding:14px;margin:8px 0}.orange{color:#f97316}.muted{color:#9fb0c2;font-size:12px}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.g{background:#081421;border:2px solid #294058;border-radius:15px;padding:12px}.g.active{border-color:#f97316}.btn{border:0;border-radius:10px;padding:11px;background:#17283b;color:#fff;font-weight:900;cursor:pointer}.green{background:#16a34a}.primary{background:#f97316}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{display:inline-block;background:#17283b;border-radius:99px;padding:5px 8px;margin:2px}.select{width:100%;padding:11px;border:0;border-radius:10px;background:#fff4bf;font-weight:900}.slot{display:grid;grid-template-columns:1fr 1fr;gap:8px}.clock{font-size:38px;font-weight:950;color:#fde68a}@media(max-width:750px){.app{padding:8px}.groups,.slot{grid-template-columns:1fr}.btn{min-height:48px}.clock{font-size:44px}.row{flex-wrap:wrap}.g{padding:10px}}</style></head><body><div class="app"><div class="row"><b><span class="orange">ÇOKLU GRUP HAVUZ</span> • KONTROL MERKEZİ</b><button class="btn" onclick="location.href='v34-device-home.html'">⌂ CİHAZLAR</button></div><div class="card"><h1>Aynı havuzda bağımsız gruplar</h1><p class="muted">Her grup kendi antrenman dosyası, seti, tekrar sayacı, genel kronometresi ve telefon seans koduyla çalışır. Bir grubu açmak diğerini durdurmaz.</p><div class="slot"><label>Grup 1<select id="g1" class="select"></select></label><label>Grup 2<select id="g2" class="select"></select></label></div><button id="prepare" class="btn primary" style="width:100%;margin-top:9px">GRUPLARI HAZIRLA + TELEFON KODU ÜRET</button></div><div id="groups" class="groups"></div></div><script>
const URL='https://npsnbbrskgxuyossjvnc.supabase.co',KEY='sb_publishable_jtLARIT9HuqTCmbIMxCNQQ_XQLwEyjj',db=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);let groups=[];try{groups=JSON.parse(localStorage.getItem('ks_training_groups')||'[]')}catch(e){}let sessions={};function opts(){let h='<option value="">Grup seç</option>'+groups.map(g=>'<option value="'+g.id+'">'+g.name+'</option>').join('');$('g1').innerHTML=h;$('g2').innerHTML=h}function savedWorkout(id){try{return JSON.parse(localStorage.getItem('ks_group_workout_'+id)||'null')}catch(e){return null}}function currentWorkout(){try{return JSON.parse(localStorage.getItem('ks_v21_workout')||'null')}catch(e){return null}}async function prepare(){if($('g1').value&&$('g1').value===$('g2').value)return alert('Aynı grup iki alana seçilemez.');sessions={};[$('g1').value,$('g2').value].filter(Boolean).forEach((id,k)=>{let g=groups.find(x=>x.id===id),w=savedWorkout(id);if(!w){let cur=currentWorkout();if(cur?.group?.id===id)w=cur}sessions[id]={group:g,workout:w,set:0,rep:1,running:false,start:0,total:0,totalStart:0,code:(String(k+1)+Math.random().toString(36).slice(2,7)).slice(0,6).toUpperCase()}});localStorage.setItem('ks_multi_pool',JSON.stringify(sessions));for(const [id,s] of Object.entries(sessions)){if(s.workout){let state={running:false,set_index:0,rep:1,started_at:null,gap:3,total_elapsed_ms:0,multi_group:true,group_id:id};let {error}=await db.from('live_sessions').insert({code:s.code,group_name:s.group.name,workout:s.workout,state});s.cloud=!error}}save();draw()}function draw(){$('groups').innerHTML=Object.entries(sessions).map(([id,s])=>{let q=s.workout?.sets?.[s.set];return '<div class="g '+(s.running?'active':'')+'"><div class="row"><h2 style="margin:0">'+s.group.name+'</h2><span class="badge">'+s.code+'</span><span class="badge">'+(s.cloud?'CANLI':'YEREL')+'</span></div><div class="muted">'+s.group.age+' • '+s.group.profile+' • '+s.group.pool+' • '+s.group.members.length+' sporcu</div><hr style="border-color:#294058"><b>'+(q?(q.r+' × '+q.d+' m • '+q.z+' • '+q.s):'Bu grup için günlük antrenman hazırlanmadı')+'</b><div class="clock" id="c_'+id+'">0:00.0</div><div class="row"><span>Tekrar '+s.rep+'/'+(q?.r||'—')+'</span><span>Set '+(s.set+1)+'/'+(s.workout?.sets?.length||'—')+'</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button class="btn green" onclick="toggle(\''+id+'\')">'+(s.running?'DURDUR':'BAŞLAT')+'</button><button class="btn" onclick="nextRep(\''+id+'\')">SONRAKİ TEKRAR</button><button class="btn" onclick="move(\''+id+'\',-1)">← SET</button><button class="btn primary" onclick="move(\''+id+'\',1)">SET →</button></div><button class="btn" style="width:100%;margin-top:6px" onclick="openTablet(\''+id+'\')">BU GRUBU CANLI TABLETTE AÇ</button></div>'}).join('')||'<div class="card muted">İki grup seçip GRUPLARI HAZIRLA.</div>'}window.toggle=id=>{let s=sessions[id];if(!s.workout)return alert('Önce bu grup için Günün Antrenmanı hazırlanmalı.');if(s.running){s.total+=Date.now()-s.totalStart;s.running=false}else{s.running=true;s.start=Date.now();s.totalStart=Date.now()}save();draw()};window.nextRep=id=>{let s=sessions[id],q=s.workout?.sets?.[s.set];if(!q)return;s.rep=Math.min(q.r,s.rep+1);s.start=Date.now();if(!s.running){s.running=true;s.totalStart=Date.now()}save();draw()};window.move=(id,d)=>{let s=sessions[id];if(!s.workout)return;s.set=Math.max(0,Math.min(s.workout.sets.length-1,s.set+d));s.rep=1;s.running=false;save();draw()};window.openTablet=id=>{let s=sessions[id];if(!s.workout)return alert('Bu grup için günlük antrenman yok.');localStorage.setItem('ks_v21_workout',JSON.stringify(s.workout));localStorage.setItem('ks_multi_active_group',id);localStorage.setItem('ks_existing_live_code',s.code);location.href='v35-tablet-live-sync.html'};async function cloud(id){let s=sessions[id];if(!s?.cloud)return;let state={running:s.running,set_index:s.set,rep:s.rep,started_at:s.running?new Date(s.start).toISOString():null,gap:3,total_elapsed_ms:Math.round(s.total+(s.running?Date.now()-s.totalStart:0)),multi_group:true,group_id:id};await db.from('live_sessions').update({state,updated_at:new Date().toISOString()}).eq('code',s.code)}function save(){localStorage.setItem('ks_multi_pool',JSON.stringify(sessions));Object.keys(sessions).forEach(cloud)}function tick(){Object.entries(sessions).forEach(([id,s])=>{let el=$('c_'+id);if(el){let ms=s.total+(s.running?Date.now()-s.totalStart:0),sec=ms/1000,m=Math.floor(sec/60);el.textContent=m+':'+(sec-m*60).toFixed(1).padStart(4,'0')}});requestAnimationFrame(tick)}opts();try{sessions=JSON.parse(localStorage.getItem('ks_multi_pool')||'{}')}catch(e){}draw();$('prepare').onclick=prepare;tick();
</script></body></html>
