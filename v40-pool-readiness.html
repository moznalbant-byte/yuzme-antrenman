<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Havuz Hazırlık Kontrolü</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111f;color:#fff;font-family:system-ui}.app{max-width:760px;margin:auto;padding:16px}.card{background:#101d2d;border:1px solid #294058;border-radius:16px;padding:14px;margin:9px 0}.ok{border-left:5px solid #22c55e}.warn{border-left:5px solid #f59e0b}.bad{border-left:5px solid #ef4444}.muted{color:#9fb0c2}.btn{display:inline-block;background:#f97316;color:#fff;text-decoration:none;border:0;border-radius:10px;padding:11px;font-weight:900;margin:4px}</style></head><body><div style="position:fixed;right:8px;top:8px;z-index:999"><button onclick="location.href='v33-desktop-manager.html'" style="border:0;border-radius:9px;padding:9px;background:#17283b;color:#fff;font-weight:800">⌂ YÖNETİM</button></div><div class="app"><h1>Bugün Havuz Hazırlık Kontrolü</h1><p class="muted">Bu ekran mevcut cihazdaki plan, grup, günlük antrenman ve canlı veritabanı bağlantısını kontrol eder.</p><div id="checks"></div><div class="card"><a class="btn" href="v21-daily-workout.html">Günlük Antrenman</a><a class="btn" href="v39-multi-group-pool.html">Çoklu Grup</a><a class="btn" href="v35-tablet-live-sync.html">Canlı Tablet</a><a class="btn" href="v36-manual-pool.html">Manuel Yedek</a></div></div><script>const db=supabase.createClient('https://npsnbbrskgxuyossjvnc.supabase.co','sb_publishable_jtLARIT9HuqTCmbIMxCNQQ_XQLwEyjj'),$=x=>document.getElementById(x);function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}function row(ok,title,text,soft=false){return '<div class="card '+(ok?'ok':soft?'warn':'bad')+'"><b>'+(ok?'✓ ':'')+title+'</b><div class="muted">'+text+'</div></div>'}async function run(){let p=get('ks_periodization'),g=get('ks_training_groups')||[],w=get('ks_v21_workout'),m=get('ks_manual_pool_v1'),h='';h+=row(!!p,'Yıllık plan',p?'Sezon haftası '+p.week+' • '+(p.active?.[2]||'aktif'):'Yıllık plan bu cihazda henüz açılmadı',true);h+=row(g.length>0,'Gruplar',g.length?g.length+' kalıcı grup hazır':'En az bir grup oluştur',true);h+=row(!!(w?.sets?.length),'Bugünün antrenmanı',w?.sets?.length?(w.group?.name||w.age+' '+w.profile)+' • '+w.sets.length+' set':'Canlı havuzdan önce günlük antrenman oluştur',false);h+=row(!!m,'Offline yedek',m?'Bu cihazda manuel havuz kaydı mevcut':'Manuel mod ilk kullanımda cihaz içinde kayıt oluşturur',true);try{let {error}=await db.from('live_sessions').select('code',{head:true,count:'exact'}).limit(1);h+=row(!error,'Canlı veritabanı',error?'Bağlantı kurulamadı: '+error.message:'Supabase bağlantısı hazır',false)}catch(e){h+=row(false,'Canlı veritabanı','Ağ bağlantısı yok; Manuel Havuz kullanılabilir',true)}$('checks').innerHTML=h}run()</script></body></html>
