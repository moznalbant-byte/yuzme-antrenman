<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V23 Test Merkezi</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui}.app{max-width:900px;margin:auto;padding:16px}.card{background:#101d2d;border:1px solid #294058;border-radius:18px;padding:16px;margin:12px 0}.orange{color:#f97316}select,input,textarea,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:11px;font-size:16px}select,input,textarea{background:#fff4bf;color:#111;font-weight:800}button{background:#16a34a;color:white;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#9fb0c2}.row{padding:10px;border-bottom:1px solid #294058}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><b><span class="orange">KUMSAL SPOR</span> • V23</b><h1>Test Merkezi</h1><div class="card"><select id="athlete"></select><div class="grid"><input id="date" type="date"><select id="course"><option value="25">25 m</option><option value="50">50 m</option></select><select id="type"><option>50 m Test</option><option>100 m Test</option><option>200 m Test</option><option>400 m Test</option><option>CSS 200/400</option></select><input id="distance" type="number" placeholder="Mesafe (m)"><input id="time" placeholder="Derece sn (örn 65.32)"><input id="css" placeholder="CSS /100 m sn"><input id="rpe" type="number" min="1" max="10" placeholder="RPE 1-10"></div><textarea id="notes" placeholder="Koç notu"></textarea><button id="save">TESTİ KAYDET</button><div id="msg" class="muted"></div></div><div class="card"><h2>Son Testler</h2><div id="history" class="muted">Yükleniyor…</div></div><button onclick="location.href='v34-device-home.html'" style="background:#17283b">← ANA MENÜ</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="v18-data-core.js"></script><script>const $=x=>document.getElementById(x),db=supabase.createClient('https://npsnbbrskgxuyossjvnc.supabase.co','sb_publishable_jtLARIT9HuqTCmbIMxCNQQ_XQLwEyjj');$('date').value=new Date().toLocaleDateString('en-CA');function roster(){let r=window.KSData?.roster?.()||[];$('athlete').innerHTML=r.map(a=>'<option>'+a.name+'</option>').join('')}async function load(){let {data,error}=await db.from('test_results').select('*').order('test_date',{ascending:false}).limit(50);if(error){$('history').textContent='Bulut testleri alınamadı';return}localStorage.setItem('ks_cloud_tests',JSON.stringify(data||[]));$('history').innerHTML=(data||[]).map(x=>'<div class="row"><b>'+x.athlete_name+'</b> • '+x.test_date+' • '+x.test_type+' • '+(x.course||'—')+' m<br>'+(x.time_seconds?'Derece '+x.time_seconds+' sn • ':'')+(x.css_seconds_100?'CSS '+x.css_seconds_100+' sn/100 • ':'')+(x.rpe?'RPE '+x.rpe:'')+'</div>').join('')||'Henüz test yok'}$('save').onclick=async()=>{let row={athlete_name:$('athlete').value,test_date:$('date').value,course:Number($('course').value),test_type:$('type').value,distance:Number($('distance').value)||null,time_seconds:Number($('time').value)||null,css_seconds_100:Number($('css').value)||null,rpe:Number($('rpe').value)||null,notes:$('notes').value||null,payload:{source:'V23 Test Merkezi'}};let {error}=await db.from('test_results').insert(row);$('msg').textContent=error?'Kaydedilemedi: '+error.message:'✓ Test Supabase’e kaydedildi';if(!error)load()};roster();load();</script></body></html>
