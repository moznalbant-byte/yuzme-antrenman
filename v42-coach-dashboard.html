<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V24 Koç Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui}.app{max-width:1200px;margin:auto;padding:14px}.card,.ath{background:#101d2d;border:1px solid #294058;border-radius:16px;padding:14px;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.v{font-size:25px;font-weight:950;color:#fde68a}.muted{color:#9fb0c2;font-size:12px}.pill{display:inline-block;background:#17283b;border-radius:999px;padding:5px 8px;margin:3px;font-size:12px}.warn{border-left:4px solid #f59e0b}.bad{border-left:4px solid #ef4444}.good{border-left:4px solid #22c55e}.orange{color:#f97316}.bar{height:9px;background:#1d3044;border-radius:9px;overflow:hidden}.fill{height:100%;background:#22c55e}.btn{display:inline-block;text-decoration:none;background:#17283b;color:#fff;padding:10px 12px;border-radius:10px;font-weight:900;margin:4px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><b><span class="orange">KUMSAL SPOR</span> • V24 KOÇ DASHBOARD</b><h1>Takımın bugünkü resmi</h1><div id="top" class="grid"></div><div class="card"><b>ENERJİ SİSTEMİ • SON 7 GÜN ÖLÇÜLEN TEKRARLAR</b><div id="zones"></div></div><div class="card"><b>SPORCU DURUMLARI</b><div id="athletes">Yükleniyor…</div></div><div><a class="btn" href="v21-daily-workout.html">🏊 Antrenman</a><a class="btn" href="v41-test-center.html">🧪 Test Merkezi</a><a class="btn" href="v26-athlete-development.html">📈 Gelişim</a><a class="btn" href="v34-device-home.html">⌂ Ana Menü</a></div></div><script src="v18-data-core.js"></script><script>const db=supabase.createClient('https://npsnbbrskgxuyossjvnc.supabase.co','sb_publishable_jtLARIT9HuqTCmbIMxCNQQ_XQLwEyjj'),$=x=>document.getElementById(x);function days(d){return Math.floor((Date.now()-new Date(d+'T12:00:00'))/86400000)}function metric(t,v,s=''){return '<div class="card"><span class="muted">'+t+'</span><div class="v">'+v+'</div><span class="muted">'+s+'</span></div>'}async function boot(){let [hr,tr,lr]=await Promise.all([db.from('workout_history').select('*').order('workout_date',{ascending:false}).limit(100),db.from('test_results').select('*').order('test_date',{ascending:false}).limit(200),db.from('live_arrivals').select('*').order('created_at',{ascending:false}).limit(3000)]),hist=hr.data||[],tests=tr.data||[],live=lr.data||[];localStorage.setItem('ks_cloud_tests',JSON.stringify(tests));localStorage.setItem('ks_workout_history',JSON.stringify(hist.map(x=>({id:x.id,date:x.workout_date,session:x.session,group:x.training_group,course:String(x.course||''),athletes:x.athletes||[],absent:x.absent||[],rpe:x.rpe,tech:x.technique_quality,note:x.coach_note,results:x.results||[]}))));let roster=KSData.roster(),last7=live.filter(x=>days((x.workout_date||x.created_at||'').slice(0,10))<=7),abs=hist.slice(0,12).reduce((a,x)=>a+(x.absent||[]).length,0),rpes=hist.slice(0,12).map(x=>Number(x.rpe)).filter(Boolean);$('top').innerHTML=metric('SPORCU',roster.length)+metric('SON 7 GÜN ÖLÇÜM',last7.length)+metric('SON 12 SEANS DEVAMSIZLIK',abs)+metric('RPE ORT.',rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1):'—');let by={};last7.forEach(x=>{let z=x.energy_zone||'Diğer';by[z]=(by[z]||0)+1});let max=Math.max(1,...Object.values(by));$('zones').innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([z,n])=>'<div style="margin:8px 0"><b>'+z+'</b> • '+n+'<div class="bar"><div class="fill" style="width:'+n/max*100+'%"></div></div></div>').join('')||'<p class="muted">Son 7 günde ölçülen tekrar yok.</p>';$('athletes').innerHTML=roster.map(a=>{let name=a.name,ats=tests.filter(x=>x.athlete_name===name),last=ats[0],due=!last||days(last.test_date)>=28,absent=hist.filter(x=>(x.absent||[]).includes(name)).slice(0,8).length,zones=['END2','END3','SPR2','RP'].map(z=>({z,a:KSData.adaptation(name,z,'25')})).filter(x=>x.a&&x.a.samples>=4),worst=zones.sort((x,y)=>(y.a.dropPct||0)-(x.a.dropPct||0))[0],cls=worst&&worst.a.dropPct>5?'bad':due?'warn':'good';return '<div class="ath '+cls+'"><b>'+name+'</b><br><span class="pill">Son test: '+(last?last.test_date:'YOK')+'</span><span class="pill">'+(due?'🧪 TEST GEREKİYOR':'Test güncel')+'</span><span class="pill">Son 8 seans yok: '+absent+'</span>'+(worst?'<br><span class="pill">'+worst.z+' pace düşüşü: '+worst.a.dropPct+'%</span><span class="pill">'+worst.a.reason+'</span>':'<br><span class="muted">Adaptasyon için yeterli ölçülen kalite seti henüz yok.</span>')+'</div>'}).join('')}boot();</script></body></html>
